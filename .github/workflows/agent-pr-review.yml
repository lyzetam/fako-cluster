# Record an agent's PR verdict under a DIFFERENT GitHub identity.
#
# Output: an `agent-review` check run on the PR head SHA (success = approve,
# failure = request_changes, neutral = comment) plus the job summary. It used to
# POST a PR review, which emailed the PR author (the owner's account, since Sol
# opens PRs with the owner's PAT) on every verdict. A check run sends no
# review notification. zi's merge_if_trivial keys on this check.
#
# Why this exists: Sol opens agent-proposed PRs with the same PAT that Vera
# reviews with, and GitHub refuses APPROVE / REQUEST_CHANGES on a pull request
# opened by the token's own account (bare 422). Both blocking verdicts were
# therefore unavailable — verified against the live API — leaving only COMMENT.
#
# GITHUB_TOKEN inside Actions acts as `github-actions[bot]`, which is NOT the
# PR author, so it can record a real verdict. Vera dispatches here when the
# direct call is refused.
#
# This workflow is a privileged path (it can approve PRs), so it validates its
# own inputs rather than trusting the caller:
#   - the PR must be OPEN and its head branch must start with `agent/fix/`,
#     so this cannot be used to approve a human's or Renovate's PR
#   - the verdict must be one of approve / request_changes / comment
#   - a blocking verdict must carry a substantive body
name: Agent PR Review

on:
  repository_dispatch:
    types: [agent-pr-review]

permissions:
  contents: read
  pull-requests: read   # gh pr view only; nothing is posted to the PR
  checks: write         # the agent-review check run

jobs:
  submit-review:
    name: Record agent-review check as github-actions[bot]
    runs-on: ubuntu-latest
    steps:
      - name: Validate the request
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.client_payload.pr }}
          VERDICT: ${{ github.event.client_payload.verdict }}
          BODY: ${{ github.event.client_payload.body }}
        run: |
          set -euo pipefail
          # Every payload field is attacker-controllable on repository_dispatch,
          # so each one arrives via env (never interpolated into a command) and
          # is defaulted here so `set -u` can't abort before validation runs.
          PR="${PR:-}"; VERDICT="${VERDICT:-}"; BODY="${BODY:-}"

          case "$VERDICT" in
            approve|request_changes|comment) ;;
            *) echo "::error::Unknown verdict '$VERDICT'"; exit 1 ;;
          esac

          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::PR must be a number, got '$PR'"; exit 1
          fi

          if [ "$VERDICT" != "comment" ] && [ "${#BODY}" -lt 20 ]; then
            echo "::error::A blocking verdict needs a substantive body"; exit 1
          fi

          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)

          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR is $state, not OPEN"; exit 1
          fi

          # The whole point of the reviewer is that it only touches what an
          # agent proposed. Enforced here too, not just in the calling tool.
          case "$head" in
            agent/fix/*) ;;
            *) echo "::error::PR #$PR head '$head' is not agent-proposed"; exit 1 ;;
          esac

          echo "Validated PR #$PR ($head) for verdict '$VERDICT'"

          # Pin the commit being reviewed. The review is later submitted
          # against this exact SHA, so a push that lands mid-run cannot pick
          # up a verdict formed on an older head.
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected head SHA '$sha'"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          case "$VERDICT" in
            approve) conclusion=success ;;
            request_changes) conclusion=failure ;;
            comment) conclusion=neutral ;;
          esac
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

          # Callers re-dispatch on a timer. Skip only when the NEWEST completed
          # `agent-review` check by github-actions on this exact commit already
          # has the same conclusion (failure included). A different verdict or
          # a new commit always records. "Newest" = highest id across all pages
          # (jq -s). Fail closed: if the lookup fails, the step exits non-zero
          # and nothing is recorded.
          if ! runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=agent-review&filter=all&per_page=100" --paginate); then
            echo "::error::Could not list agent-review checks on $sha; not recording"; exit 1
          fi
          latest=$(printf '%s' "$runs" | jq -s -r --arg sha "$sha" '
            [ .[].check_runs[] | select(.name == "agent-review"
                                        and .app.slug == "github-actions"
                                        and .head_sha == $sha
                                        and .status == "completed") ]
            | sort_by(.id) | last | .conclusion // ""')
          skip=false
          if [ "$latest" = "$conclusion" ]; then
            echo "Newest agent-review check on $sha is already $conclusion; skipping"
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Record the agent-review check
        if: steps.validate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.client_payload.pr }}
          VERDICT: ${{ github.event.client_payload.verdict }}
          BODY: ${{ github.event.client_payload.body }}
          REVIEWER: ${{ github.event.client_payload.reviewer }}
          SHA: ${{ steps.validate.outputs.sha }}
          CONCLUSION: ${{ steps.validate.outputs.conclusion }}
        run: |
          set -euo pipefail
          BODY="${BODY:-}"; VERDICT="${VERDICT:-}"; PR="${PR:-}"
          # Bound the attribution string — it is display text, not a command,
          # but an unbounded payload field has no business in the body either.
          REVIEWER=$(printf '%s' "${REVIEWER:-}" | tr -cd 'A-Za-z0-9 _.-' | cut -c1-40)

          # Attribute the verdict to the agent that formed it — the API identity
          # is github-actions[bot], which says nothing about who reviewed.
          # Check-run summaries are capped at 65535 chars.
          printf '%s\n\n---\n_Reviewed by **%s** (zi code-reviewer) for PR #%s. Recorded as a check run, not a PR review, so it sends no email. A human still merges._\n' \
            "$BODY" "${REVIEWER:-the zi code-reviewer}" "$PR" | head -c 60000 > /tmp/review-body.md

          # Pinned to the SHA validated above; a push mid-run cannot pick up a
          # verdict formed on an older head.
          jq -n --arg sha "$SHA" --arg c "$CONCLUSION" --arg v "$VERDICT" \
                --rawfile summary /tmp/review-body.md \
            '{name: "agent-review", head_sha: $sha, status: "completed",
              conclusion: $c,
              output: {title: ("Agent review: " + $v), summary: $summary}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input - > /dev/null

          { echo "## Agent review: $VERDICT on PR #$PR at ${SHA:0:7}"; echo; cat /tmp/review-body.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "Recorded agent-review=$CONCLUSION on PR #$PR at $SHA as github-actions[bot]"
