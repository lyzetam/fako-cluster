# infrastructure/controllers/base/k8s-backup/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: backup-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list"]
# namespaces:create removed (2026-10-15). Backup jobs only `kubectl get`/`list`
# and write to filesystem paths named namespaces/; nothing creates a Namespace.
# Leaving create would let backup-sa mint selfheal-* namespaces that zi then
# silently skips (see lyzetam/zi#76 / fako-cluster#379).

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-role
subjects:
- kind: ServiceAccount
  name: backup-sa
  namespace: backup-system
