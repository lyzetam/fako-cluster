# Clears an ARC listener pod stuck Terminating on a dead node.
#
# WHY: on 2026-11-22 thinkpad02 went NotReady at 7:57 AM ET. The listener pod
# on it stayed Terminating (a lost node never confirms deletion), the
# controller will not start a replacement until the old pod is gone, and every
# `fako` job sat queued until the pod was force-deleted by hand.
#
# WHAT IT DELETES: only pods in arc-systems labelled
# app.kubernetes.io/component=runner-scale-set-listener that (1) already have a
# deletionTimestamp older than 120s and (2) sit on a node whose Ready
# condition is not "True". Nothing else, in no other namespace. The listener
# holds no data; the controller recreates it from the AutoscalingListener.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-listener-watchdog
  namespace: arc-systems
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-listener-watchdog
  namespace: arc-systems
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-listener-watchdog
  namespace: arc-systems
subjects:
  - kind: ServiceAccount
    name: arc-listener-watchdog
    namespace: arc-systems
roleRef:
  kind: Role
  name: arc-listener-watchdog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-listener-watchdog-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-listener-watchdog-nodes
subjects:
  - kind: ServiceAccount
    name: arc-listener-watchdog
    namespace: arc-systems
roleRef:
  kind: ClusterRole
  name: arc-listener-watchdog-nodes
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arc-listener-watchdog
  namespace: arc-systems
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: arc-listener-watchdog
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: bitnamilegacy/kubectl:1.33.4
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 100m, memory: 64Mi}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -u
                  now=$(date +%s)
                  kubectl get pods -n arc-systems \
                    -l app.kubernetes.io/component=runner-scale-set-listener \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.deletionTimestamp}{" "}{.spec.nodeName}{"\n"}{end}' |
                  while read -r pod ts node; do
                    [ -n "$ts" ] && [ -n "$node" ] || continue
                    age=$(( now - $(date -d "$ts" +%s) ))
                    [ "$age" -gt 120 ] || continue
                    ready=$(kubectl get node "$node" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
                    if [ "$ready" != "True" ]; then
                      echo "force-deleting $pod: Terminating ${age}s on node $node (Ready=${ready:-missing})"
                      kubectl delete pod -n arc-systems "$pod" --force --grace-period=0
                    fi
                  done
