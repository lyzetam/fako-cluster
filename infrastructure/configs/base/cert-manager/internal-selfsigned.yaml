# Cluster-wide self-signed issuer for internal-only hostnames (e.g. *.local)
# that can never get a public ACME certificate: Let's Encrypt rejects any
# identifier that doesn't end in a public suffix (RFC-reserved TLDs like
# .local are not issuable). Use this issuer instead of letsencrypt-* for
# anything that is only ever reached on the LAN.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-selfsigned
spec:
  selfSigned: {}
