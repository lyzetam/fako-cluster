---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unas-backup-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: unas-backup-check
    prometheus.io/rule: "true"
spec:
  groups:
    - name: unas.backup.alerts
      interval: 60s
      rules:
        # The check job exits non-zero when any UNAS offsite backup target has
        # not received new objects within 35 days, so a failed job IS the alert.
        # Found 2026-09-14, before this existed: the personal-drive task had
        # failed on Sep 1 (drive locked), the monthly task was "Partially
        # Successful" against a drive that no longer existed, and ~955 GB of
        # camera footage on content_inbox was not in any task. The UNAS sends
        # no notification for any of that.
        - alert: UnasOffsiteBackupStale
          expr: |
            kube_job_failed{namespace="unas-backup-check", job_name=~"unas-backup-check-[0-9]+", condition="true"} > 0
          for: 5m
          labels:
            severity: critical
            component: unas-backup-check
          annotations:
            summary: "A UNAS offsite backup target has gone stale in S3"
            description: "The unas-backup-check job failed. `kubectl logs -n unas-backup-check job/{{ $labels.job_name }}` names the target (content_inbox / monthly-task / personal-drive) and how old its newest S3 object is. Exit 2 means the bucket could not be listed at all. The fix is on the UNAS console (Drive > Backup Tasks), not in this cluster."

        # The check going quiet is the failure that hides every other failure.
        # last_SCHEDULE_time, not last_successful_time: the check is designed to
        # exit non-zero while a gap is open, so a liveness rule on success would
        # fire permanently alongside the real alert and get muted. See
        # vault-watchdog-alerts for the full reasoning; this is the same shape.
        - alert: UnasBackupCheckNotRunning
          expr: |
            (time() - max_over_time(kube_cronjob_status_last_schedule_time{namespace="unas-backup-check", cronjob="unas-backup-check"}[24h]) > 129600)
            or absent_over_time(kube_cronjob_status_last_schedule_time{namespace="unas-backup-check", cronjob="unas-backup-check"}[24h])
          for: 1h
          labels:
            severity: critical
            component: unas-backup-check
          annotations:
            summary: "UNAS backup check has not been scheduled in 36h"
            description: "The unas-backup-check CronJob (09:00 cluster-local, daily) has not been scheduled. While it is not running the UNAS offsite backup is unmonitored again — the state in which a failed personal-drive backup and 955 GB of unprotected footage went unnoticed."
