---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault-watchdog-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: vault-watchdog
    prometheus.io/rule: "true"
spec:
  groups:
    - name: vault.watchdog.alerts
      interval: 60s
      rules:
        # The watchdog job exits non-zero when any vault area has stopped
        # receiving writes, so a failed job IS the alert. Measured 2026-08-18,
        # before this existed: Health/Oura Daily had been dead 21 days,
        # Health/Hume Daily 34 days, and Transcripts/argo 131 days — none of it
        # visible anywhere, because 13 of 15 vault writers had no healthcheck
        # and no alert rule mentioned the vault at all.
        - alert: VaultWriterStale
          expr: |
            kube_job_failed{namespace="vault-watchdog", job_name=~"vault-watchdog-[0-9]+", condition="true"} > 0
          for: 5m
          labels:
            severity: critical
            component: vault-watchdog
          annotations:
            summary: "A vault area has stopped receiving writes"
            description: "The vault watchdog failed. `kubectl logs -n vault-watchdog job/{{ $labels.job_name }}` names the area, its owning app, and how stale it is. Exit 2 means the vault API itself was unreachable, which is the whole-vault outage case."

        # The watchdog going quiet is the failure that hides every other
        # failure, so it is alerted on directly.
        #
        # This uses last_SCHEDULE_time, NOT last_successful_time, and the
        # distinction is load-bearing. The watchdog is DESIGNED to exit non-zero
        # whenever any area is stale, so while a real outage is open it never
        # succeeds — a liveness rule built on last_successful_time would fire
        # permanently alongside the genuine alert. A permanently-firing alert
        # gets muted, and a muted watchdog is the state this component exists to
        # prevent. last_schedule_time records when the controller last created a
        # Job, regardless of how that Job exited, so liveness stays independent
        # of findings.
        #
        # It is still a CronJob-level metric on purpose: ttlSecondsAfterFinished
        # garbage-collects Jobs and their metrics, so any Job-level staleness
        # rule cannot fire above that TTL.
        #
        # absent_over_time covers "has never been scheduled at all". Note this
        # will fire once for a newly created CronJob until its first scheduled
        # run lands; that is correct rather than noise, and it self-resolves.
        - alert: VaultWatchdogNotRunning
          expr: |
            (time() - max_over_time(kube_cronjob_status_last_schedule_time{namespace="vault-watchdog", cronjob="vault-watchdog"}[24h]) > 129600)
            or absent_over_time(kube_cronjob_status_last_schedule_time{namespace="vault-watchdog", cronjob="vault-watchdog"}[24h])
          for: 1h
          labels:
            severity: critical
            component: vault-watchdog
          annotations:
            summary: "Vault watchdog has not succeeded in 36h"
            description: "The watchdog runs twice daily (08:00/20:00 cluster-local). While it is not running, every vault writer is unmonitored again — which is the state that let a 131-day outage go unnoticed."
