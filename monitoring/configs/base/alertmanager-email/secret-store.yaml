# SSM Parameter Store (SecureString, Standard tier, AWS-managed aws/ssm key),
# not Secrets Manager. Used only by the Alertmanager email receiver.
#
# PRE-ENABLE: a SOPS-encrypted Secret `alertmanager-ssm-credentials` (keys
# access-key-id, secret-access-key) must exist in the monitoring namespace,
# added in a follow-up PR as aws-credentials-secret.yaml in this directory
# (the kustomization line is commented out until then). Until it exists this
# SecretStore is simply not Ready; nothing else in monitoring depends on it.
#
# That key belongs to IAM user `alertmanager-ssm-reader`, whose only
# permission is ssm:GetParameter on exactly
#   arn:aws:ssm:us-east-1:<acct>:parameter/alertmanager/smtp
# (no GetParameterHistory, no GetParametersByPath, no other parameter).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: alertmanager-ssm
  namespace: monitoring
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: alertmanager-ssm-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: alertmanager-ssm-credentials
            key: secret-access-key
