# SMTP password for the Alertmanager `landry-email` receivers.
#
# /alertmanager/smtp is a SecureString (Standard tier) holding ONLY the SMTP
# password: an AgentMail API key scoped to the sender inbox with send-only
# permission. Host, port, username and From are not secret and live in the
# Alertmanager config (kube-prometheus-stack release.yaml).
#
# The resulting Secret `alertmanager-smtp` is mounted into the Alertmanager
# pod as an optional volume at /etc/alertmanager/smtp/password and read via
# auth_password_file. If this ExternalSecret can't sync, the volume stays
# empty and only the email receivers fail; Alertmanager keeps running.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  secretStoreRef:
    name: alertmanager-ssm
    kind: SecretStore
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /alertmanager/smtp
  refreshInterval: 1h
