# Notifier credentials for Alertmanager (kube-prometheus-stack release.yaml).
#
# Uses SecretStore monitoring/aws-secret-store from PR #386 (Grafana admin);
# this PR DEPENDS ON #386 being merged first. That store's IAM user is renamed
# `monitoring-eso` and its policy is ssm:GetParameter on exactly:
#   arn:aws:ssm:us-east-1:<acct>:parameter/grafana/admin
#   arn:aws:ssm:us-east-1:<acct>:parameter/alertmanager/smtp
#   arn:aws:ssm:us-east-1:<acct>:parameter/alertmanager/healthchecks
# (no GetParameterHistory, no GetParametersByPath). SecureString, Standard
# tier, AWS-managed aws/ssm key.
#
# /alertmanager/smtp: ONLY the SMTP password, an AgentMail API key scoped to
#   the sender inbox with only message_send and an expires_at.
# /alertmanager/healthchecks: JSON
#   {"watchdog_url": "https://hc-ping.com/<uuid-A>",
#    "email_fail_url": "https://hc-ping.com/<uuid-B>/fail"}
#   Two dedicated checks, separate from item 6's cluster-health check.
#
# The Secret is mounted into Alertmanager as an optional volume at
# /etc/alertmanager/notifiers/ (files smtp-password, hc-watchdog-url,
# hc-email-fail-url).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifiers
  namespace: monitoring
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: alertmanager-notifiers
    creationPolicy: Owner
  data:
    - secretKey: smtp-password
      remoteRef:
        key: /alertmanager/smtp
    - secretKey: hc-watchdog-url
      remoteRef:
        key: /alertmanager/healthchecks
        property: watchdog_url
    - secretKey: hc-email-fail-url
      remoteRef:
        key: /alertmanager/healthchecks
        property: email_fail_url
  refreshInterval: 1h
