# monitoring/controllers/base/gpu-monitoring/nvidia-gpu-exporter.yaml
# Alternative to DCGM exporter - simpler nvidia-smi based exporter
apiVersion: v1
kind: Service
metadata:
  name: nvidia-gpu-exporter
  namespace: gpu-monitoring
  labels:
    app: nvidia-gpu-exporter
spec:
  ports:
  - name: metrics
    port: 9835
    targetPort: 9835
    protocol: TCP
  selector:
    app: nvidia-gpu-exporter
  type: ClusterIP

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gpu-exporter
  namespace: gpu-monitoring
  labels:
    app: nvidia-gpu-exporter
spec:
  selector:
    matchLabels:
      app: nvidia-gpu-exporter
  template:
    metadata:
      labels:
        app: nvidia-gpu-exporter
    spec:
      serviceAccountName: dcgm-exporter  # Reuse the same service account
      hostPID: true
      # nvidia.com/gpu.present is what NFD/GFD actually sets. The old selector
      # (nvidia.com/gpu: "true") is a label nothing in this cluster ever applies, so this
      # DaemonSet sat at DESIRED: 0 — silently, with no GPU metrics — from aitower's
      # departure through thinkpad02 joining with a working GPU on 2026-08-12.
      # Note this pod requests no nvidia.com/gpu resource, so it does not contend with
      # whisperx for the single GPU; it reads the host's nvidia-smi directly.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nvidia-gpu-exporter
        image: utkuozdemir/nvidia_gpu_exporter:1.3.2
        imagePullPolicy: IfNotPresent
        args:
        - "--web.listen-address=:9835"
        - "--nvidia-smi-command=nvidia-smi"
        # NOT AUTO. AUTO asks nvidia-smi for every field it knows about, including ECC
        # counters, accounting, retired_pages and driver_model — datacenter/Quadro
        # features a consumer GTX 1650 does not implement. nvidia-smi then exits 12 and
        # the WHOLE scrape fails: measured 2026-08-12 as nvidia_smi_command_exit_code 12
        # with 39 failed scrapes and zero usable metrics.
        # Every field below was verified to return exit 0 on thinkpad02's GTX 1650.
        # power.limit and fan.speed report [N/A] on this card but do not fail the call.
        - "--query-field-names=name,uuid,driver_version,pstate,count,index,memory.total,memory.used,memory.free,utilization.gpu,utilization.memory,temperature.gpu,power.draw,power.limit,fan.speed,clocks.current.sm,clocks.current.memory,clocks.current.graphics"
        ports:
        - name: metrics
          containerPort: 9835
        securityContext:
          privileged: true
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        volumeMounts:
        - name: nvidia-install-dir-host
          mountPath: /usr/local/nvidia
          readOnly: true
        - name: dev
          mountPath: /dev
        - name: nvidia-smi
          mountPath: /usr/bin/nvidia-smi
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9835
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9835
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nvidia-install-dir-host
        hostPath:
          path: /usr/local/nvidia
          type: Directory
      - name: dev
        hostPath:
          path: /dev
      - name: nvidia-smi
        hostPath:
          path: /usr/bin/nvidia-smi
          type: File

---
