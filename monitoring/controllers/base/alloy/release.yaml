apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: alloy
spec:
  interval: 30m
  timeout: 10m
  # Temporarily disabled to allow Alloy to deploy while Loki HelmRelease is stalled
  # dependsOn:
  #   - name: loki
  #     namespace: loki-stack
  chart:
    spec:
      chart: alloy
      version: "0.10.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: alloy
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    alloy:
      # Use our ConfigMap for configuration
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
      
      # Persist Alloy's data (file positions, WAL) on the node instead of the
      # chart default /tmp/alloy, which is lost on every pod restart. Host
      # /var/lib/alloy is mounted at /alloy-data via mounts.extra +
      # controller.volumes.extra.
      # Needed so the k3s audit file source resumes where it stopped after a
      # restart instead of skipping (tail_from_end) or re-shipping the file.
      storagePath: /alloy-data

      # Enable clustering
      clustering:
        enabled: true
      
      # Mount configuration - use the correct format
      mounts:
        # Host filesystem mounts
        varlog: true
        dockercontainers: true
        # Chart 0.10.1 reads extra mounts from alloy.mounts.extra and extra
        # volumes from controller.volumes.extra. (The extraVolumes /
        # extraVolumeMounts lists below are NOT chart keys and render nothing;
        # left untouched here, flagged for cleanup.)
        extra:
          - name: alloy-data
            mountPath: /alloy-data
      
      # Extra volume mounts need to be in extraVolumes/extraVolumeMounts
      extraVolumes:
        - name: pods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
      
      extraVolumeMounts:
        - name: pods
          mountPath: /var/log/pods
          readOnly: true
        - name: journal
          mountPath: /var/log/journal
          readOnly: true
        - name: alloy-data
          mountPath: /alloy-data
          readOnly: false
    
    # Controller configuration
    controller:
      type: daemonset
      hostPID: true  # Required for some log collection
      volumes:
        extra:
          - name: alloy-data
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
    
    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    # Service account - let Helm create it
    serviceAccount:
      create: true
    
    # RBAC - let Helm create it
    rbac:
      create: true
    
    # Security context - adjusted for log collection
    securityContext:
      privileged: true  # Required for accessing host logs
      runAsUser: 0      # Run as root for log access
    
    # ServiceMonitor for self-monitoring
    serviceMonitor:
      enabled: true
      additionalLabels:
        prometheus: kube-prometheus
    
    # Tolerations for all nodes
    tolerations:
      - operator: Exists
