# monitoring/controllers/base/loki-stack/loki-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki-stack
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: "6.30.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: loki-stack
  install:
    crds: Create
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Global configuration for image pull secrets
    global:
      image:
        pullSecrets:
          - dockerhub-registry
    
    # Use single binary deployment for simplicity
    deploymentMode: SingleBinary
    
    loki:
      # Only chown the volume when the ROOT directory's ownership is wrong,
      # instead of walking every file on every pod start.
      #
      # Without this the kubelet defaults to fsGroupChangePolicy: Always, which
      # recursively chowns the entire PVC before the container may start. On
      # 2026-08-18 loki-0 sat in ContainerCreating for 23 HOURS having processed
      # 839,445 files and still climbing — a 100Gi NFS volume holding 30 days of
      # chunks and index files. Log aggregation was down for the whole period,
      # and the only symptom was a pod stuck ContainerCreating with a
      # VolumePermissionChangeInProgress event repeating 1,410 times.
      #
      # OnRootMismatch is safe here: Loki creates these files as uid/gid 10001
      # itself, so once the volume root matches there is nothing to fix below it.
      # The values are the chart's own defaults, restated because setting
      # podSecurityContext replaces the block rather than merging into it.
      podSecurityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch

      # Disable auth
      auth_enabled: false
      
      # Common config with replication_factor: 1 for single binary
      commonConfig:
        replication_factor: 1
      
      # Configure storage - REQUIRED for filesystem
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
          ruler: ruler
          admin: admin
      
      # Rate limits - increased for high log volume
      limits_config:
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 24
        per_stream_rate_limit: 8MB
        per_stream_rate_limit_burst: 12MB
        max_streams_per_user: 0
        max_global_streams_per_user: 0
        retention_period: 720h  # 30 days
      
      # Schema config  
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    
    # Single Binary specific configuration
    singleBinary:
      replicas: 1

      # Persistence configuration
      persistence:
        enabled: true
        storageClass: nfs-csi-v2
        size: 100Gi

      # Resources
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
    
    # Disable microservices mode components
    backend:
      replicas: 0

    read:
      replicas: 0

    write:
      replicas: 0

    # Reduce chunks cache memory (default 9.6Gi is too much for homelab)
    chunksCache:
      enabled: true
      allocatedMemory: 1024  # 1Gi - right-sized for homelab
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 1536Mi

    # Reduce results cache memory
    resultsCache:
      enabled: true
      allocatedMemory: 512  # 512Mi
      resources:
        requests:
          cpu: 25m
          memory: 512Mi
        limits:
          memory: 768Mi
    
