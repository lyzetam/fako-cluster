apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          # PRE-MERGE: a SOPS-encrypted Secret aws-credentials (keys access-key-id,
          # secret-access-key) must exist in the monitoring namespace. It is not in
          # this PR: creating it needs the plaintext AWS keys, which an agent must not handle.
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
