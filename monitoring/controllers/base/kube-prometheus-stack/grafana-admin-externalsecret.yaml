apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  # SSM Parameter Store SecureString /grafana/admin (Standard tier, aws/ssm key) holds JSON;
  # `property` selects the admin-user / admin-password fields.
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
  - secretKey: admin-user
    remoteRef:
      key: /grafana/admin
      property: admin-user
  - secretKey: admin-password
    remoteRef:
      key: /grafana/admin
      property: admin-password
  refreshInterval: 1h
