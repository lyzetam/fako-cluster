apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  # Prometheus WAL replay on restart can take well over Helm's default 5m wait
  # (maximumStartupDurationSeconds is 15000s). Give upgrades headroom + retries so
  # a slow-but-healthy Prometheus startup doesn't stall the release.
  timeout: 30m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 2
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "^87.10.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # Prometheus configuration
    global:
      imagePullSecrets:
        - name: dockerhub-registry
    prometheus:
      prometheusSpec:
        # Enable all ServiceMonitors
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        
        # Enable all PodMonitors
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        
        # Enable all PrometheusRules
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        
        # Resources
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 4Gi
            cpu: 2000m
        
        # Retention
        retention: 30d

        # WAL replay timeout - default is 600s (10min), insufficient for large TSDB
        # 4400 segments × ~3s each = ~13200s needed, set to 15000s (~4.2 hours)
        maximumStartupDurationSeconds: 15000
        
        # Storage
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-csi-v2
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

        # Fix NFS volume permissions (runs as root to chown the volume)
        initContainers:
          - name: fix-permissions
            image: busybox:1.38
            command: ["sh", "-c", "chown -R 1000:2000 /prometheus"]
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-prometheus-db
                mountPath: /prometheus
    
    # Ensure all exporters are enabled
    kubeApiServer:
      enabled: true
    
    kubelet:
      enabled: true
    
    kubeControllerManager:
      enabled: true
    
    coreDns:
      enabled: true
    
    kubeDns:
      enabled: false
    
    kubeEtcd:
      enabled: true
    
    kubeScheduler:
      enabled: true
    
    kubeProxy:
      enabled: true
    
    kubeStateMetrics:
      enabled: true
    
    nodeExporter:
      enabled: true
    
    prometheusOperator:
      enabled: true
    
    # AlertManager configuration - webhook to zI for event-driven monitoring
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m

        # Inhibit rules - suppress less severe alerts when critical fires
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity=~"warning|info"
            equal:
              - namespace
              - alertname

        # Route tree - direct pod/node alerts to zI
        route:
          group_by: ['namespace', 'alertname', 'severity']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: 'default'
          routes:
            # selfheal-test holds deployments that are broken ON PURPOSE
            # (configerror, crashloop, imagepull, notready, unschedulable,
            # oomkill). They fire forever, and every batch reaching zI starts a
            # platform-sre triage run on the Mac Studio fleet: 36 runs in 6h on
            # 2026-09-24, one every ~10 min, each 10-50 min long, so they
            # overlapped and crowded out real work. zI's CLAUDE.md prescribed
            # this exact route on 2026-09-14. First, and continue: false, so
            # neither zi route below sees them; `default` keeps them visible.
            - matchers:
                - namespace="selfheal-test"
              receiver: 'default'
              continue: false

            # Watchdog always fires. It pings an OUTSIDE dead-man's switch
            # (healthchecks.io check "fako-alertmanager-watchdog", separate
            # from item 6's cluster-health check) every 5 minutes. If
            # Prometheus, Alertmanager or the network path dies, the pings stop
            # and healthchecks.io emails Landry from its own infrastructure.
            # Never emailed or sent to zI.
            - matchers:
                - alertname="Watchdog"
              receiver: 'hc-watchdog'
              group_by: ['alertname']
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 5m
              continue: false

            # InfoInhibitor only exists to mute info alerts.
            - matchers:
                - alertname="InfoInhibitor"
              receiver: 'null'
              continue: false

            # Pod alerts with agent label go to zI for investigation
            - matchers:
                - agent=~"k8s-engineer|platform-sre"
              receiver: 'zi-webhook'
              group_wait: 10s
              group_interval: 1m
              repeat_interval: 1h
              continue: true  # Also send to default for visibility

            # Critical alerts always go to zI immediately
            - matchers:
                - severity="critical"
              receiver: 'zi-webhook'
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 30m
              continue: true

            # Email-path failures must not be reported BY email. Alertmanager's
            # own send-failure alerts for the email integration, and config
            # reload failures (a broken config can silently stop email), go to
            # a second, separate healthchecks.io check via its /fail endpoint:
            # the check goes down at once and healthchecks.io emails Landry
            # through its own mail path. zI still saw the criticals above
            # (those routes continue). send_resolved is off because a resolved
            # notice would hit the same /fail URL; reset the check by pinging
            # its success URL after the email path is fixed.
            - matchers:
                - alertname=~"AlertmanagerFailedToSendAlerts|AlertmanagerClusterFailedToSendAlerts"
                - integration="email"
              receiver: 'hc-email-fail'
              group_by: ['alertname']
              group_wait: 1m
              group_interval: 15m
              repeat_interval: 4h
              continue: false
            - matchers:
                - alertname="AlertmanagerFailedReload"
              receiver: 'hc-email-fail'
              group_by: ['alertname']
              group_wait: 1m
              group_interval: 15m
              repeat_interval: 4h
              continue: false

            # Email to Landry (bot-operator design §6: alerts must reach a
            # human). Last, so the zI routes above still see everything they
            # saw before. Critical and warning only; info stays in `default`.
            # The three *Down alerts are excluded because k3s runs the
            # scheduler, controller-manager and proxy inside the k3s binary,
            # where the chart's scrape targets don't exist, so they fire
            # permanently (all three were firing on Oct 14). zI still gets them.
            - matchers:
                - severity=~"critical|warning"
                - alertname!~"KubeSchedulerDown|KubeControllerManagerDown|KubeProxyDown"
              receiver: 'landry-email'
              continue: false
              routes:
                # Criticals: one email per alertname, quickly, resolved too.
                - matchers:
                    - severity="critical"
                  receiver: 'landry-email'
                  group_by: ['alertname']
                  group_wait: 1m
                  group_interval: 15m
                  repeat_interval: 4h
                # Warnings: ONE digest email for all of them (48 distinct
                # warning groups were firing on Oct 14; one email each would
                # be ~290 emails a day). Re-sent every 4h while anything fires.
                - matchers:
                    - severity="warning"
                  receiver: 'landry-email-digest'
                  group_by: ['severity']
                  group_wait: 5m
                  group_interval: 1h
                  repeat_interval: 4h

        receivers:
          - name: 'default'
            # Default receiver - just logs (no external notification)

          - name: 'zi-webhook'
            webhook_configs:
              - url: 'http://zi.zi.svc.cluster.local:8080/webhooks/prometheus'
                send_resolved: true
                max_alerts: 10

          - name: 'null'

          # healthchecks.io ping URLs come from SSM /alertmanager/healthchecks
          # (JSON) via the ExternalSecret in
          # monitoring/configs/base/alertmanager-email/, mounted as files.
          # Never inline: a ping URL lets anyone ping or fail the check.
          - name: 'hc-watchdog'
            webhook_configs:
              - url_file: /etc/alertmanager/notifiers/hc-watchdog-url
                send_resolved: false
                max_alerts: 1
          - name: 'hc-email-fail'
            webhook_configs:
              - url_file: /etc/alertmanager/notifiers/hc-email-fail-url
                send_resolved: false
                max_alerts: 5

          # SMTP via AgentMail (smtp.agentmail.to:465, implicit TLS) on the
          # team's existing AgentMail account. The password is an AgentMail
          # API key scoped to the sender inbox with send-only permission and
          # an expiry. It comes from SSM Parameter Store /alertmanager/smtp
          # through the ExternalSecret in
          # monitoring/configs/base/alertmanager-email/ and is mounted below
          # as a file. It is never in this config.
          #
          # ######## PLACEHOLDER: `to` stays a placeholder until Landry picks
          # ######## his alert address (Mel has asked him). Do not merge with
          # ######## example.invalid. The sender inbox cluster-alerts@agentmail.to
          # ######## must exist before merge (`from` and `auth_username` must be
          # ######## that same AgentMail inbox).
          #
          # Alert annotations must never template log lines or other free
          # text from workloads: whatever an annotation renders is mailed out.
          - name: 'landry-email'
            email_configs:
              - to: 'landry-alerts-placeholder@example.invalid'  # PLACEHOLDER (Landry to pick)
                from: 'Fako cluster alerts <cluster-alerts@agentmail.to>'
                smarthost: 'smtp.agentmail.to:465'
                auth_username: 'cluster-alerts@agentmail.to'
                auth_password_file: /etc/alertmanager/notifiers/smtp-password
                require_tls: true
                send_resolved: true
                headers:
                  Subject: '[fako {{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .Alerts.Firing | len }} firing)'
          - name: 'landry-email-digest'
            email_configs:
              - to: 'landry-alerts-placeholder@example.invalid'  # PLACEHOLDER (Landry to pick)
                from: 'Fako cluster alerts <cluster-alerts@agentmail.to>'
                smarthost: 'smtp.agentmail.to:465'
                auth_username: 'cluster-alerts@agentmail.to'
                auth_password_file: /etc/alertmanager/notifiers/smtp-password
                require_tls: true
                send_resolved: false
                headers:
                  Subject: '[fako] warning digest: {{ .Alerts.Firing | len }} firing'

      alertmanagerSpec:
        # Notifier credentials (SMTP password, healthchecks.io ping URLs) as
        # files. optional: true so a missing Secret never blocks the
        # Alertmanager pod; the kubelet fills the volume once the
        # ExternalSecret creates the Secret, and Alertmanager reads the files
        # at send time (no restart needed).
        # BUT: without the Secret the Watchdog ping can't be sent, so once the
        # healthchecks.io check exists it goes down and stays down, and the
        # email receivers fail (AlertmanagerFailedToSendAlerts). Don't merge
        # before the Secret is synced (see PR #390 merge order).
        volumes:
          - name: notifiers
            secret:
              secretName: alertmanager-notifiers
              optional: true
              defaultMode: 0440
        volumeMounts:
          - name: notifiers
            mountPath: /etc/alertmanager/notifiers
            readOnly: true
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m

    # Grafana configuration
    grafana:
      adminPassword: "admin"
      
      # Default datasources
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-gateway.loki-stack.svc.cluster.local
          jsonData:
            maxLines: 1000
            timeout: 60
        
      # Sidecar configuration
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          provider:
            disableDelete: false
            allowUiUpdates: true
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"
          searchNamespace: ALL
      
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.landryzetam.net
        path: /
        tls: 
          - secretName: grafana-tls-secret
            hosts:
              - grafana.landryzetam.net




