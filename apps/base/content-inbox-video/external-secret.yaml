# The native UniFi backup uses the write-capable `unas-backup` user. The worker
# needs GetObject/ListBucket for the source and PutObject for adjacent sidecars;
# it never needs DeleteObject. Keep this namespace separate from the list-only
# unas-backup-check credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-inbox-video-credentials
  namespace: content-inbox-video
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: content-inbox-video-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: unas-backup/credentials
        property: aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: unas-backup/credentials
        property: aws_secret_access_key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: unas-backup/credentials
        property: aws_region
    - secretKey: SOURCE_S3_BUCKET
      remoteRef:
        key: unas-backup/credentials
        property: s3_bucket
    - secretKey: TWELVELABS_API_KEY
      remoteRef:
        key: twelvelabs/api-key
        property: api_key
