apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: content-inbox-video
resources:
  - namespace.yaml
  - secret-store.yaml
  - external-secret.yaml
  - external-secret-sync.yaml
  - external-secret-dockerhub.yaml
  - networkpolicy.yaml
  - nfs-storage.yaml
  - configmap-sync-script.yaml
