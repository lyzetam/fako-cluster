apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-inbox-video-sync-credentials
  namespace: content-inbox-video
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: content-inbox-video-sync-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: unas-backup/credentials
        property: aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: unas-backup/credentials
        property: aws_secret_access_key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: unas-backup/credentials
        property: aws_region
    - secretKey: SOURCE_S3_BUCKET
      remoteRef:
        key: unas-backup/credentials
        property: s3_bucket
