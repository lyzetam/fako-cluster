apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: family-manager

resources:
  - namespace.yaml
  - secretstore.yaml
  - external-secret.yaml
  - external-secret-dockerhub.yaml
  - redis.yaml
  - deployment.yaml   # family-manager-webhook DISABLED 2026-08-27 pending
                      #  modernization. Uncomment to bring it back.
  - deployment-bot.yaml
  - cronjob-email.yaml
  - service.yaml
  - ingress.yaml
  - cloudflare.yaml

labels:
  - pairs:
      app.kubernetes.io/name: family-manager
      app.kubernetes.io/instance: production
      app.kubernetes.io/component: webhook
      app.kubernetes.io/part-of: family-manager
