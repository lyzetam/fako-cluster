apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: family-manager

resources:
  - namespace.yaml
  - secretstore.yaml
  - external-secret.yaml
  - external-secret-dockerhub.yaml
  - redis.yaml
  # DISABLED 2026-08-27 — family-manager-webhook scaled to zero pending
  # modernization of its build pipeline. The `apps` Kustomization runs with
  # prune: true, so removing it here DELETES the Deployment object; the pods
  # go away and so does the object. Restore by uncommenting this line — Flux
  # recreates it from deployment.yaml, which is untouched.
  #
  # Still declared and still applied: service.yaml, ingress.yaml and
  # cloudflare.yaml all target family-manager-webhook, so the Service will
  # have no endpoints and family-webhook.landryzetam.net will return 503
  # until this comes back. That is expected, not a second fault.
  # - deployment.yaml
  - deployment-bot.yaml
  - cronjob-email.yaml
  - service.yaml
  - ingress.yaml
  - cloudflare.yaml

labels:
  - pairs:
      app.kubernetes.io/name: family-manager
      app.kubernetes.io/instance: production
      app.kubernetes.io/component: webhook
      app.kubernetes.io/part-of: family-manager
