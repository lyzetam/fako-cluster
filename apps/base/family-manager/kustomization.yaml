apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: family-manager

# 2026-10-17 (N7): the public webhook is retired. Its Deployment
# (lzetam/family-manager-webhook:latest), Service, Traefik Ingress
# (landryzetam.net /voice, /webhook), the dedicated cloudflared tunnel and
# its tunnel-credentials ExternalSecret were deleted, not just commented out.
# The webhook code no longer exists (family-manager-bot e9338f2), so any
# webhook image would be a stale build. Do not re-add; a replacement needs a
# new reviewed manifest with a pinned image digest.
# The bot is scaled to 0 and the email CronJob is suspended by the overlay in
# apps/staging/family-manager/kustomization.yaml (#357).
resources:
  - namespace.yaml
  - secretstore.yaml
  - external-secret.yaml
  - external-secret-dockerhub.yaml
  - redis.yaml
  - deployment-bot.yaml  # scaled to 0 by the staging overlay
  - cronjob-email.yaml   # suspended by the staging overlay

labels:
  - pairs:
      app.kubernetes.io/name: family-manager
      app.kubernetes.io/instance: production
      app.kubernetes.io/component: webhook
      app.kubernetes.io/part-of: family-manager
