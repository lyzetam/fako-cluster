# SELF-HEAL HARNESS — deliberately broken. NOT a real workload.
#
# This is a test fixture for the autonomous self-heal path (Noor -> Sol). The
# container allocates 16 MiB every 2 seconds and never frees it, so it OOMKills
# at ANY memory limit — raising the limit only lengthens the interval. Do not
# "fix" it. There is no feed service; nothing consumes this.
#
# Introduced as `feed-cache` by 3a0cc5db (2026-07-14) deliberately disguised as a
# plausible app, because selfheal-test's overt "THROWAWAY/INTENTIONAL test" tells
# made the autonomous path correctly defer. Renamed out of that disguise on
# 2026-08-17 at the operator's request, after it twice consumed real triage time.
#
# TRADEOFF, on the record: naming the namespace restores the tell. The autonomous
# Noor -> Sol loop is now expected to defer on this the way it defers on
# selfheal-test. If you need an undisguised-to-humans but tell-free-to-agents
# harness again, the note in private/feed-cache.md describes how that was done.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-cache
  namespace: selfheal-harness
  labels:
    app.kubernetes.io/name: feed-cache
    app.kubernetes.io/part-of: feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-cache
  template:
    metadata:
      labels:
        app: feed-cache
        app.kubernetes.io/name: feed-cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cache-warmer
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              # Warm the decoded-asset cache and hold it hot for the renderer.
              import time
              cache = []
              while True:
                  cache.append(bytearray(16 * 1024 * 1024))  # ~16 MiB per warmed batch
                  time.sleep(2)
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "50m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
