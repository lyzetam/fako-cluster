# List-only S3 keys for the check. These belong to IAM user unas-backup-check,
# whose only permission is s3:ListBucket on the backup bucket — it cannot read,
# write or delete an object. The UNAS's own offsite task uses a different,
# write-capable user (unas-backup, keys at unas-backup/credentials); those keys
# are deliberately NOT mounted here, because a monitor has no business holding
# DeleteObject on the only off-site copy of 6+ TB.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unas-backup-check-credentials
  namespace: unas-backup-check
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: unas-backup-check-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: unas-backup/check-credentials
        property: aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: unas-backup/check-credentials
        property: aws_secret_access_key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: unas-backup/check-credentials
        property: aws_region
    - secretKey: S3_BUCKET
      remoteRef:
        key: unas-backup/check-credentials
        property: s3_bucket
  refreshInterval: 1h
