apiVersion: batch/v1
kind: CronJob
metadata:
  name: unas-backup-check
  namespace: unas-backup-check
  labels:
    app: unas-backup-check
spec:
  # 09:00 local, daily. The backup it watches runs monthly (1st, 00:00), so
  # once a day is already ~30x its cadence; what matters is that a missed month
  # is noticed within a day of the 35-day limit, not within an hour.
  schedule: "0 9 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # 0, not 1+: staleness is not transient, so a retry would only duplicate
      # the same finding (same reasoning as vault-watchdog).
      backoffLimit: 0
      ttlSecondsAfterFinished: 172800
      # Listing the whole monthly prefix is ~150k keys (measured 2026-09-14,
      # 151,718 objects / 6.66 TB) — about two minutes from a Mac. 15 min is
      # the ceiling before "stuck", not the expected duration.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: unas-backup-check
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # Same image the postgres S3 archive job runs on — proven pullable
              # on this cluster and carries bash + GNU date.
              image: amazon/aws-cli:2.36.25
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/script/check.sh"]
              envFrom:
                - secretRef:
                    name: unas-backup-check-secret
              env:
                - name: MAX_AGE_DAYS
                  value: "35"
                # The CLI wants a writable HOME even with env-var credentials;
                # /tmp is the only writable path with readOnlyRootFilesystem.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: script
              configMap:
                name: unas-backup-check-script
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
