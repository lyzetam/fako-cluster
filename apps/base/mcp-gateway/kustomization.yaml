apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-gateway

# The MCP gateway itself was retired 2026-08-11 (no consumers). What remains
# is the shared cloudflared tunnel, which fronts n8n, the family-manager
# webhook and market-replay -- none of which are MCP.
resources:
  - namespace.yaml
  - cloudflare.yaml
  - cloudflare-secret.yaml
labels:
- pairs:
    app.kubernetes.io/part-of: mcp-gateway
    app.kubernetes.io/managed-by: kustomize
