apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
  namespace: kagent
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: kagent-crds
      # Keep in lockstep with release.yaml.
      version: "0.10.6"
      sourceRef:
        kind: HelmRepository
        name: kagent
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
