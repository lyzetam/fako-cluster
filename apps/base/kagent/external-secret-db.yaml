# Connection string for the kagent controller's session store: database
# `kagent` on the shared CNPG cluster, login role `kagent` (managed in
# apps/base/postgres-cluster/postgres-cluster.yaml). The same AWS SM secret
# feeds the role's password on the CNPG side (external-secret-kagent.yaml).
# Mounted as a file and read through database.postgres.urlFile, so the
# password never lands in the HelmRelease values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-db
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: kagent-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        url: "postgres://kagent:{{ .password | urlquery }}@postgres-cluster-rw.postgres.svc.cluster.local:5432/kagent?sslmode=require"
  data:
  - secretKey: password
    remoteRef:
      key: postgres/kagent-credentials
      property: password
