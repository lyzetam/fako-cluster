# Login for the kagent UI (Traefik basicAuth in ingress.yaml). The UI itself
# has no auth, and anyone who reaches it can create agents in this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-ui-auth
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: kagent-ui-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
  - secretKey: username
    remoteRef:
      key: kagent/ui-basic-auth
      property: username
  - secretKey: password
    remoteRef:
      key: kagent/ui-basic-auth
      property: password
