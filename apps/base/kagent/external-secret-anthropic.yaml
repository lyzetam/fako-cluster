# Anthropic API key "kagent-fako-cluster" (Console, Default workspace, created
# 2026-11-20). Read by the default ModelConfig (providers.anthropic in
# release.yaml), which expects Secret kagent-anthropic / ANTHROPIC_API_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-anthropic
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: kagent-anthropic
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: kagent/anthropic
        property: ANTHROPIC_API_KEY
