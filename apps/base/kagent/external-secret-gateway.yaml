# APISIX key-auth credential for the LLM gateway (`cluster_internal` consumer,
# shared by in-cluster callers; same source as ai-news and autobots). Every
# gateway route, /api/* included, returns 401 without `apikey: <key>`.
# release.yaml injects it into the default ModelConfig's defaultHeaders via
# valuesFrom, so the key never sits in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apisix-gateway-key
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: apisix-gateway-key
    creationPolicy: Owner
  data:
    - secretKey: apikey
      remoteRef:
        key: apisix/cluster-key
        property: APISIX_KEY_CLUSTER
