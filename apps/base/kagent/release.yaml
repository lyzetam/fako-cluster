# kagent 0.10.x: agents run as ordinary Deployments. 1.0 moved every agent into
# Substrate sandboxes (gVisor/microVM runtime on each node, RustFS, pod
# certificates) — a separate infra project, so this stays on the 0.10 line.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: kagent-crds
  chart:
    spec:
      chart: kagent
      # Keep in lockstep with release-crds.yaml.
      version: "0.10.6"
      sourceRef:
        kind: HelmRepository
        name: kagent
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # kagent's Ollama client sends no API key; the gateway key has to travel as a
  # literal header on the ModelConfig. Injected here from the ExternalSecret.
  valuesFrom:
    - kind: Secret
      name: apisix-gateway-key
      valuesKey: apikey
      targetPath: providers.ollama.defaultHeaders.apikey
  values:
    # Controller acts on the kagent namespace only. The UI can create agents
    # (including BYO images), so scoping keeps that to one namespace.
    rbac:
      namespaces:
        - kagent

    # Shared CNPG cluster instead of the chart's bundled dev Postgres.
    database:
      postgres:
        urlFile: /etc/kagent-db/url
        bundled:
          enabled: false
    controller:
      volumes:
        - name: kagent-db
          secret:
            secretName: kagent-db
      volumeMounts:
        - name: kagent-db
          mountPath: /etc/kagent-db
          readOnly: true

    # Mac Studio Ollama fleet through the APISIX gateway's Ollama-native route
    # (/api/*: least_conn across ms1-3, health checks, key-auth via valuesFrom).
    providers:
      default: ollama
      ollama:
        provider: Ollama
        model: "glm-4.7-flash:latest"
        config:
          host: "http://apisix.apisix.svc.cluster.local:9080"
          options:
            # The fleet keeps glm-4.7-flash loaded at ctx 202752. Sending the
            # chart's num_ctx 64000 would make Ollama reload the model on every
            # node, stalling every other caller.
            num_ctx: null

    # Built-in tool server: read-only cluster access (get/list/watch, no
    # Secrets). Changes to the cluster still go through Git.
    kagent-tools:
      rbac:
        readOnly: true
      tools:
        enabledTools:
          - k8s
          - helm
          - prometheus
          - utils
        prometheus:
          url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"

    # Built-in agents: keep what matches this cluster.
    k8s-agent:
      enabled: true
    helm-agent:
      enabled: true
    promql-agent:
      enabled: true
    observability-agent:
      enabled: false
    grafana-mcp:
      enabled: false
    kgateway-agent:
      enabled: false
    istio-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
