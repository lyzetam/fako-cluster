apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
  namespace: langfuse
spec:
  interval: 30m
  # ClickHouse's PVC already holds real data; on every reschedule kubelet does a
  # recursive chown across it over NFS before the container can start, which
  # blows past Helm's default 5m wait (observed: still ContainerCreating at 8m
  # during the thinkpad02 rebalance). Give upgrades headroom + retries, same
  # pattern as kubescape-operator and kube-prometheus-stack.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: langfuse
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: langfuse
        namespace: langfuse
  values:
    # Pinned to thinkpad02 (32Gi) — the whole stack previously had no
    # nodeSelector and the scheduler stacked it onto thinkpad01 (16Gi)
    # alongside loki-stack/kubescape/2 postgres replicas, pushing that node
    # to 91% memory requested / 262% limits overcommitted. That overcommit
    # is what stalled systemd/dbus and wedged kubelet for ~32h on 2026-08-16.
    langfuse:
      nodeSelector:
        kubernetes.io/hostname: thinkpad02
      salt:
        secretKeyRef:
          name: langfuse-secrets
          key: salt

      encryptionKey:
        secretKeyRef:
          name: langfuse-secrets
          key: encryption_key

      nextauth:
        url: "https://langfuse.fako.landryzetam.net"
        secret:
          secretKeyRef:
            name: langfuse-secrets
            key: nextauth_secret

      web:
        replicas: 1
        resources:
          requests:
            memory: "768Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1"
        pod:
          # V8 default heap (~512MB) was OOMing on langfuse 3.175.0 init
          # (Next.js + Prisma + MCP). Raise the heap with explicit
          # --max-old-space-size; the container limit above leaves ~500MB
          # of headroom for non-heap (V8 base, native modules, buffers).
          additionalEnv:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"

      worker:
        replicas: 1
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1"
    # External Postgres (CloudNativePG postgres-cluster)
    postgresql:
      deploy: false
      host: "postgres-cluster-rw.postgres.svc.cluster.local"
      port: 5432
      auth:
        username: "app"
        existingSecret: "langfuse-secrets"
        secretKeys:
          userPasswordKey: postgres_password
        database: "langfuse"
      migration:
        autoMigrate: true

    # ClickHouse — single node for self-hosted
    clickhouse:
      deploy: true
      nodeSelector:
        kubernetes.io/hostname: thinkpad02
      # Default is "Always": a full recursive chown over NFS on every single
      # pod start, regardless of whether ownership is already correct. That's
      # what blew the 10m Deployment progressDeadlineSeconds during the
      # thinkpad02 move (2026-08-17) and caused two failed/rolled-back
      # upgrades. OnRootMismatch skips the walk once the root dir already has
      # the right group ownership — still does the walk once for real change,
      # never again after.
      podSecurityContext:
        fsGroupChangePolicy: OnRootMismatch
      shards: 1
      replicaCount: 1
      clusterEnabled: false
      auth:
        username: "default"
        existingSecret: "langfuse-secrets"
        existingSecretKey: clickhouse_password
      # storageClass MUST be set. Without it the Bitnami subchart falls through
      # to the cluster default (local-path), which pins the volume to one node.
      # That is what happened here: clickhouse landed on aitower, and when that
      # node died the PVC went unschedulable, clickhouse never started, and
      # langfuse-web crashlooped 1500+ times failing its clickhouse migrations
      # ("dial tcp :9000: connect: connection refused"). An aggregated data
      # tier on node-local storage is a single point of failure.
      persistence:
        enabled: true
        size: 50Gi
        storageClass: nfs-csi-v2
      # ClickHouse's bundled ZooKeeper had the same problem.
      zookeeper:
        nodeSelector:
          kubernetes.io/hostname: thinkpad02
        persistence:
          enabled: true
          storageClass: nfs-csi-v2
      # The Bitnami default preset requests 3Gi/1cpu, sized for a real
      # analytics cluster. That fit on aitower (64Gi) but not on what is left
      # after losing it — the largest remaining node had 2.0Gi free, so the pod
      # sat Pending on "Insufficient memory". This is a single-node ClickHouse
      # backing one self-hosted langfuse; 1Gi is ample, with headroom to 3Gi.
      resourcesPreset: "none"
      resources:
        requests:
          cpu: 300m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 3Gi
      migration:
        autoMigrate: true

    # Redis — standalone mode (auth disabled, cluster-internal only)
    redis:
      deploy: true
      architecture: standalone
      cluster:
        enabled: false
      auth:
        enabled: false
      primary:
        nodeSelector:
          kubernetes.io/hostname: thinkpad02
        persistence:
          enabled: true
          storageClass: nfs-csi-v2

    # MinIO — local S3-compatible object store
    s3:
      deploy: true
      nodeSelector:
        kubernetes.io/hostname: thinkpad02
      forcePathStyle: true
      # MinIO root creds come from the independent langfuse-s3 secret
      # (external-secret-minio.yaml ← AWS SM langfuse/minio). Using existingSecret
      # means the chart references — never creates/prunes — the secret, and wires
      # the same creds into langfuse's blob client so OTEL trace ingestion works.
      auth:
        existingSecret: langfuse-s3
        rootUserSecretKey: root-user
        rootPasswordSecretKey: root-password
      persistence:
        enabled: true
        size: 20Gi
        storageClass: nfs-csi-v2

    # Ingress handled separately
    ingress:
      enabled: false
