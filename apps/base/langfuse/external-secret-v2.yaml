# Credentials for the chart 2.x sibling release `langfuse-v2` (release-v2.yaml).
# Same AWS SM sources as chart 1.x where possible, so the data copy can use one
# set of S3 credentials on both sides.
---
# SeaweedFS (replaces Bitnami MinIO). The chart's S3 auth secret format:
# accessKey/secretKey plus the SeaweedFS IAM config built from them
# (mirrors templates/s3/secret.yaml in chart 2.1.6).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-v2-s3
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-store
  target:
    name: langfuse-v2-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accessKey: "{{ .rootUser }}"
        secretKey: "{{ .rootPassword }}"
        seaweedfs_s3_config: |
          {"identities":[{"name":"{{ .rootUser }}","credentials":[{"accessKey":"{{ .rootUser }}","secretKey":"{{ .rootPassword }}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
  data:
    - secretKey: rootUser
      remoteRef:
        key: langfuse/minio
        property: root-user
    - secretKey: rootPassword
      remoteRef:
        key: langfuse/minio
        property: root-password
---
# Valkey ACL users (replaces unauthenticated Bitnami Valkey): one key per
# username; the chart connects as `default`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-v2-redis
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-store
  target:
    name: langfuse-v2-redis
    creationPolicy: Owner
  data:
    - secretKey: default
      remoteRef:
        key: langfuse/credentials
        property: redis_password
