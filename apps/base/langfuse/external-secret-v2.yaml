# Credentials for the chart 2.x sibling release `langfuse-v2` (release-v2.yaml).
# Same AWS SM sources as chart 1.x where possible, so the data copy can use one
# set of S3 credentials on both sides.
---
# SeaweedFS (replaces Bitnami MinIO). The chart's S3 auth secret format:
# accessKey/secretKey plus the SeaweedFS IAM config built from them
# (mirrors templates/s3/secret.yaml in chart 2.1.6).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-v2-s3
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-store
  target:
    name: langfuse-v2-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accessKey: "{{ .rootUser }}"
        secretKey: "{{ .rootPassword }}"
        seaweedfs_s3_config: |
          {"identities":[{"name":"{{ .rootUser }}","credentials":[{"accessKey":"{{ .rootUser }}","secretKey":"{{ .rootPassword }}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
  data:
    - secretKey: rootUser
      remoteRef:
        key: langfuse/minio
        property: root-user
    - secretKey: rootPassword
      remoteRef:
        key: langfuse/minio
        property: root-password
---
# Valkey ACL users (replaces unauthenticated Bitnami Valkey): one key per
# username; the chart connects as `default`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-v2-redis
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-store
  target:
    name: langfuse-v2-redis
    creationPolicy: Owner
  data:
    - secretKey: default
      remoteRef:
        key: langfuse/credentials
        property: redis_password
---
# SeaweedFS security.toml for langfuse-v2 (mounted over the chart's ConfigMap by
# the postRenderer in release-v2.yaml). JWT signing keys come from AWS SM key
# `langfuse/seaweedfs-security` (properties jwt_volume_write, jwt_volume_read,
# jwt_filer_write, jwt_filer_read). That SM key does NOT exist yet; creating it
# needs Landry's OK. The [grpc.*] paths mirror the chart's template
# (seaweedfs 4.23.0 templates/shared/security-configmap.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-v2-s3-security
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-store
  target:
    name: langfuse-v2-s3-security
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        security.toml: |
          [jwt.signing]
          key = "{{ .jwtVolumeWrite }}"
          [jwt.signing.read]
          key = "{{ .jwtVolumeRead }}"
          [jwt.filer_signing]
          key = "{{ .jwtFilerWrite }}"
          [jwt.filer_signing.read]
          key = "{{ .jwtFilerRead }}"
          [grpc]
          ca = "/usr/local/share/ca-certificates/ca/tls.crt"
          [grpc.volume]
          cert = "/usr/local/share/ca-certificates/volume/tls.crt"
          key  = "/usr/local/share/ca-certificates/volume/tls.key"
          [grpc.master]
          cert = "/usr/local/share/ca-certificates/master/tls.crt"
          key  = "/usr/local/share/ca-certificates/master/tls.key"
          [grpc.filer]
          cert = "/usr/local/share/ca-certificates/filer/tls.crt"
          key  = "/usr/local/share/ca-certificates/filer/tls.key"
          [grpc.admin]
          cert = "/usr/local/share/ca-certificates/admin/tls.crt"
          key  = "/usr/local/share/ca-certificates/admin/tls.key"
          [grpc.worker]
          cert = "/usr/local/share/ca-certificates/worker/tls.crt"
          key  = "/usr/local/share/ca-certificates/worker/tls.key"
          [grpc.client]
          cert = "/usr/local/share/ca-certificates/client/tls.crt"
          key  = "/usr/local/share/ca-certificates/client/tls.key"
          [https.client]
          enabled = false
          [https.volume]
          cert = ""
          key  = ""
  data:
    - secretKey: jwtVolumeWrite
      remoteRef:
        key: langfuse/seaweedfs-security
        property: jwt_volume_write
    - secretKey: jwtVolumeRead
      remoteRef:
        key: langfuse/seaweedfs-security
        property: jwt_volume_read
    - secretKey: jwtFilerWrite
      remoteRef:
        key: langfuse/seaweedfs-security
        property: jwt_filer_write
    - secretKey: jwtFilerRead
      remoteRef:
        key: langfuse/seaweedfs-security
        property: jwt_filer_read
