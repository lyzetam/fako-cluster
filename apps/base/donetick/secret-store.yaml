# AWS Secrets Manager store for the donetick namespace. Auths via the
# in-namespace `aws-credentials` bootstrap secret (same pattern as
# hume-collector / withings-collector). The bootstrap secret is a
# SOPS-encrypted file in the staging overlay and must exist before
# donetick is re-enabled in apps/staging/kustomization.yaml.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: donetick
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
