# donetick JWT signing secret. Stored in AWS SM at donetick/jwt-secret
# (a plain string secret, >= 32 chars, freshly generated; the old value
# was committed to git and must never be reused).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-jwt
  namespace: donetick
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: donetick-jwt
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DT_JWT_SECRET: "{{ .secret }}"
  data:
  - secretKey: secret
    remoteRef:
      key: donetick/jwt-secret
  refreshInterval: 1h
