apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        # Restart the connectors when the GitOps-managed ingress map changes.
        config-revision: "content-landryzetam-v3"
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.10.3
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: creds
        secret:
          secretName: tunnel-credentials
      - name: config
        configMap:
          name: cloudflared
          items:
          - key: config.yaml
            path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    # Reusing existing fakocluster tunnel
    tunnel: fakocluster
    credentials-file: /etc/cloudflared/creds/credentials.json

    # Serves the metrics server under /metrics and the readiness server under /ready
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
    # MCP gateway routes retained from the remote tunnel configuration.
    - hostname: mcp.landryzetam.net
      service: http://mcp-gateway:8811

    - hostname: mcp-stream.landryzetam.net
      service: http://mcp-gateway:8812

    # n8n - route to n8n namespace service
    - hostname: n8n.landryzetam.net
      service: http://n8n.n8n.svc.cluster.local:5678
      originRequest:
        connectTimeout: 30s
        keepAliveTimeout: 90s

    # family-webhook.landryzetam.net removed 2026-10-17 (N7): family-manager
    # webhook retired (disabled 2026-08-27, code removed in family-manager-bot
    # e9338f2). fakocluster is remotely managed, so the live route must also be
    # removed in the Cloudflare dashboard/API; this file only mirrors it.

    # Market Replay Gateway - Options data recording and replay
    - hostname: market-replay.landryzetam.net
      service: http://market-replay-gateway.market-replay.svc.cluster.local:8000
      originRequest:
        connectTimeout: 30s
        keepAliveTimeout: 90s

    # Catch-all rule
    - service: http_status:404
