apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared Cloudflare tunnel (`fakocluster`) fronting services that live in
# other namespaces. Distinct from the per-app cloudflared deployments in
# social-media, autobots, ginger-hoa, sports-bets and soccer-banter.
#
# Currently routes: n8n, family-manager webhook, market-replay.
# Previously lived in the `mcp-gateway` namespace; moved 2026-08-11 when the
# MCP gateway was retired and the name stopped matching the contents.

namespace: cloudflare-tunnel

resources:
  - namespace.yaml
  - cloudflare.yaml
  - cloudflare-secret.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: cloudflare-tunnel
    app.kubernetes.io/managed-by: kustomize
