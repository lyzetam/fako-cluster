# Adopts the zi namespace's auto-created `default` ServiceAccount so the
# automount setting is declared in Git. Only this field is set; the token
# controller and kube-controller-manager keep owning everything else.
#
# zi:default is used by every zi pod that sets no serviceAccountName: the five
# agents (replicas 0), zi-dashboard and redis. None of them calls the
# Kubernetes API by design (zi core runs as SA `zi`, which is untouched).
#
# NOTE: apps has prune: true. Removing this file later makes Flux delete
# zi:default; kube-controller-manager recreates it within seconds, with
# automount back on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: zi
automountServiceAccountToken: false
