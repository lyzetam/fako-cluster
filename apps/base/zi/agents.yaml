# ── platform-sre ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-sre
  namespace: zi
  labels:
    app.kubernetes.io/name: agent-platform-sre
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: zi-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-platform-sre
  template:
    metadata:
      labels:
        app: agent-platform-sre
        app.kubernetes.io/name: agent-platform-sre
        app.kubernetes.io/component: agent
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: lzetam/zi-agent-platform-sre:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AGENT_NAME
              value: "platform-sre"
            - name: AGENT_MODEL
              value: "glm-4.7-flash:latest"
            - name: ZI_AGENT_REASONING
              value: "true"
            - name: ZI_AGENT_GATEWAY_URL
              value: "http://apisix.apisix.svc.cluster.local:9080/v1"
            - name: AGENT_DESCRIPTION
              value: "Platform reliability, infrastructure operations, and SRE practices"
            # Bumped 15→20 (recursion_limit=iter*2=40): the multi-step read-only
            # sweep + deepagents planning overhead hit the old 30-step ceiling.
            - name: AGENT_MAX_ITERATIONS
              value: "20"
            - name: ZI_BRAIN_URL
              value: "http://zi-brain.zi.svc.cluster.local:8100"
            # Routed through the APISIX gateway: round-robin across ms1/ms2/ms3 with
            # active health checks, so a dead or wedged node is skipped per request.
            - name: ZI_OLLAMA_URL
              value: "http://apisix.apisix.svc.cluster.local:9080"
            - name: ZI_KNOWLEDGE_REDIS_HOST
              value: "redis.zi.svc.cluster.local"
            - name: ZI_KNOWLEDGE_REDIS_PORT
              value: "6379"
            - name: ZI_API_URL
              value: "http://zi.zi.svc.cluster.local:8080"
            # Watchtower: Noor runs a Continuous read-only health sweep every
            # ZI_PULSE_CHECK_INTERVAL seconds and delegates reversible fixes to
            # Sol (k8s-engineer). Enabled ONLY on platform-sre. The autonomous
            # safety gate limits delegated Sol runs to read-only + rollout
            # restart; all destructive kubectl is refused.
            - name: ZI_PULSE_ENABLED
              value: "true"
            # 900 -> 2700. The pulse loop is SERIAL: it runs one due task, then
            # sleeps check_interval. A sweep against the local 30B model takes
            # 1200-2700s, so at 900s the fleet was working ~60% of every hour
            # with two agents (Sol's delegated run happens inside Noor's sweep,
            # blocking on it). 2700s gives the Mac Studios real idle time
            # between sweeps — they serve NUM_PARALLEL=1, so a queued canary
            # sits behind a multi-minute generation. A watchtower that reports
            # once an hour and finishes beats one that starts every 15 minutes
            # and times out 21 times in 24.
            - name: ZI_PULSE_CHECK_INTERVAL
              value: "2700"
            # Explicit rather than inherited. The code floors the gateway client
            # timeout at 400s regardless, but leaving this unset made the
            # effective per-call budget invisible in the manifest.
            - name: ZI_OLLAMA_TIMEOUT
              value: "400"
            # Watchtower posts cluster-health issues to #infrastructure (only on
            # real problems, deduped). Weekly report defaults to #engineering-team.
            - name: ZI_PULSE_REPORT_CHANNEL
              value: "infrastructure"
            # Deterministic Python self-heal pipeline DISABLED — remediation
            # pivoted to skill-driven Sol (k8s-engineer): Noor detects and
            # delegates, Sol acts via the sre-remediation skill + his tools.
            # Kept as an off-by-default kill switch; the Python modules are slated
            # for removal in a follow-up cleanup.
            - name: ZI_SELF_HEAL_ENABLED
              value: "false"
            # delegate_task to Sol BLOCKS until his (slow, minutes-long)
            # remediation run finishes; the a2a call must outlast it.
            - name: ZI_A2A_TIMEOUT
              value: "1200"
          envFrom:
            - secretRef:
                name: zi-secrets
            # ZI_AGENT_GATEWAY_KEY — APISIX gained key-auth on every LLM route,
            # so an unauthenticated call now returns "Missing API key in
            # request" and the run dies before its first token.
            - secretRef:
                name: apisix-gateway-key
          volumeMounts:
            - name: agent-memory
              mountPath: /data
              subPath: platform-sre
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # 1Gi -> 2Gi. Sol sits at ~600Mi idle and OOMKilled five times in
              # five hours: a remediation run holds the ReAct transcript plus a
              # 64K-context model response, and the peak cleared 1Gi. Limit only
              # — requests stay at 256Mi so this does not add scheduling
              # pressure on a node already at 97% of memory requests.
              memory: 2Gi
          # Boot imports the full LangChain/deepagents tree before uvicorn
          # binds the port. A startupProbe gives that up to 300s WITHOUT the
          # liveness probe running — previously liveness fired at 45s and
          # SIGKILLed the pod mid-import, which is what produced Sol's 65
          # restarts and Noor's crash loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: agent-memory
          persistentVolumeClaim:
            claimName: zi-agents-memory
---
apiVersion: v1
kind: Service
metadata:
