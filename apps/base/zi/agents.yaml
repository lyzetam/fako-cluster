# ── k8s-engineer ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-k8s-engineer
  namespace: zi
  labels:
    app.kubernetes.io/name: agent-k8s-engineer
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: zi-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-k8s-engineer
  template:
    metadata:
      labels:
        app: agent-k8s-engineer
        app.kubernetes.io/name: agent-k8s-engineer
        app.kubernetes.io/component: agent
    spec:
      # Sol is the cluster's remediation path — he must not lose a
      # scheduling race or get evicted first under node pressure.
      priorityClassName: zi-agent-remediator
      imagePullSecrets:
        - name: dockerhub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: lzetam/zi-agent-k8s-engineer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AGENT_NAME
              value: "k8s-engineer"
            - name: AGENT_MODEL
              value: "glm-4.7-flash:latest"
            - name: ZI_AGENT_REASONING
              value: "true"
            - name: ZI_AGENT_GATEWAY_URL
              value: "http://apisix.apisix.svc.cluster.local:9080/v1"
            - name: AGENT_DESCRIPTION
              value: "Kubernetes deployment, cluster management, container orchestration, and cloud native architecture"
            # Bumped 15→20 (recursion_limit=iter*2=40): the multi-step read-only
            # sweep + deepagents planning overhead hit the old 30-step ceiling.
            # Sol runs multi-step delegated remediation loops — bump the budget
            # (remediation is not real-time; a converging loop can need minutes).
            - name: AGENT_MAX_ITERATIONS
              value: "15"
            - name: ZI_OLLAMA_TIMEOUT
              value: "600"
            # Pulse ON for the Weekly report → #engineering-team (no Continuous
            # task, so this only fires Daily/Weekly — low frequency).
            - name: ZI_PULSE_ENABLED
              value: "true"
            - name: ZI_BRAIN_URL
              value: "http://zi-brain.zi.svc.cluster.local:8100"
            # Routed through the APISIX gateway: round-robin across ms1/ms2/ms3 with
            # active health checks, so a dead or wedged node is skipped per request.
            - name: ZI_OLLAMA_URL
              value: "http://apisix.apisix.svc.cluster.local:9080"
            - name: ZI_KNOWLEDGE_REDIS_HOST
              value: "redis.zi.svc.cluster.local"
            - name: ZI_KNOWLEDGE_REDIS_PORT
              value: "6379"
            - name: ZI_API_URL
              value: "http://zi.zi.svc.cluster.local:8080"
            # GitOps repo that propose_fix_pr opens fix PRs against.
            - name: ZI_FAKO_REPO
              value: "lyzetam/fako-cluster"
          envFrom:
            - secretRef:
                name: zi-secrets
            # ZI_AGENT_GATEWAY_KEY — APISIX gained key-auth on every LLM route,
            # so an unauthenticated call now returns "Missing API key in
            # request" and the run dies before its first token.
            - secretRef:
                name: apisix-gateway-key
            # ZI_FAKO_GH_TOKEN — write token scoped to Sol only (external-secret-fako-gh.yaml).
            - secretRef:
                name: fako-gh-token
          volumeMounts:
            - name: agent-memory
              mountPath: /data
              subPath: k8s-engineer
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # 1Gi -> 2Gi. Sol sits at ~600Mi idle and OOMKilled five times in
              # five hours: a remediation run holds the ReAct transcript plus a
              # 64K-context model response, and the peak cleared 1Gi. Limit only
              # — requests stay at 256Mi so this does not add scheduling
              # pressure on a node already at 97% of memory requests.
              memory: 2Gi
          # Boot imports the full LangChain/deepagents tree before uvicorn
          # binds the port. A startupProbe gives that up to 300s WITHOUT the
          # liveness probe running — previously liveness fired at 45s and
          # SIGKILLed the pod mid-import, which is what produced Sol's 65
          # restarts and Noor's crash loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: agent-memory
          persistentVolumeClaim:
            claimName: zi-agents-memory
