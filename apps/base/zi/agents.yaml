# ── code-reviewer ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-code-reviewer
  namespace: zi
  labels:
    app.kubernetes.io/name: agent-code-reviewer
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: zi-agents
spec:
  # Activated: Vera reviews the agent-proposed PRs Sol opens against this repo.
  # Sol cannot merge, so without a reviewer those PRs sit open indefinitely —
  # five were open for up to three weeks before this. Vera cannot merge either;
  # her verdict is a recommendation and a human still merges.
  replicas: 1
  selector:
    matchLabels:
      app: agent-code-reviewer
  template:
    metadata:
      labels:
        app: agent-code-reviewer
        app.kubernetes.io/name: agent-code-reviewer
        app.kubernetes.io/component: agent
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: lzetam/zi-agent-code-reviewer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AGENT_NAME
              value: "code-reviewer"
            - name: AGENT_DESCRIPTION
              value: "Code review, code quality, best practices, and technical feedback"
            - name: AGENT_MAX_ITERATIONS
              value: "15"
            - name: ZI_BRAIN_URL
              value: "http://zi-brain.zi.svc.cluster.local:8100"
            # Routed through the APISIX gateway: round-robin across ms1/ms2/ms3 with
            # active health checks, so a dead or wedged node is skipped per request.
            - name: ZI_AGENT_GATEWAY_URL
              value: "http://apisix.apisix.svc.cluster.local:9080/v1"
            - name: ZI_OLLAMA_URL
              value: "http://apisix.apisix.svc.cluster.local:9080"
            - name: ZI_KNOWLEDGE_REDIS_HOST
              value: "redis.zi.svc.cluster.local"
            - name: ZI_KNOWLEDGE_REDIS_PORT
              value: "6379"
            - name: ZI_API_URL
              value: "http://zi.zi.svc.cluster.local:8080"
            # PR review loop. Daily cadence — the backlog is a handful of PRs,
            # not a live incident feed, and one careful verdict per day clears
            # it faster than it fills.
            - name: ZI_PULSE_ENABLED
              value: "true"
            - name: ZI_PULSE_CHECK_INTERVAL
              value: "2700"
            - name: ZI_PULSE_REPORT_CHANNEL
              value: "engineering-team"
            # Repo whose agent-proposed PRs Vera reviews.
            - name: ZI_FAKO_REPO
              value: "lyzetam/fako-cluster"
            # Sol opens the PRs, so Sol must never review them. Vera also
            # always denies herself; this names the proposer explicitly.
            - name: ZI_PR_REVIEW_AUTHOR_DENY
              value: "k8s-engineer"
          envFrom:
            - secretRef:
                name: zi-secrets
            # ZI_AGENT_GATEWAY_KEY — APISIX gained key-auth on every LLM route,
            # so an unauthenticated call now returns "Missing API key in
            # request" and the run dies before its first token.
            - secretRef:
                name: apisix-gateway-key
            # ZI_FAKO_GH_TOKEN — the same token Sol writes with. Vera only
            # reads PRs and submits reviews; there is no merge tool in the image.
            - secretRef:
                name: fako-gh-token
          volumeMounts:
            - name: agent-memory
              mountPath: /data
              subPath: code-reviewer
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # 1Gi -> 2Gi. Sol sits at ~600Mi idle and OOMKilled five times in
              # five hours: a remediation run holds the ReAct transcript plus a
              # 64K-context model response, and the peak cleared 1Gi. Limit only
              # — requests stay at 256Mi so this does not add scheduling
              # pressure on a node already at 97% of memory requests.
              memory: 2Gi
          # Boot imports the full LangChain/deepagents tree before uvicorn
          # binds the port. A startupProbe gives that up to 300s WITHOUT the
          # liveness probe running — previously liveness fired at 45s and
          # SIGKILLed the pod mid-import, which is what produced Sol's 65
          # restarts and Noor's crash loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: agent-memory
          persistentVolumeClaim:
            claimName: zi-agents-memory
