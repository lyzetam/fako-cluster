# zI Agent Deployments & Services
# 5 active agents — all use the same base image, differentiated by env vars.
# To add an agent: copy a deployment+service block, change the slug and description.

---
# ── backend-engineer ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend-engineer
  namespace: zi
  labels:
    app.kubernetes.io/name: agent-backend-engineer
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: zi-agents
spec:
  replicas: 0
  selector:
    matchLabels:
      app: agent-backend-engineer
  template:
    metadata:
      labels:
        app: agent-backend-engineer
        app.kubernetes.io/name: agent-backend-engineer
        app.kubernetes.io/component: agent
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: lzetam/zi-agent-backend-engineer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AGENT_NAME
              value: "backend-engineer"
            - name: AGENT_DESCRIPTION
              value: "Backend development, API design, database optimization, and service implementation"
            - name: AGENT_MAX_ITERATIONS
              value: "15"
            - name: ZI_BRAIN_URL
              value: "http://zi-brain.zi.svc.cluster.local:8100"
            # Routed through the APISIX gateway: round-robin across ms1/ms2/ms3 with
            # active health checks, so a dead or wedged node is skipped per request.
            - name: ZI_AGENT_GATEWAY_URL
              value: "http://apisix.apisix.svc.cluster.local:9080/v1"
            - name: ZI_OLLAMA_URL
              value: "http://apisix.apisix.svc.cluster.local:9080"
            - name: ZI_KNOWLEDGE_REDIS_HOST
              value: "redis.zi.svc.cluster.local"
            - name: ZI_KNOWLEDGE_REDIS_PORT
              value: "6379"
            - name: ZI_API_URL
              value: "http://zi.zi.svc.cluster.local:8080"
          envFrom:
            - secretRef:
                name: zi-secrets
            # ZI_AGENT_GATEWAY_KEY — APISIX gained key-auth on every LLM route,
            # so an unauthenticated call now returns "Missing API key in
            # request" and the run dies before its first token.
            - secretRef:
                name: apisix-gateway-key
          volumeMounts:
            - name: agent-memory
              mountPath: /data
              subPath: backend-engineer
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              # 1Gi -> 2Gi. Sol sits at ~600Mi idle and OOMKilled five times in
              # five hours: a remediation run holds the ReAct transcript plus a
              # 64K-context model response, and the peak cleared 1Gi. Limit only
              # — requests stay at 256Mi so this does not add scheduling
              # pressure on a node already at 97% of memory requests.
              memory: 2Gi
          # Boot imports the full LangChain/deepagents tree before uvicorn
          # binds the port. A startupProbe gives that up to 300s WITHOUT the
          # liveness probe running — previously liveness fired at 45s and
          # SIGKILLed the pod mid-import, which is what produced Sol's 65
          # restarts and Noor's crash loop.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: agent-memory
          persistentVolumeClaim:
            claimName: zi-agents-memory
---
apiVersion: v1
kind: Service
metadata:
  name: agent-backend-engineer
  namespace: zi
  labels:
    app.kubernetes.io/name: agent-backend-engineer
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: zi-agents
spec:
  selector:
    app: agent-backend-engineer
  ports:
    - port: 8000
      targetPort: http
      name: http

