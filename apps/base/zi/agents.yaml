apiVersion: v1
kind: Service
metadata:
  name: agent-code-reviewer
  namespace: zi
  labels:
    app.kubernetes.io/name: agent-code-reviewer
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: zi-agents
spec:
  selector:
    app: agent-code-reviewer
  ports:
    - port: 8000
      targetPort: http
      name: http

