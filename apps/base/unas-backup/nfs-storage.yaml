# Every UniFi Drive on the UNAS Pro, mounted READ-ONLY as a backup source.
#
# NFSv3 with the physical export path, pinned deliberately. See the long note in
# apps/base/dji-media/nfs-storage.yaml: this server advertises nfs v3 and v4 but
# NOT v4.1, and these paths fail under nfsvers=4.1 with a misleading "No such
# file or directory". Do not "upgrade" without re-testing against showmount.
#
# UniFi Drive NFS authenticates by CLIENT IP, not by password. Each drive below
# must be on the NFS client list for the node this job is pinned to
# (aitower / 10.85.30.58) or the mount hangs and the backup fails loudly.
#
# readOnly everywhere: this job only ever reads. Nothing here can write to the
# NAS even if the container is compromised.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: unas-backup-dji
  labels:
    app.kubernetes.io/name: unas-backup
    unas.drive: "dji"
spec:
  capacity:
    storage: 8Ti          # informational only for NFS; not enforced
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - ro
    - nfsvers=3
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: unas.landryzetam.net
    path: /volume/535b39d4-5df9-48cf-9971-da0c32603790/.srv/.unifi-drive/dji/.data
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unas-backup-dji
  namespace: unas-backup
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: unas-backup-dji
  resources:
    requests:
      storage: 8Ti
---
