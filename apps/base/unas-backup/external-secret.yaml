apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unas-backup-credentials
  namespace: unas-backup
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: unas-backup-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # rclone reads its whole S3 remote config from RCLONE_CONFIG_S3_* env
        # vars, so no rclone.conf file is needed anywhere.
        RCLONE_CONFIG_S3_TYPE: "s3"
        RCLONE_CONFIG_S3_PROVIDER: "AWS"
        RCLONE_CONFIG_S3_REGION: "{{ .aws_region }}"
        RCLONE_CONFIG_S3_ACCESS_KEY_ID: "{{ .aws_access_key_id }}"
        RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: "{{ .aws_secret_access_key }}"
        RCLONE_CONFIG_S3_STORAGE_CLASS: "DEEP_ARCHIVE"
        S3_BUCKET: "{{ .s3_bucket }}"
  data:
    - secretKey: aws_region
      remoteRef:
        key: unas-backup/credentials
        property: aws_region
    - secretKey: aws_access_key_id
      remoteRef:
        key: unas-backup/credentials
        property: aws_access_key_id
    - secretKey: aws_secret_access_key
      remoteRef:
        key: unas-backup/credentials
        property: aws_secret_access_key
    - secretKey: s3_bucket
      remoteRef:
        key: unas-backup/credentials
        property: s3_bucket
  refreshInterval: 1h
