# Bootstrap chain for this namespace:
#
#   aws-credentials (SOPS, in Git)  ->  IAM user eso-unas-backup
#     whose ONLY permission is GetSecretValue on unas-backup/credentials
#   -> SecretStore reads that secret
#   -> ExternalSecret materialises unas-backup-secret with the S3 keys
#
# The S3 write keys themselves are NOT in Git. They live only in AWS Secrets
# Manager so they can be rotated there without touching this repo.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: unas-backup
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
