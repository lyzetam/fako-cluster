# headlamp-admin-v2 replaces headlamp-admin (rotated 2026-10, see PR).
# The rename is the revocation: Flux (apps Kustomization, prune: true) creates
# this new SA (new UID) and prunes the old SA and its long-lived token Secret.
# Every token issued to the old SA, legacy Secret-based or TokenRequest-bound,
# stops validating once the old SA is gone.
#
# No token Secret is defined in Git for this SA. Do NOT add a
# kubernetes.io/service-account-token Secret back: it never expires and the
# Oct 24 client-CA rotation does not kill it. How Headlamp users log in
# (short-lived `kubectl create token` vs Keycloak OIDC) is Landry's decision.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin-v2
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp-admin
    app.kubernetes.io/part-of: headlamp
---
# Write-only role for the headlamp-admin-v2 SA. Reads come from the `headlamp`
# ClusterRole (defined in rbac.yaml) via the additional ClusterRoleBinding
# below. That read scope explicitly EXCLUDES secrets, so the admin token
# pasted into the dashboard cannot enumerate secret values.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-admin
  labels:
    app.kubernetes.io/name: headlamp-admin
    app.kubernetes.io/part-of: headlamp
rules:
# Workload writes
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
  verbs: ["create", "update", "patch", "delete", "deletecollection"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "update", "patch", "delete", "deletecollection"]
# Core resource writes (no secrets, no serviceaccounts, no namespaces)
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "events"]
  verbs: ["create", "update", "patch", "delete", "deletecollection"]
# Exec/portforward (subresources — only "create" is valid)
- apiGroups: [""]
  resources: ["pods/exec", "pods/portforward"]
  verbs: ["create"]
# Networking writes
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["create", "update", "patch", "delete"]
# Autoscaling writes
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["create", "update", "patch", "delete"]
---
# Binding 1: grants reads via the `headlamp` ClusterRole (defined in rbac.yaml).
# This SA inherits the same secret-less read scope as the dashboard pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin-read
  labels:
    app.kubernetes.io/name: headlamp-admin
    app.kubernetes.io/part-of: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp
subjects:
- kind: ServiceAccount
  name: headlamp-admin-v2
  namespace: kube-system
---
# Writes are bound per-namespace via RoleBindings in admin-rolebindings.yaml.
# Cluster-wide pods/exec + workload writes (the old pattern) is functionally
# cluster-admin via pod-SA-shadowing; namespace-scoping closes that path
# by denying admin writes in namespaces that host privileged SAs/operators.
