# Password for the `discord_bots` login role (discord-management API; follow-up
# to #425). AWS SM secret `postgres/discord-bots-credentials` (JSON key:
# password). Same pattern as health-readonly / oura-readonly.
# NOTE: that SM key does not exist yet; creating it needs Landry's OK.
# The username is hardcoded below rather than read from SM: CNPG requires it to
# equal the role name exactly, so a typo in SM can't break the role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-bots-external-secret
  namespace: postgres
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: discord-bots-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"   # CNPG re-reads the password on rotation
      data:
        username: discord_bots
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: postgres/discord-bots-credentials
      property: password
  refreshInterval: 1h
