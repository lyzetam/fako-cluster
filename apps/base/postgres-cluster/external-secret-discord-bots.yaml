# Password for the `discord_bots` login role (discord-management API; follow-up
# to #425). AWS SM secret `postgres/discord-bots-credentials` (JSON keys:
# username, password). Same pattern as health-readonly / oura-readonly.
# NOTE: that SM key does not exist yet; creating it needs Landry's OK.
# username must be exactly `discord_bots` (CNPG matches it to the role name).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-bots-external-secret
  namespace: postgres
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: discord-bots-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"   # CNPG re-reads the password on rotation
  data:
  - secretKey: username
    remoteRef:
      key: postgres/discord-bots-credentials
      property: username
  - secretKey: password
    remoteRef:
      key: postgres/discord-bots-credentials
      property: password
  refreshInterval: 1h
