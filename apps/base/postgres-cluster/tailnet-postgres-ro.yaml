# Tailnet path to the READ-ONLY replica service, port 5432 only.
# Pattern mirrors hume-collector: tailscale sidecar (userspace, tag:k8s) whose
# serve config forwards to 127.0.0.1 (a userspace tailscale pod cannot dial a
# ClusterIP directly). A PgBouncer container on loopback:5432 forwards to
# postgres-cluster-ro:5432 and authenticates ONLY health_ro, ONLY for the
# oura/withings/hume databases (any other user/db is refused by PgBouncer itself,
# so the superuser/app roles cannot be reached over the tailnet). TLS both sides. Tailnet device: `postgres-ro`. Access is decided by
# the Tailscale ACL (tcp:5432 to this device only) plus Postgres auth/pg_hba.
# No operator is installed in this cluster, so no tailscale.com/expose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-ro-tailscale-serve
  namespace: postgres
data:
  serve.json: |
    { "TCP": { "5432": { "TCPForward": "127.0.0.1:5432" } } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-ro-tailnet
  namespace: postgres
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ro-tailnet
  namespace: postgres
  labels: { app: postgres-ro-tailnet }
spec:
  replicas: 0   # scaled down pending security review (Norbert REQUEST_CHANGES on #359)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres-ro-tailnet }
  template:
    metadata:
      labels: { app: postgres-ro-tailnet }
    spec:
      serviceAccountName: postgres-ro-tailnet
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 1000
      containers:
      - name: relay
        # PgBouncer 1.25.2 (edoburu build), pinned by digest. Image user: postgres (uid 70).
        image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
        # Bypass the image entrypoint (it writes a generated config); use ours read-only.
        command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
        securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
        volumeMounts:
        - { name: pgbouncer-config, mountPath: /etc/pgbouncer, readOnly: true }
        - { name: pgbouncer-userlist, mountPath: /etc/pgbouncer-auth, readOnly: true }
        - { name: pgbouncer-client-tls, mountPath: /etc/pgbouncer-tls, readOnly: true }
        - { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 200m, memory: 64Mi }
      - name: tailscale
        image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
        env:
        - name: TS_AUTHKEY
          valueFrom: { secretKeyRef: { name: postgres-ro-tailscale-authkey, key: TS_AUTHKEY } }
        - { name: TS_HOSTNAME, value: postgres-ro }
        - { name: TS_EXTRA_ARGS, value: "--advertise-tags=tag:postgres-ro" }
        - { name: TS_USERSPACE, value: "true" }
        # Kube client OFF: empty TS_KUBE_SECRET = state on the PVC, so containerboot never
        # needs an SA token (automount stays false; no RBAC granted).
        - { name: TS_KUBE_SECRET, value: "" }
        - { name: TS_STATE_DIR, value: /tmp/tsstate }
        - { name: TS_SOCKET, value: /tmp/tsstate/tailscaled.sock }
        - { name: TS_SERVE_CONFIG, value: /etc/tailscale/serve.json }
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
        volumeMounts:
        - { name: serve, mountPath: /etc/tailscale }
        - { name: tsstate, mountPath: /tmp/tsstate }
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { cpu: 200m, memory: 128Mi }
      volumes:
      - name: pgbouncer-config
        configMap: { name: postgres-ro-pgbouncer }
      - name: pgbouncer-userlist
        secret: { secretName: postgres-ro-pgbouncer-userlist, defaultMode: 0440 }
      - name: pgbouncer-client-tls
        secret: { secretName: postgres-ro-pgbouncer-tls, defaultMode: 0440 }
      - name: postgres-ca
        secret: { secretName: postgres-cluster-ca, items: [{ key: ca.crt, path: ca.crt }] }
      - name: serve
        configMap: { name: postgres-ro-tailscale-serve }
      - name: tsstate
        persistentVolumeClaim: { claimName: postgres-ro-tailscale-state }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-ro-tailscale-state
  namespace: postgres
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-csi-v2
  resources:
    requests: { storage: 64Mi }
---
# Auth key (reusable=false, pre-authorized, tag:postgres-ro; the old tag:k8s key was revoked 2026-10-12) stored in AWS SM as tailscale/postgres-ro-authkey (plain string).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-ro-tailscale-authkey
  namespace: postgres
spec:
  secretStoreRef: { name: aws-secrets-store, kind: SecretStore }
  target:
    name: postgres-ro-tailscale-authkey
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        TS_AUTHKEY: "{{ .authkey }}"
  data:
  - secretKey: authkey
    remoteRef: { key: tailscale/postgres-ro-authkey }
  refreshInterval: 1h
---
# PgBouncer config: only the three health DBs, only users in auth_file (health_ro).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-ro-pgbouncer
  namespace: postgres
data:
  pgbouncer.ini: |
    [databases]
    oura     = host=postgres-cluster-ro.postgres.svc.cluster.local port=5432 dbname=oura
    withings = host=postgres-cluster-ro.postgres.svc.cluster.local port=5432 dbname=withings
    hume     = host=postgres-cluster-ro.postgres.svc.cluster.local port=5432 dbname=hume

    [pgbouncer]
    listen_addr = 127.0.0.1
    listen_port = 5432
    unix_socket_dir =
    pidfile =
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer-auth/userlist.txt
    ; no admin/stats users: the pgbouncer console is unreachable
    admin_users =
    stats_users =
    pool_mode = session
    max_client_conn = 10
    default_pool_size = 3
    ignore_startup_parameters = extra_float_digits,options
    ; client side (tailnet client -> pgbouncer): TLS required
    client_tls_sslmode = require
    client_tls_cert_file = /etc/pgbouncer-tls/tls.crt
    client_tls_key_file = /etc/pgbouncer-tls/tls.key
    ; server side (pgbouncer -> replica): TLS, verified against the CNPG CA
    server_tls_sslmode = verify-full
    server_tls_ca_file = /etc/postgres-ca/ca.crt
    log_connections = 1
    log_disconnections = 1
---
# userlist.txt rendered from the existing AWS SM secret postgres/health-readonly
# (keys username/password). PgBouncer uses the plaintext entry to do SCRAM both ways.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-ro-pgbouncer-userlist
  namespace: postgres
spec:
  secretStoreRef: { name: aws-secrets-store, kind: SecretStore }
  refreshInterval: 1h
  target:
    name: postgres-ro-pgbouncer-userlist
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        userlist.txt: |
          "{{ .username }}" "{{ .password }}"
  data:
  - secretKey: username
    remoteRef: { key: postgres/health-readonly, property: username }
  - secretKey: password
    remoteRef: { key: postgres/health-readonly, property: password }
---
# Client-facing TLS cert for PgBouncer: self-signed via cert-manager (namespaced issuer).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: postgres-ro-selfsigned
  namespace: postgres
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-ro-pgbouncer-tls
  namespace: postgres
spec:
  secretName: postgres-ro-pgbouncer-tls
  issuerRef: { name: postgres-ro-selfsigned, kind: Issuer }
  commonName: postgres-ro
  dnsNames: [postgres-ro, localhost]
  duration: 8760h
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
