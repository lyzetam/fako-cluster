# Tailnet path to the READ-ONLY replica service, port 5432 only.
# Pattern mirrors hume-collector: tailscale sidecar (userspace, tag:k8s) whose
# serve config forwards to 127.0.0.1 (a userspace tailscale pod cannot dial a
# ClusterIP directly). A socat container relays loopback:5432 ->
# postgres-cluster-ro:5432. Tailnet device: `postgres-ro`. Access is decided by
# the Tailscale ACL (tcp:5432 to this device only) plus Postgres auth/pg_hba.
# No operator is installed in this cluster, so no tailscale.com/expose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-ro-tailscale-serve
  namespace: postgres
data:
  serve.json: |
    { "TCP": { "5432": { "TCPForward": "127.0.0.1:5432" } } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-ro-tailnet
  namespace: postgres
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ro-tailnet
  namespace: postgres
  labels: { app: postgres-ro-tailnet }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres-ro-tailnet }
  template:
    metadata:
      labels: { app: postgres-ro-tailnet }
    spec:
      serviceAccountName: postgres-ro-tailnet
      automountServiceAccountToken: false
      containers:
      - name: relay
        image: alpine/socat:1.8.0.1
        args: ["TCP-LISTEN:5432,bind=127.0.0.1,fork,reuseaddr", "TCP:postgres-cluster-ro.postgres.svc.cluster.local:5432"]
        securityContext: { runAsNonRoot: true, runAsUser: 1000, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 200m, memory: 64Mi }
      - name: tailscale
        image: tailscale/tailscale:v1.80.0
        env:
        - name: TS_AUTHKEY
          valueFrom: { secretKeyRef: { name: postgres-ro-tailscale-authkey, key: TS_AUTHKEY } }
        - { name: TS_HOSTNAME, value: postgres-ro }
        - { name: TS_EXTRA_ARGS, value: "--advertise-tags=tag:k8s" }
        - { name: TS_USERSPACE, value: "true" }
        # Empty = no kube Secret state (we use the PVC); same as hume. Without it containerboot needs an SA token.
        - { name: TS_KUBE_SECRET, value: "" }
        - { name: TS_STATE_DIR, value: /tmp/tsstate }
        - { name: TS_SOCKET, value: /tmp/tsstate/tailscaled.sock }
        - { name: TS_SERVE_CONFIG, value: /etc/tailscale/serve.json }
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
        volumeMounts:
        - { name: serve, mountPath: /etc/tailscale }
        - { name: tsstate, mountPath: /tmp/tsstate }
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { cpu: 200m, memory: 128Mi }
      volumes:
      - name: serve
        configMap: { name: postgres-ro-tailscale-serve }
      - name: tsstate
        persistentVolumeClaim: { claimName: postgres-ro-tailscale-state }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-ro-tailscale-state
  namespace: postgres
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-csi-v2
  resources:
    requests: { storage: 64Mi }
---
# Auth key (reusable=false, tag:k8s) stored in AWS SM as tailscale/postgres-ro-authkey (plain string).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-ro-tailscale-authkey
  namespace: postgres
spec:
  secretStoreRef: { name: aws-secrets-store, kind: SecretStore }
  target:
    name: postgres-ro-tailscale-authkey
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        TS_AUTHKEY: "{{ .authkey }}"
  data:
  - secretKey: authkey
    remoteRef: { key: tailscale/postgres-ro-authkey }
  refreshInterval: 1h
