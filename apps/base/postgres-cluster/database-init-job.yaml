apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-database-init
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
      - name: db-init
        image: postgres:16
        imagePullPolicy: IfNotPresent
        env:
        - name: PGHOST
          value: postgres-cluster-rw.postgres.svc.cluster.local
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin-secret
              key: password
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          # Wait for Postgres (NetworkPolicy may lag a brand-new pod by ~1s): backoff 1,2,4,8,15s (~30s).
          WAIT_HOST="${PGHOST:-postgres-cluster-rw.postgres.svc.cluster.local}"
          pg_ok=0
          for d in 1 2 4 8 15; do
            if pg_isready -h "$WAIT_HOST" -p 5432 -t 3; then pg_ok=1; break; fi
            echo "postgres not reachable yet, retrying in ${d}s"; sleep "$d"
          done
          if [ "$pg_ok" != 1 ]; then pg_isready -h "$WAIT_HOST" -p 5432 -t 3 || { echo "ERROR: postgres unreachable after ~30s" >&2; exit 1; }; fi
          # Every psql call stops on the first SQL error and exits nonzero.
          psql() { command psql -v ON_ERROR_STOP=1 "$@"; }
          echo "Initializing databases and permissions..."

          # The admin role's EXISTENCE and PASSWORD are owned by CNPG
          # managed.roles in postgres-cluster.yaml. This job must not touch
          # them.
          #
          # It used to run:
          #   CREATE USER admin
          #   ALTER USER admin WITH PASSWORD '${ADMIN_PASSWORD}'
          #
          # Two controllers writing one role's password is a drift generator,
          # and it drifted: on 2026-08-18 this job re-ran during a Flux apply,
          # and afterwards the admin role's stored SCRAM verifier matched
          # neither app-user-secret nor postgres/admin-credentials. Every app
          # authenticating as admin failed on its next restart —
          # oura-collector crash-looped on "password authentication failed for
          # user admin" while its old pod kept serving, so nothing alerted.
          # That is the second time this exact drift has been diagnosed.
          #
          # managed.roles reconciles continuously; this job runs on apply. The
          # job is the one that has to yield.
          #
          # GRANTs below stay here on purpose: managed.roles sets login
          # attributes only, never privileges.

          # Create databases if they don't exist
          psql -c "CREATE DATABASE oura OWNER app" 2>/dev/null || echo "Database oura already exists"
          psql -c "CREATE DATABASE keycloak OWNER app" 2>/dev/null || echo "Database keycloak already exists"
          psql -c "CREATE DATABASE n8n OWNER app" 2>/dev/null || echo "Database n8n already exists"
          psql -c "CREATE DATABASE paperless OWNER app" 2>/dev/null || echo "Database paperless already exists"
          psql -c "CREATE DATABASE backstage OWNER app" 2>/dev/null || echo "Database backstage already exists"
          psql -c "CREATE DATABASE langfuse OWNER app" 2>/dev/null || echo "Database langfuse already exists"
          psql -c "CREATE DATABASE plaud OWNER app" 2>/dev/null || echo "Database plaud already exists"

          # Set schema ownership and permissions for oura database
          psql -d oura -c "ALTER SCHEMA public OWNER TO app;"
          psql -d oura -c "GRANT ALL ON SCHEMA public TO admin;"
          psql -d oura -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO admin;"
          psql -d oura -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO admin;"
          psql -d oura -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO admin;"
          psql -d oura -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO admin;"

          # Set schema ownership and permissions for plaud database (same pattern as oura)
          psql -d plaud -c "ALTER SCHEMA public OWNER TO app;"
          psql -d plaud -c "GRANT ALL ON SCHEMA public TO admin;"
          psql -d plaud -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO admin;"
          psql -d plaud -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO admin;"
          psql -d plaud -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO admin;"
          psql -d plaud -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO admin;"

          psql -d keycloak -c "GRANT ALL ON SCHEMA public TO admin;"
          psql -d keycloak -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO admin;"
          psql -d keycloak -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO admin;"
          
          psql -d n8n -c "GRANT ALL ON SCHEMA public TO app;"
          psql -d n8n -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO app;"
          psql -d n8n -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO app;"

          psql -d paperless -c "GRANT ALL ON SCHEMA public TO app;"
          psql -d paperless -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO app;"
          psql -d paperless -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO app;"

          psql -d backstage -c "GRANT ALL ON SCHEMA public TO app;"
          psql -d backstage -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO app;"
          psql -d backstage -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO app;"

          psql -d langfuse -c "GRANT ALL ON SCHEMA public TO app;"
          psql -d langfuse -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO app;"
          psql -d langfuse -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO app;"

          echo "Database initialization completed successfully"
