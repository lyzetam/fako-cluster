# Password for the `health_ro` login role (read-only health export; see
# health-ro-grants-cronjob.yaml). AWS SM secret `postgres/health-readonly`
# (JSON keys: username, password). Same pattern as oura-readonly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-readonly-external-secret
  namespace: postgres
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: health-readonly-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"   # CNPG re-reads the password on rotation
  data:
  - secretKey: username
    remoteRef:
      key: postgres/health-readonly
      property: username
  - secretKey: password
    remoteRef:
      key: postgres/health-readonly
      property: password
  refreshInterval: 1h
