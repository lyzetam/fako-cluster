# Writer credentials for the nightly health export CronJob. AWS SM secret
# `postgres/health-export-writer` (keys: access_key_id, secret_access_key, region,
# bucket, ping_url). The IAM user behind it can only PutObject/List under
# s3://<bucket>/health/ (no Get, no Delete). Covered by the existing ESO IAM policy (postgres/*).
# NOTE: the SM secret must exist before this merges, or the ExternalSecret reports an error.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-export-external-secret
  namespace: postgres
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: health-export-secret
    creationPolicy: Owner
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: postgres/health-export-writer
      property: access_key_id
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: postgres/health-export-writer
      property: secret_access_key
  - secretKey: AWS_DEFAULT_REGION
    remoteRef:
      key: postgres/health-export-writer
      property: region
  - secretKey: S3_BUCKET
    remoteRef:
      key: postgres/health-export-writer
      property: bucket
  - secretKey: PING_URL
    remoteRef:
      key: postgres/health-export-writer
      property: ping_url
  refreshInterval: 1h
