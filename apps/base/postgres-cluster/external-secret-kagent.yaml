# Password for the `kagent` login role (kagent controller). AWS SM secret
# `postgres/kagent-credentials` (JSON key: password); the kagent namespace
# builds its connection string from the same key. Same pattern as
# external-secret-discord-bots.yaml: username hardcoded to the role name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-db-external-secret
  namespace: postgres
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: kagent-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"   # CNPG re-reads the password on rotation
      data:
        username: kagent
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: postgres/kagent-credentials
      property: password
  refreshInterval: 1h
