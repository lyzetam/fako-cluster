# nginx serving the DJI archive read-only.
#
# This file is a template processed by /docker-entrypoint.d/20-envsubst-on-templates.sh,
# which writes /etc/nginx/conf.d/default.conf on container start. ${BEARER_TOKEN} is
# substituted from the dji-media-bearer-token secret; basic-auth credentials come from
# the dji-media-basic-auth secret mounted at /etc/nginx/auth/htpasswd.
#
# Access model:
#   - Human browsers: basic auth via /etc/nginx/auth/htpasswd.
#   - Programmatic clients (agent backend): Authorization: Bearer ${BEARER_TOKEN}.
#   - /healthz remains unauthenticated for Kubernetes probes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dji-media-nginx
  namespace: dji-media
data:
  default.conf.template: |
    map $http_authorization $auth_basic {
        "Bearer ${BEARER_TOKEN}" off;
        default "Restricted";
    }

    server {
        listen 8080;
        server_name _;

        auth_basic $auth_basic;
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        root /srv/media;

        # Machine-readable browsing for the pipeline, human browsing for you.
        autoindex on;
        autoindex_format json;
        autoindex_exact_size on;
        autoindex_localtime on;

        # Large files: never buffer whole clips into memory, always allow seeking.
        sendfile on;
        tcp_nopush on;
        directio 8m;
        output_buffers 2 1m;
        max_ranges 100;

        # Video should stream, not download-then-play.
        types {
            video/mp4  mp4;
            video/quicktime mov;
            image/jpeg jpg jpeg;
            application/json json;
        }
        default_type application/octet-stream;

        # gzip on video/jpeg is wasted CPU and breaks nothing but helps nothing.
        gzip off;

        location = /healthz {
            auth_basic off;
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            add_header Cache-Control "public, max-age=300";
        }
    }
