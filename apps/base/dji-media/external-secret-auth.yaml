# Credentials for the dji-media nginx proxy.
#
# - dji-media-bearer-token: used by programmatic clients (agent backend) on the
#   Tailscale HTTPS endpoint. Sent as `Authorization: Bearer <token>`.
# - dji-media-basic-auth: htpasswd line for human browser access.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dji-media-bearer-token
  namespace: dji-media
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: dji-media-bearer-token
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        token: "{{ .token }}"
  data:
  - secretKey: token
    remoteRef:
      key: dji-media/bearer-token
      property: token
  refreshInterval: 1h
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dji-media-basic-auth
  namespace: dji-media
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: dji-media-basic-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        htpasswd: "{{ .htpasswd }}"
  data:
  - secretKey: htpasswd
    remoteRef:
      key: dji-media/basic-auth
      property: htpasswd
  refreshInterval: 1h
