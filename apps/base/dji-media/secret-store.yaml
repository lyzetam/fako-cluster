# AWS Secrets Manager store — auths via the in-namespace `aws-credentials`
# bootstrap secret (mirrors ig-inbox-uploader). Reads tailscale/ secrets only;
# the NAS mount needs no credentials because the UNAS NFS export is host-based.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: dji-media
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
