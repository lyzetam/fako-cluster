# The DJI archive on the UNAS Pro, mounted READ-ONLY.
#
# NFS rather than SMB deliberately. UniFi Drive presents NFS as its programmatic
# mount path and authenticates by HOST IP, not by password — the node itself is
# the identity. The cluster nodes are already on the UNAS NFS connection list, so
# no credential exists to leak, rotate, or get wrong. An SMB service account was
# tried first and could not authenticate as an SMB principal at all.
#
# Path is taken from the live export table, NOT from the UNAS UI. The Services
# page documents `mount -t nfs <host>:/var/nfs/shared/[Shared Drive Name]`, but
# `showmount -e unas.landryzetam.net` reports the actual export as the physical
# path below. The documented alias is not what the server advertises; trusting it
# would fail the mount. Re-check with showmount if this ever stops working.
#
# readOnly is enforced at THREE layers: the PV mount option, the PVC access mode,
# and the container volumeMount. The archive is the source of truth; an
# HTTP server must be structurally incapable of writing to it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dji-media-archive
  labels:
    app.kubernetes.io/name: dji-media
spec:
  capacity:
    storage: 1Ti          # informational only for NFS; not enforced
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - ro
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: unas.landryzetam.net
    path: /volume/535b39d4-5df9-48cf-9971-da0c32603790/.srv/.unifi-drive/dji/.data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dji-media-archive
  namespace: dji-media
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: dji-media-archive
  resources:
    requests:
      storage: 1Ti
