# SSM Parameter Store (SecureString, Standard tier), not Secrets Manager.
#
# Auth: the SOPS-encrypted Secret aws-credentials (keys access-key-id,
# secret-access-key, region) in this namespace, committed by Landry at
# apps/staging/cluster-health/aws-credentials-secret.yaml and listed in
# apps/staging/cluster-health/kustomization.yaml. No agent handles its plaintext.
# That key's IAM policy: ssm:GetParameter on exactly
#   arn:aws:ssm:us-east-1:<acct>:parameter/health/s3-writer
#   arn:aws:ssm:us-east-1:<acct>:parameter/health/healthchecks-ping
# Nothing else (no GetParameterHistory, no GetParametersByPath). SecureString
# uses the AWS-managed aws/ssm key; no CMK.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: cluster-health
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
