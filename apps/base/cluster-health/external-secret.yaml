# S3 writer key + healthchecks.io ping URL for the uploader container.
#
# /health/s3-writer is a SecureString holding JSON:
#   {"access_key_id": "...", "secret_access_key": "...",
#    "region": "us-east-1", "bucket": "<bucket>"}
# Those keys belong to IAM user health-s3-writer, whose only S3 permission is
# s3:PutObject on arn:aws:s3:::<bucket>/cluster-health/* . It cannot read,
# list or delete. The bots' reader key (/health/s3-reader, s3:GetObject only)
# is deliberately NOT mounted here.
#
# /health/healthchecks-ping is a SecureString holding the full ping URL
# (https://hc-ping.com/<uuid>). It can only ping that one check.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-health-uploader
  namespace: cluster-health
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: cluster-health-uploader
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /health/s3-writer
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /health/s3-writer
        property: secret_access_key
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: /health/s3-writer
        property: region
    - secretKey: S3_BUCKET
      remoteRef:
        key: /health/s3-writer
        property: bucket
    - secretKey: HC_PING_URL
      remoteRef:
        key: /health/healthchecks-ping
  refreshInterval: 1h
