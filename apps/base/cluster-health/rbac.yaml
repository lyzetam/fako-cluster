# Identity for the hourly cluster-health job.
#
# The job reuses the view-only mel-readonly ClusterRole
# (infrastructure/configs/base/mel-readonly/rbac.yaml) through its OWN binding.
# It does not use the kube-system/mel-readonly ServiceAccount or its token.
#
# No token Secret is defined. The pod gets a projected, kubelet-rotated token
# with expirationSeconds: 600 (see cronjob.yaml), mounted only into the
# collector init container.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-health
  namespace: cluster-health
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: cluster-health
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-health-readonly
  labels:
    app.kubernetes.io/name: cluster-health
    app.kubernetes.io/part-of: cluster-health
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mel-readonly
subjects:
  - kind: ServiceAccount
    name: cluster-health
    namespace: cluster-health
