# Network-level access control for pv-browser.
#
# DNS pointing at a private address (10.85.30.214) makes this unreachable from
# the internet, but that is a perimeter assumption, not enforcement: anything
# that can route to the ingress can reach the app. This middleware enforces the
# restriction at Traefik, rejecting any request whose source is outside the
# home network with a 403 before it ever reaches filebrowser.
#
# Ranges, and why each is here:
#   10.85.0.0/16    the home LAN, all VLANs (main, servers, IoT, security, …)
#   10.42.0.0/16    cluster pod CIDR — in-cluster callers and probes
#   10.43.0.0/16    cluster service CIDR
#   192.168.5.0/24  WireGuard clients (your phone and desktop when remote).
#                   Remove this block if you want strictly on-premises access
#                   and no VPN reach.
#
# Traefik v3 spelling is `ipAllowList`; v2 called it `ipWhiteList`. This cluster
# runs traefik 3.6.13.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: pv-browser
spec:
  ipAllowList:
    sourceRange:
      - 10.85.0.0/16
      - 10.42.0.0/16
      - 10.43.0.0/16
      - 192.168.5.0/24
