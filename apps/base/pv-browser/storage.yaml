---
# filebrowser's own bolt database (users, settings). Small, read-write, on NFS
# so it survives a reschedule. This is the ONLY writable volume in the app.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvbrowser-config
  namespace: pv-browser
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi-v2
  resources: { requests: { storage: 1Gi } }
