# Read-only mounts of the four parent NFS shares that hold every dynamically
# provisioned PV in the cluster. Each PV is a directory named after itself under
# one of these, so mounting the PARENTS surfaces all 309 NFS-backed volumes.
# See docs/operations/pv-catalog/README.md for the derivation.
#
#   /volume1/k8s-storage   268 PVs
#   /volume1/k8s-db         25 PVs
#   /volume1/k8s-pg         13 PVs
#   /volume1/k8s-backups     3 PVs
#
# READ-ONLY, enforced three ways: ReadOnlyMany accessMode, `ro` in mountOptions,
# and readOnly:true on every container mount in deployment.yaml. filebrowser is
# additionally configured with no create/delete/rename permissions.
#
# nfs.csi.k8s.io, never an in-tree `nfs:` source: only pglenovo01 has
# /sbin/mount.nfs, so an in-tree mount hangs in ContainerCreating anywhere else.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvbrowser-k8s-storage
spec:
  capacity: { storage: 1Gi }          # informational only; NFS is thin
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=3, nolock, ro, hard]
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: pvbrowser-k8s-storage
    readOnly: true
    volumeAttributes:
      server: "ugnas.landryzetam.net"
      share: "/volume1/k8s-storage"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvbrowser-k8s-storage
  namespace: pv-browser
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: pvbrowser-k8s-storage
  resources: { requests: { storage: 1Gi } }
---
