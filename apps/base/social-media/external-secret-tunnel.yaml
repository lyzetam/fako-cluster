# cloudflared credentials for social-media-tunnel. Held in AWS SM rather than
# SOPS (the connor-birthday pattern) so rotation is a single AWS write with no
# commit — and so this file carries no ciphertext at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnel-credentials-secret
  namespace: social-media
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: tunnel-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: "{{ .credentials_json }}"
  data:
    - secretKey: credentials_json
      remoteRef:
        key: social-media/cloudflare-tunnel
        property: credentials.json
  refreshInterval: 1h
