# versitygw root credentials. Stored in AWS SM as a single JSON blob at
# social-media/s3-credentials, so the cluster gateway, the uploader, and the
# cloud Managed Agent's vault all read ONE source of truth — rotating the key
# there rotates it everywhere.
#
# The endpoint/bucket/region are carried alongside the keys deliberately: a
# consumer that gets the credentials also gets where to send them, so no caller
# has to hardcode a hostname.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-media-s3
  namespace: social-media
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: social-media-s3
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        S3_REGION: "{{ .S3_REGION }}"
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: social-media/s3-credentials
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: social-media/s3-credentials
        property: S3_SECRET_KEY
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: social-media/s3-credentials
        property: S3_ENDPOINT
    - secretKey: S3_BUCKET
      remoteRef:
        key: social-media/s3-credentials
        property: S3_BUCKET
    - secretKey: S3_REGION
      remoteRef:
        key: social-media/s3-credentials
        property: S3_REGION
  refreshInterval: 1h
