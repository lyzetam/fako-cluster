# Public edge for the S3 gateway: s3.landryzetam.net -> versitygw:7070.
#
# WHY PUBLIC AT ALL: Instagram's Graph API fetches media by URL from its own
# servers, so a Tailscale-private endpoint (the pattern used by ig-inbox-uploader
# and dji-media) cannot work here. A Cloudflare Tunnel exposes the origin without
# opening a port or putting the cluster on a public IP.
#
# WHAT PROTECTS IT: versitygw enforces AWS SigV4 on every request — an unsigned
# GET is rejected, so publishing the hostname does not publish the bucket. The
# only unauthenticated access is via a presigned URL, which is signed, scoped to
# one object, and time-limited. Write access requires the root credential, which
# exists only in AWS Secrets Manager and the cluster.
#
# KNOWN LIMIT — and why it does NOT bind here: Cloudflare caps proxied request
# BODIES at 100 MB on Free/Pro. That is per-request, not per-object, and every
# mainstream S3 client switches to multipart above ~8 MB, so a large object
# arrives as many small requests. Measured 2026-07-31 through this hostname:
#   150 MB multipart    -> OK, 157286400 bytes verified server-side
#   150 MB single-shot  -> FAILS ("EOF occurred in violation of protocol";
#                          Cloudflare kills the connection, no clean 413)
# So the only real rule is: do not disable multipart. Upgrading would not help
# anyway — Pro is also 100 MB; only Business (200 MB) raises it.
# Downloads are uncapped, which is all Instagram does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: social-media
  labels:
    app: cloudflared
    app.kubernetes.io/part-of: social-media
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
        app.kubernetes.io/part-of: social-media
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.11.1
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: social-media
data:
  config.yaml: |
    # Referenced by UUID, not name: the credentials file pins this ID, and a
    # renamed tunnel would silently stop matching.
    tunnel: 44793c06-3641-408a-b36b-4b75aea14158
    credentials-file: /etc/cloudflared/creds/credentials.json

    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      - hostname: s3.landryzetam.net
        service: http://versitygw:7070
        originRequest:
          # Media objects are large and Instagram reads them slowly; the default
          # 30s would cut long reel transfers off mid-stream.
          connectTimeout: 30s
          noHappyEyeballs: true
      # Public edge for the cloud agent's inbox read API. The agent endpoints are
      # protected by a bearer token; the Tailscale-private UI remains unreachable
      # through this hostname because there is no route back to the Tailscale sidecar.
      - hostname: ig-inbox-api.landryzetam.net
        service: http://ig-inbox-uploader.ig-inbox-uploader.svc.cluster.local:8080
      # Public edge for obsidian-vault-api, so the cloud agent can file article
      # notes into the vault. The origin runs on mm1 — outside the
      # cluster but on the same LAN — so cloudflared reaches it by the existing
      # private DNS name. Three controls survive this exposure:
      #   1. mm1's OBSIDIAN_API_ALLOWED_NETWORKS still only admits the cluster
      #      node and client VLANs. Traffic arrives SNAT'd as a cluster node, so the
      #      allowlist is untouched — the internet cannot reach the origin directly.
      #   2. The agent holds the `morning-brief` client key, scoped read+write to
      #      Reading/TLDR/** and nothing else. Verified 2026-08-05: in-scope PUT
      #      204, Health/ PUT 403.
      #   3. Every request is audit-logged on mm1 with client, path, and source.
      # noTLSVerify because the origin serves a self-signed cert; Cloudflare
      # terminates the real TLS at the edge.
      - hostname: vault-api.landryzetam.net
        service: https://obsidian-api.landryzetam.net:27124
        originRequest:
          # The Obsidian Local REST API serves its own self-signed certificate, and
          # this is the only https:// origin in the tunnel. Without this, cloudflared
          # rejects it with "x509: certificate signed by unknown authority" and every
          # request 502s.
          #
          # It worked for a week without this line only because the running pod was on
          # an older cloudflared. Deploying the apisix route on 2026-08-11 restarted
          # cloudflared onto 2025.11.1, which verifies the origin certificate — and both
          # tldr-pipeline CronJobs failed that afternoon. Nothing was down; an unrelated
          # deploy changed the image under a route that depended on the old behaviour.
          #
          # The hop this skips verification on is cluster -> private LAN host. It is not
          # the public hop, which Cloudflare still terminates normally, and the origin
          # is independently protected: bearer token, a key scoped to Reading/TLDR/**,
          # and OBSIDIAN_API_ALLOWED_NETWORKS limiting the source to 10.85.30.0/24.
          # The stricter alternative is caPool with the origin certificate mounted into
          # cloudflared; worth doing if this origin ever carries anything broader.
          noTLSVerify: true
      # APISIX AI gateway — the LLM front door for the Mac Studio fleet, so
      # workloads OUTSIDE the cluster (the social pipeline runs on a Hostinger
      # VPS) can reach local models and fall back to Ollama Cloud on 429/5xx.
      #
      # This is the only reason the gateway is on the internet at all, so it is
      # NOT open: every route behind it requires APISIX key-auth, and the
      # social consumer is additionally rate-limited to 600 requests/hour so a
      # runaway agent loop cannot saturate a fleet the whole homelab shares.
      - hostname: llm.landryzetam.net
        service: http://apisix.apisix.svc.cluster.local:9080
        originRequest:
          noTLSVerify: true
      # Anything that did not match above is not part of this service.
      - service: http_status:404
