# AWS Secrets Manager store — auths via the in-namespace `aws-credentials`
# bootstrap secret, which is SOPS-encrypted in the staging overlay. Mirrors
# ig-inbox-uploader and withings-collector.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: social-media
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
