# The ONE place the vault's real address enters the cluster.
#
# Every consumer used to carry it — as a URL from this same secret, and as a
# LAN CIDR in its NetworkPolicy. After migration they reference an in-cluster
# Service name instead, and this is the only workload that knows where the
# vault actually lives.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-upstream
  namespace: vault-gateway
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: obsidian-upstream
    creationPolicy: Owner
  data:
    - secretKey: api_url
      remoteRef:
        key: obsidian/api
        property: api_url
  refreshInterval: 1h
