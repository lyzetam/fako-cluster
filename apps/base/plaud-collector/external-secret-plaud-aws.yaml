# Scoped AWS credential for THIS app only.
#
# This credential MUST be scoped to only secretsmanager:GetSecretValue and secretsmanager:PutSecretValue on the plaud/oauth-tokens ARN.
#
# Why this app gets an in-pod AWS credential at all, when oura-collector
# deliberately gave one up (see the "aws-credentials-env removed (H3)" comment
# in apps/base/oura-collector/deployment.yaml): oura-collector only ever READS
# AWS secrets, and the external-secrets controller does that for it, so the pod
# needed no AWS access. This app must WRITE — the Plaud refresh token rotates
# on every use, and the new one has to go back to AWS Secrets Manager before
# the process exits or the next run cannot authenticate at all.
#
# This is deliberately NOT the broad `aws-credentials` secret that
# apps/base/oura-collector/external-secret-aws.yaml transforms. It is a
# separate AWS SM key, `plaud/aws-credentials`, holding its own narrowly-scoped
# IAM user. That key does NOT exist yet — it is created out of band, together
# with the IAM policy above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaud-aws-credentials
  namespace: plaud-collector
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: plaud-aws-env
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey }}"
        AWS_DEFAULT_REGION: "{{ .region }}"
  data:
  - secretKey: accessKeyId
    remoteRef:
      key: plaud/aws-credentials
      property: accessKeyId
  - secretKey: secretAccessKey
    remoteRef:
      key: plaud/aws-credentials
      property: secretAccessKey
  - secretKey: region
    remoteRef:
      key: plaud/aws-credentials
      property: region
  refreshInterval: 1h
