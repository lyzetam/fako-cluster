# Plaud OAuth refresh token.
#
# The AWS SM secret `plaud/oauth-tokens` does NOT exist yet — it is created out
# of band. This manifest only references its NAME; ExternalSecrets will report
# SecretSyncedError until that secret exists.
#
# The refresh token ROTATES on every use: Plaud issues a new one and
# invalidates the old on each refresh. This ExternalSecret is the read path
# (AWS -> pod env). The write-back path is the pod calling PutSecretValue on
# the same secret — see external-secret-plaud-aws.yaml. Nothing else may hold a
# copy of this token, and only one process may refresh at a time (hence
# concurrencyPolicy: Forbid on the CronJob).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plaud-oauth-tokens
  namespace: plaud-collector
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: plaud-oauth-env
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        PLAUD_REFRESH_TOKEN: "{{ .refresh_token }}"
  data:
  - secretKey: refresh_token
    remoteRef:
      key: plaud/oauth-tokens
      property: refresh_token
  refreshInterval: 1h
