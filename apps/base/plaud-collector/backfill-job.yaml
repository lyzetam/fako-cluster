# One-off historical backfill Job for Plaud. Commented out of kustomization.yaml
# by default — same convention as apps/base/fieldy-webhook/backfill-job.yaml.
#
# How to run a backfill (GitOps workflow):
#   1. Edit BACKFILL_START and BACKFILL_END below to your desired window.
#   2. Bump `metadata.name` (e.g. `plaud-backfill-001` -> `plaud-backfill-002`)
#      so K8s treats it as a new Job, not a duplicate of an existing one.
#   3. Uncomment the `- backfill-job.yaml` line in kustomization.yaml.
#   4. git add + commit + push. Flux reconciles within ~10m (or run
#      `flux reconcile kustomization apps --with-source`).
#   5. Watch: `kubectl logs -f -n plaud-collector -l job-name=plaud-backfill-<n>`
#   6. RE-COMMENT the kustomization line after it completes. Leaving it
#      uncommented plus ttlSecondsAfterFinished creates a resurrection loop —
#      the completed Job is TTL-deleted, Flux recreates it, and it runs again
#      daily forever. That is what burned tokens on fieldy-webhook on
#      2026-07-07; see the note in that app's kustomization.yaml.
#
# DO NOT run this while the daily CronJob might fire. The Plaud refresh token
# rotates on every use, so two concurrent processes racing to refresh will
# invalidate each other — concurrencyPolicy: Forbid protects the CronJob from
# itself, but it cannot see this Job. Suspend the CronJob first:
#   kubectl patch cronjob plaud-collector-daily -n plaud-collector \
#     -p '{"spec":{"suspend":true}}'
# and unsuspend it when the backfill finishes.
#
# Why not a CronJob? Backfills run on demand, not on schedule. A Job is the
# right K8s primitive for "run once and stop".
apiVersion: batch/v1
kind: Job
metadata:
  name: plaud-backfill-001  # bump on each new run
  namespace: plaud-collector
  labels:
    app: plaud-backfill
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: plaud-backfill
    spec:
      serviceAccountName: plaud-collector
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerhub-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backfill
          image: lzetam/plaud-puller:latest
          imagePullPolicy: Always
          command:
            - python
            - /app/scripts/backfill.py
          env:
            # --- date window — EDIT THESE ---
            # Both are ISO dates (YYYY-MM-DD) and take precedence over the
            # script's --start/--end flags. Omit both for a full unwindowed
            # sync of everything in the account.
            - name: BACKFILL_START
              value: "2025-01-01"
            - name: BACKFILL_END
              value: "2026-08-17"
          envFrom:
            - configMapRef:
                name: plaud-collector-config
            - secretRef:
                name: postgres-credentials-env
            - secretRef:
                name: obsidian-api-env
            - secretRef:
                name: plaud-oauth-env
            - secretRef:
                name: plaud-aws-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
