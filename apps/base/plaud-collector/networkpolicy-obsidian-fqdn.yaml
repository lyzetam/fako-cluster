# Egress to the Obsidian Local REST API, by hostname instead of a frozen IP.
#
# Mirrors apps/base/oura-collector/networkpolicy-obsidian-fqdn.yaml, added
# 2026-08-17 after a month-long silent outage there: a plain NetworkPolicy
# pinned to a /32 (later /24) CIDR stopped matching when the LAN host's
# address changed, and nothing alerted because Postgres egress (allowed by
# namespace selector) kept succeeding the whole time. This app talks to the
# exact same host for the exact same reason, so it gets the same fix from the
# start rather than copying the CIDR approach that already failed once.
#
# obsidian-api.landryzetam.net tracks the live address correctly. This
# CiliumNetworkPolicy allows egress by that FQDN instead, so a future address
# change requires no manifest edit. Requires a DNS-visibility rule: Cilium's
# DNS proxy has to see the query for this exact name to learn which resolved
# IP the toFQDNs rule should permit.
#
# endpointSelector: {} (not a specific `app` label) because the daily
# CronJob, the backfill Job, and the migration Job carry three different pod
# labels (plaud-collector / plaud-backfill / plaud-collector-migrate) — same
# reasoning as the empty podSelector in networkpolicy.yaml. Cilium unions
# rules from both NetworkPolicy and CiliumNetworkPolicy for the same pod
# (allow if either permits), so this only adds a path; it does not replace
# the existing DNS/postgres/HTTPS rules in networkpolicy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plaud-collector-obsidian-fqdn
  namespace: plaud-collector
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: "obsidian-api.landryzetam.net"
    - toFQDNs:
        - matchName: "obsidian-api.landryzetam.net"
      toPorts:
        - ports:
            - port: "27124"
              protocol: TCP
