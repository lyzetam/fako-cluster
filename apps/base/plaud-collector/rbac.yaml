# RBAC for the plaud-collector workloads. Mirrors apps/base/oura-collector/rbac.yaml.
# Minimal: read-only on its own namespace's configmaps + secrets, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plaud-collector
  namespace: plaud-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plaud-collector
  namespace: plaud-collector
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plaud-collector
  namespace: plaud-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plaud-collector
subjects:
- kind: ServiceAccount
  name: plaud-collector
  namespace: plaud-collector
