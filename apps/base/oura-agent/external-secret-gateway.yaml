# APISIX key-auth credential for the LLM gateway.
#
# The gateway's LLM routes require `apikey: <key>` (0555c445); a keyless call
# returns 401 before the first token. The key identifies the `cluster_internal`
# consumer, shared by in-cluster callers — deliberately not the
# social_media_content key, which carries a 600/hour limit meant for the
# external tunnel client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apisix-gateway-key
  namespace: oura-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secret-store
  target:
    name: apisix-gateway-key
    creationPolicy: Owner
  data:
    - secretKey: OLLAMA_API_KEY
      remoteRef:
        key: apisix/cluster-key
        property: APISIX_KEY_CLUSTER
