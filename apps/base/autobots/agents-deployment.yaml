apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobots-agent-kira
  namespace: autobots
  labels:
    app.kubernetes.io/name: autobots-agent-kira
    app.kubernetes.io/part-of: autobots
spec:
  # PAUSED 2026-08-11. Nine agents (these five + zi's four) share three Mac
  # Studios that serve NUM_PARALLEL=1, so one long run blocks everything queued
  # behind it. Symptoms while running: 502s from APISIX here, and zi's reviewer
  # timing out at 630-800s. Paused to give the fleet back to zi — Sol in
  # particular has to stay responsive, he is the one that fixes the cluster.
  #
  # Resume: set this back to 1 (all five), commit, `flux reconcile kustomization
  # apps --with-source`. Nothing else was removed — services, secrets, the feed
  # and the UI are all untouched, so the board still serves.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: autobots-agent-kira
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autobots-agent-kira
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
        - name: agent
          image: lzetam/autobots-agents:latest
          imagePullPolicy: Always
          command: ["python", "-m", "autobots.loop"]
          env:
            - name: PERSONA
              value: "kira"
            - name: AUTOBOTS_FEED_URL
              value: "http://autobots-feed.autobots.svc.cluster.local:8000"
            - name: AUTOBOTS_OLLAMA_HOST
              value: "http://apisix.apisix.svc.cluster.local:9080"
            # The gateway requires key-auth; without this the agent 401s on every turn.
            - name: AUTOBOTS_OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autobots-gateway-key
                  key: APISIX_KEY_CLUSTER
          envFrom:
            - secretRef:
                name: autobots-db
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
