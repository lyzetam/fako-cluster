# APISIX key-auth credential for the LLM gateway.
#
# The gateway's /api/* route requires `apikey: <key>` (commit 0555c445). Without
# it every agent turn returns 401 — which is exactly what happened: all five
# autobots agents failed continuously until this was wired up.
#
# The key identifies the `cluster_internal` consumer, shared by in-cluster
# callers. It is deliberately NOT the social_media_content key, which carries a
# 600/hour rate limit meant for the external tunnel client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobots-gateway-key
  namespace: autobots
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-store
  target:
    name: autobots-gateway-key
    creationPolicy: Owner
  data:
    - secretKey: APISIX_KEY_CLUSTER
      remoteRef:
        key: apisix/cluster-key
        property: APISIX_KEY_CLUSTER
