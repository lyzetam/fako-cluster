apiVersion: apps/v1
kind: Deployment
metadata:
  name: ig-inbox-uploader
  namespace: ig-inbox-uploader
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ig-inbox-uploader
  template:
    metadata:
      labels:
        app: ig-inbox-uploader
    spec:
      imagePullSecrets:
      - name: dockerhub-pull          # private DockerHub repo; bootstrap secret in-ns
      containers:
      # FastAPI app — receives/processes IG inbox uploads, pushes to Dropbox +
      # Supabase.
      - name: ig-inbox-uploader
        image: lzetam/ig-inbox-uploader:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - secretRef:
            name: ig-inbox-uploader-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      # Tailscale sidecar — serves the app privately over HTTPS.
      - name: tailscale
        image: tailscale/tailscale:v1.80.0
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-authkey
              key: TS_AUTHKEY
        - name: TS_HOSTNAME
          value: "ig-inbox"
        - name: TS_EXTRA_ARGS
          value: "--advertise-tags=tag:k8s"
        - name: TS_USERSPACE
          value: "true"
        - name: TS_KUBE_SECRET
          value: ""                                 # no k8s API (unreachable in userspace mode)
        - name: TS_STATE_DIR
          value: "/tmp/tsstate"
        - name: TS_SOCKET
          value: "/tmp/tsstate/tailscaled.sock"
        - name: TS_SERVE_CONFIG
          value: "/etc/tailscale/serve.json"
        volumeMounts:
        - name: serve
          mountPath: /etc/tailscale
        - name: tsstate
          mountPath: /tmp/tsstate
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: serve
        configMap:
          name: tailscale-serve
      - name: tmp
        emptyDir: {}
      - name: tsstate
        emptyDir: {}
