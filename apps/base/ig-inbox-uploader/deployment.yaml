apiVersion: apps/v1
kind: Deployment
metadata:
  name: ig-inbox-uploader
  namespace: ig-inbox-uploader
spec:
  replicas: 1
  strategy:
    type: RollingUpdate       # maxSurge 0 → old pod deleted before new one, releasing the RWO PVC
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: ig-inbox-uploader
  template:
    metadata:
      labels:
        app: ig-inbox-uploader
    spec:
      imagePullSecrets:
      - name: dockerhub-pull          # private DockerHub repo; bootstrap secret in-ns
      containers:
      # FastAPI app — receives/processes IG inbox uploads, pushes to Dropbox +
      # Supabase.
      - name: ig-inbox-uploader
        image: lzetam/ig-inbox-uploader:sha-090a4db763419d509dadefd7cb4941fab701fe4c
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - secretRef:
            name: ig-inbox-uploader-config
        # S3 backend (versitygw over the UNAS). When these four vars are set the
        # app writes to S3 instead of Dropbox (app/store.py::get_store). Enabled
        # together with the cloud agent's /api/inbox read path so uploads stay
        # visible to the agent.
        - secretRef:
            name: social-media-s3
        # Bearer token for the cloud agent's /api/inbox requests. The Anthropic
        # vault substitutes the same value in the Authorization header at egress.
        - secretRef:
            name: ig-inbox-uploader-agent-token
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            # Video uploads are buffered wholly in memory by the current handler
            # (app/main.py reads every file with `await f.read()` and holds them
            # all before writing). 512Mi was OOMKilled (exit 137) by a phone-video
            # upload on 2026-07-30. This is a STOPGAP that only raises the ceiling
            # — the real fix is streaming uploads, tracked in the app repo.
            memory: "4Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      # Tailscale sidecar — serves the app privately over HTTPS.
      - name: tailscale
        image: tailscale/tailscale:v1.80.0
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-authkey
              key: TS_AUTHKEY
        - name: TS_HOSTNAME
          value: "ig-inbox"
        - name: TS_EXTRA_ARGS
          value: "--advertise-tags=tag:k8s"
        - name: TS_USERSPACE
          value: "true"
        - name: TS_KUBE_SECRET
          value: ""                                 # no k8s API (unreachable in userspace mode)
        - name: TS_STATE_DIR
          value: "/tmp/tsstate"
        - name: TS_SOCKET
          value: "/tmp/tsstate/tailscaled.sock"
        - name: TS_SERVE_CONFIG
          value: "/etc/tailscale/serve.json"
        volumeMounts:
        - name: serve
          mountPath: /etc/tailscale
        - name: tsstate
          mountPath: /tmp/tsstate
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: serve
        configMap:
          name: tailscale-serve
      - name: tmp
        emptyDir: {}
      - name: tsstate
        persistentVolumeClaim:
          claimName: ig-inbox-tailscale-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ig-inbox-tailscale-state
  namespace: ig-inbox-uploader
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-csi-v2
  resources:
    requests:
      storage: 64Mi
