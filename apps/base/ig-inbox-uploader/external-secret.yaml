# App config — Dropbox + Supabase + governance credentials for the IG inbox
# uploader. Stored in AWS SM as a single JSON blob at ig-inbox-uploader/config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ig-inbox-uploader-config
  namespace: ig-inbox-uploader
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: ig-inbox-uploader-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DROPBOX_APP_KEY: "{{ .DROPBOX_APP_KEY }}"
        DROPBOX_APP_SECRET: "{{ .DROPBOX_APP_SECRET }}"
        DROPBOX_REFRESH_TOKEN: "{{ .DROPBOX_REFRESH_TOKEN }}"
        SUPABASE_URL: "{{ .SUPABASE_URL }}"
        SUPABASE_ANON_KEY: "{{ .SUPABASE_ANON_KEY }}"
        GOV_SUPABASE_URL: "{{ .GOV_SUPABASE_URL }}"
        GOV_SERVICE_ROLE_KEY: "{{ .GOV_SERVICE_ROLE_KEY }}"
        GOV_AGENT_ID: "{{ .GOV_AGENT_ID }}"
        ALLOWED_EMAILS: "{{ .ALLOWED_EMAILS }}"
  data:
  - secretKey: DROPBOX_APP_KEY
    remoteRef:
      key: ig-inbox-uploader/config
      property: DROPBOX_APP_KEY
  - secretKey: DROPBOX_APP_SECRET
    remoteRef:
      key: ig-inbox-uploader/config
      property: DROPBOX_APP_SECRET
  - secretKey: DROPBOX_REFRESH_TOKEN
    remoteRef:
      key: ig-inbox-uploader/config
      property: DROPBOX_REFRESH_TOKEN
  - secretKey: SUPABASE_URL
    remoteRef:
      key: ig-inbox-uploader/config
      property: SUPABASE_URL
  - secretKey: SUPABASE_ANON_KEY
    remoteRef:
      key: ig-inbox-uploader/config
      property: SUPABASE_ANON_KEY
  - secretKey: GOV_SUPABASE_URL
    remoteRef:
      key: ig-inbox-uploader/config
      property: GOV_SUPABASE_URL
  - secretKey: GOV_SERVICE_ROLE_KEY
    remoteRef:
      key: ig-inbox-uploader/config
      property: GOV_SERVICE_ROLE_KEY
  - secretKey: GOV_AGENT_ID
    remoteRef:
      key: ig-inbox-uploader/config
      property: GOV_AGENT_ID
  - secretKey: ALLOWED_EMAILS
    remoteRef:
      key: ig-inbox-uploader/config
      property: ALLOWED_EMAILS
  refreshInterval: 1h
