# Bearer token the cloud content-manager agent sends on /api/inbox requests.
# This token is substituted at egress by the Anthropic vault credential, so the
# real value never lives inside the agent sandbox.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ig-inbox-uploader-agent-token
  namespace: ig-inbox-uploader
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: ig-inbox-uploader-agent-token
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        INBOX_API_TOKEN: "{{ .INBOX_API_TOKEN }}"
  data:
    - secretKey: INBOX_API_TOKEN
      remoteRef:
        key: ig-inbox-uploader/agent-api-token
        property: INBOX_API_TOKEN
  refreshInterval: 1h
