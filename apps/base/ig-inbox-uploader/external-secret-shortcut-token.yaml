# Bearer token the iOS Shortcut sends on /api/shortcut/upload.
#
# Deliberately separate from the agent's INBOX_API_TOKEN: that one authorises a
# read path for the cloud agent, this one authorises writing bytes into the
# inbox from a phone. One credential should not do both — a leak of the read
# token must not become the ability to inject media that later gets published.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ig-inbox-uploader-shortcut-token
  namespace: ig-inbox-uploader
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: ig-inbox-uploader-shortcut-token
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        UPLOAD_API_TOKEN: "{{ .UPLOAD_API_TOKEN }}"
  data:
    - secretKey: UPLOAD_API_TOKEN
      remoteRef:
        key: ig-inbox-uploader/shortcut-upload-token
        property: UPLOAD_API_TOKEN
  refreshInterval: 1h
