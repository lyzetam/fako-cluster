# AWS Secrets Manager store — auths via the in-namespace `aws-credentials`
# bootstrap secret (mirrors withings-collector). Reads ig-inbox-uploader/
# and tailscale/ secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: ig-inbox-uploader
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
