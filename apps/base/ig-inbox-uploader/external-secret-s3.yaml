# S3 credentials for the uploader, pulled from the SAME AWS SM blob the gateway
# and the reel pipeline read (social-media/s3-credentials) — one source of truth,
# so rotating the key is a single AWS write.
#
# S3_ENDPOINT here is the CLUSTER-INTERNAL Service URL, deliberately. The uploader
# runs in-cluster, so routing its writes out through Cloudflare and back would add
# a WAN round-trip and subject them to the 100 MB proxied-body cap for no benefit.
# S3_PUBLIC_ENDPOINT is carried too, for anything that needs to mint a URL an
# outside party (Instagram) will fetch.
#
# These key names match app/config.py's Settings fields exactly, so the deployment
# can envFrom this secret directly with no mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: social-media-s3
  namespace: ig-inbox-uploader
spec:
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: social-media-s3
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_PUBLIC_ENDPOINT: "{{ .S3_PUBLIC_ENDPOINT }}"
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
        S3_BUCKET: "{{ .S3_BUCKET }}"
        S3_REGION: "{{ .S3_REGION }}"
  data:
    - secretKey: S3_ENDPOINT
      remoteRef: { key: social-media/s3-credentials, property: S3_ENDPOINT }
    - secretKey: S3_PUBLIC_ENDPOINT
      remoteRef: { key: social-media/s3-credentials, property: S3_PUBLIC_ENDPOINT }
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: social-media/s3-credentials, property: S3_ACCESS_KEY }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: social-media/s3-credentials, property: S3_SECRET_KEY }
    - secretKey: S3_BUCKET
      remoteRef: { key: social-media/s3-credentials, property: S3_BUCKET }
    - secretKey: S3_REGION
      remoteRef: { key: social-media/s3-credentials, property: S3_REGION }
  refreshInterval: 1h
