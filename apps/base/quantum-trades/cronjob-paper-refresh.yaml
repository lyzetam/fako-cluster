# Nightly refresh of the PAPER tier so the dev tier is never behind prod.
#
# WHY THIS EXISTS (2026-09-02)
#
# Paper tracks `:latest` with imagePullPolicy: Always — but Always only pulls
# when a POD STARTS. Live restarts every time its pinned SHA is bumped; paper
# had been running untouched, so it never re-pulled. Caught with digests:
#
#   live  ...@sha256:dede966de1fe...   (4c95d755, published 15:03 Sep 2)
#   paper ...@sha256:71f7a608fbf4...   (3d53b0f0, published 16:12 Sep 1)
#
# The dev tier was a full commit BEHIND production. That is worse than having
# no dev tier, because you trust it: you would validate a change on paper
# against code production had already superseded.
#
# 07:30 ET, ahead of the 08:00 prequalification funnel and the 09:30 open, so
# paper starts each session on the same code paper is meant to be testing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paper-refresher
  namespace: quantum-trades
  labels:
    app.kubernetes.io/name: paper-refresher
    app.kubernetes.io/part-of: quantum-trades
---
# Namespaced Role, and resourceNames pins it to the PAPER deployment alone.
# This identity must never be able to restart the LIVE trading loop: a restart
# drops the leader lock and interrupts exit monitoring on real money.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paper-refresher
  namespace: quantum-trades
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    resourceNames: [orchestrator-qt-paper]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paper-refresher
  namespace: quantum-trades
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: paper-refresher
subjects:
  - kind: ServiceAccount
    name: paper-refresher
    namespace: quantum-trades
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paper-refresh
  namespace: quantum-trades
  labels:
    app.kubernetes.io/name: paper-refresh
    app.kubernetes.io/part-of: quantum-trades
spec:
  schedule: "30 7 * * 1-5"
  timeZone: "America/New_York"
  # A missed slot must not fire hours later into a live session — a restart
  # mid-session drops paper's leader lock and its exit monitoring with it.
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: paper-refresher
          containers:
            - name: paper-refresh
              image: alpine/kubectl:1.34.2
              command:
                - sh
                - -c
                - |
                  set -e
                  D=orchestrator-qt-paper
                  G() { kubectl -n quantum-trades get deployment "$D" -o jsonpath="{$1}"; }

                  echo "Refreshing paper tier so it picks up :latest ..."
                  kubectl -n quantum-trades rollout restart "deployment/$D"

                  # NOT `kubectl rollout status`, and NOT `get pods -l`: both need
                  # list/watch, and RBAC cannot grant list/watch alongside the
                  # resourceNames restriction that keeps this identity away from the
                  # LIVE deployment. Probed 2026-09-03 — the restart succeeded and
                  # then the job died on
                  #   deployments.apps "orchestrator-qt-paper" is forbidden:
                  #   ... cannot list resource "deployments"
                  # which would have bounced paper up to backoffLimit times every
                  # morning. Poll the named deployment with `get` instead.
                  echo "waiting for the new generation to become available ..."
                  for _ in $(seq 1 60); do
                    if [ "$(G .status.observedGeneration)" = "$(G .metadata.generation)" ] \
                       && [ "$(G .status.updatedReplicas)" = "$(G .spec.replicas)" ] \
                       && [ "$(G .status.readyReplicas)"   = "$(G .spec.replicas)" ]; then
                      echo "paper is up: generation $(G .metadata.generation), $(G .status.readyReplicas)/$(G .spec.replicas) ready"
                      echo "image: $(G .spec.template.spec.containers[0].image)"
                      exit 0
                    fi
                    sleep 5
                  done
                  # Loud, not silent: a paper tier that restarted but never came
                  # back must page, not exit 0.
                  echo "FATAL: $D did not become ready within 300s" >&2
                  exit 1
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
