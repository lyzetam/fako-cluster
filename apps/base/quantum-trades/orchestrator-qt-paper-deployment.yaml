# Orchestrator-QT PAPER Deployment — the dev tier of the trading system.
#
# SAME IMAGE, SAME PIPELINE, DIFFERENT EXECUTION LAYER. This runs beside the
# live deployment and differs in exactly four ways:
#   1. TRADING_MODE=paper      -> sandbox.tradier.com + TRADIER_SANDBOX_* creds
#   2. SUPABASE_SCHEMA=paper   -> its own book (positions, trades, capital,
#                                 halts, decision tape, risk profile)
#   3. risk profile            -> paper.active_profile = aggressive, while
#                                 public.active_profile = conservative
#   4. its own leader lock     -> quantum:trading:leader:paper
#
# The PIPELINE IS SHARED on purpose: prequalification CronJobs build ONE
# universe in public, and paper reads it through read-only views
# (paper.watchlist / paper.universe_meta). Both environments therefore evaluate
# the identical opportunity set and differ only in how they execute it.
#
# The image is deliberately NOT forked. Two images drift, and you end up
# testing code you do not run.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-qt-paper
  namespace: quantum-trades
  labels:
    app: orchestrator-qt-paper
    component: autonomous-agents-paper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator-qt-paper
      component: autonomous-agents-paper
  template:
    metadata:
      labels:
        app: orchestrator-qt-paper
        component: autonomous-agents-paper
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-09-01T14:30:00Z"  # paper tier created
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: orchestrator-qt-service-account
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: dockerhub-registry

      # Pod-level security context - fsGroup ensures NFS volume files are group-accessible
      securityContext:
        fsGroup: 1000

      # Init containers
      initContainers:
        # Fix NFS volume permissions before app starts
        - name: fix-permissions
          image: busybox:1.37
          command: ['sh', '-c', 'chown -R 1000:1000 /app/memories && chmod -R 775 /app/memories']
          volumeMounts:
            - name: memory-store
              mountPath: /app/memories

        # Verify service dependencies
        - name: check-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "Checking service dependencies..."
              wget -q --spider http://technicals-service:8001/health || exit 1
              wget -q --spider http://signals-service:8002/health || exit 1
              wget -q --spider http://trading-service:8005/health || exit 1
              echo "All dependencies healthy!"

      # Containers
      containers:
        - name: orchestrator-qt-service
          # PAPER TRACKS :latest. Every merge to main lands here on the next
          # pod restart, with no manifest change — this is the dev tier, and
          # that is the point. Live is pinned to a SHA and is unaffected until
          # someone promotes.
          image: lzetam/quantum-trades-orchestrator-qt:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8006
              protocol: TCP
            - name: metrics
              containerPort: 8086
              protocol: TCP

          # Environment Variables
          env:
            # Python must flush stdout immediately for kubectl logs
            - name: PYTHONUNBUFFERED
              value: "1"

            # Daily loss limit = max(MAX_DAILY_LOSS_DOLLARS, pct * equity).
            # Raised 2% -> 10% (2026-08-06, zz). On the ~$94k account that is
            # ~$9.4k/day rather than ~$1.9k.
            #
            # NOTE this does NOT fix the halt that prompted it. On 2026-08-05
            # trading halted on a -$808 day against a $1,879 limit, because
            # agents/risk/daily_risk.py fails safe to portfolio_value=0 when the
            # equity read errors -- and effective_daily_loss_limit(0) collapses
            # to the DOLLAR FLOOR ($50). Tradier was 504ing all that session
            # (the same outage that froze the stop ratchet), so the limit became
            # $50 and any losing day tripped it. Raising the pct leaves that
            # collapse-to-floor path untouched.
            - name: MAX_DAILY_LOSS_PCT
              value: "0.10"

            # Weekly cap = 2x the daily limit (zz, 2026-08-06): losing a full
            # daily limit twice ends the week. 2 x (10% of ~$94k) = ~$18.8k.
            # Was a flat $2,000 set when the account was far smaller -- 2.1% of
            # today's equity, i.e. a WEEKLY tolerance one-fifth of the DAILY
            # one, which inverted the usual backstop relationship.
            # NOTE this is still a flat dollar amount and will drift as the
            # account grows; the derivation (weekly = 2 x effective daily) is
            # shipping separately so it tracks automatically.
            - name: MAX_WEEKLY_LOSS_DOLLARS
              value: "18800"

            # Service URLs
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8006"
            - name: TECHNICALS_SERVICE_URL
              value: "http://technicals-service:8001"
            - name: SIGNALS_SERVICE_URL
              value: "http://signals-service:8002"
            - name: TRADING_SERVICE_URL
              value: "http://trading-service:8005"
            - name: BACKEND_SERVICE_URL
              value: "http://backend-service:8000"

            # LLM Configuration - externalized model IDs for easy updates
            # See: https://platform.claude.com/docs/en/docs/about-claude/models/overview
            - name: AGENT_MODEL_ID
              value: "claude-sonnet-4-5-20250929"

            # Autonomous Trading Loop - deployment-level toggle only
            # All trading parameters (capital, limits, position sizing) are in
            # config.py defaults. Do NOT override them here — config.py is the
            # single source of truth for trading logic.
            - name: AUTONOMOUS_LOOP_ENABLED
              value: "true"

            # === Paper / Live trading toggle ===
            # Single source of truth for which Tradier environment to use.
            #   "paper" → sandbox.tradier.com + TRADIER_SANDBOX_* credentials
            #   "live"  → api.tradier.com     + TRADIER_LIVE_*    credentials
            # Both credential sets are pulled into the K8s Secret by the
            # ExternalSecret manifest; the orchestrator-qt code (config.py
            # `resolved_tradier_credentials`) picks the active set based on
            # this env var. Switching is a one-line edit + flux reconcile.
            - name: TRADING_MODE
              value: "paper"

            # Its own book. The startup guard (config.assert_environment_isolation)
            # REFUSES TO BOOT if this is "public" while TRADING_MODE is paper —
            # that pairing would write sandbox fills into the live ledger, which
            # is what the daily-loss circuit breaker reads.
            - name: SUPABASE_SCHEMA
              value: "paper"

            # Paper-only: Tradier sandbox returns OI=0 for options, so the
            # fail-closed open-interest floor would reject every paper trade and
            # the autonomous loop could never trade (blocking the paper-prove
            # go-live gate). This override relaxes the floor in paper.
            # SAFE IN LIVE: the code ignores this override when TRADING_MODE=live
            # (executor_tools.select_option_contract), so a leftover value cannot
            # relax the real floor. Removing it on go-live is tidy but not required.
            - name: MIN_OPEN_INTEREST_OVERRIDE
              value: "0"

            # Logging
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"

            # Database Configuration (for simulation persistence)
            - name: TRADING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: TRADING_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://trading:$(TRADING_DB_PASSWORD)@postgres-cluster-rw.postgres.svc.cluster.local:5432/trading"

            # Market Replay Service
            - name: MARKET_REPLAY_URL
              value: "http://market-replay-gateway.market-replay.svc.cluster.local:8000"

            # Redis Configuration - for distributed leader lock only
            - name: REDIS_URL
              value: "redis://agent-redis:6379"

            # LLM Configuration (2026-07-21): Ollama Cloud ONLY — the audits'
            # dedicated Anthropic key is being disabled (it produced failed
            # calls for weeks + an inline-await stall risk). Native /api/chat
            # against ollama.com, bearer auth via OLLAMA_API_KEY (from the
            # ExternalSecret), model glm-5.2 (glm-4.x retired on cloud
            # 2026-07-15). Chat + tool-calling probed live before this change.
            - name: LLM_PROVIDER_ORDER
              value: "ollama"
            - name: OLLAMA_BASE_URL
              value: "https://ollama.com"
            - name: OLLAMA_MODEL
              value: "glm-5.2"
            - name: LLM_FALLBACK_ENABLED
              value: "true"
            - name: LLM_FALLBACK_CACHE_TTL_SECONDS
              value: "300"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: OPENAI_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: GOOGLE_API_KEY

          # Secrets from k8s Secret and AWS Secrets Manager
          envFrom:
            - secretRef:
                name: orchestrator-qt-secrets

          # Volume Mounts
          volumeMounts:
            - name: memory-store
              mountPath: /app/memories
            - name: config
              mountPath: /app/config
              readOnly: true

          # Resource Limits and Requests
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          # Probes
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30  # 10 + 30*10 = 310s max startup time

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000

      # Volumes - Use shared PVC with CronJob for consistent state
      volumes:
        # Paper does NOT share the live memories PVC. Supabase is the real
        # store; /app/memories is legacy file state and sharing it would be a
        # second, undeclared channel between the two environments.
        - name: memory-store
          emptyDir: {}
        - name: config
          configMap:
            name: orchestrator-qt-config
            items:
              - key: pre_research_config.json
                path: pre_research_config.json
              - key: research_config.json
                path: research_config.json
              - key: executor_config.json
                path: executor_config.json
              - key: risk_config.json
                path: risk_config.json
              - key: exit_config.json
                path: exit_config.json
              - key: learning_config.json
                path: learning_config.json
              - key: decision_review_config.json
                path: decision_review_config.json
              - key: meta_learner_config.json
                path: meta_learner_config.json
              - key: validation_config.json
                path: validation_config.json
              - key: governance_config.json
                path: governance_config.json
              - key: strategy_params.json
                path: strategy_params.json
              - key: risk_limits.json
                path: risk_limits.json
              - key: watchlist.json
                path: watchlist.json
              - key: llm_fallback_config.json
                path: llm_fallback_config.json

      # Pod Disruption Budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - orchestrator-qt-paper
                topologyKey: kubernetes.io/hostname

      # Restart Policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 120

---
# Service for orchestrator-qt deployment
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-qt-paper
  namespace: quantum-trades
  labels:
    app: orchestrator-qt-paper
spec:
  type: ClusterIP
  selector:
    app: orchestrator-qt-paper
  ports:
    - name: http
      port: 8006
      targetPort: 8006
      protocol: TCP
    - name: metrics
      port: 8086
      targetPort: 8086
      protocol: TCP
  sessionAffinity: None

# NOTE: ServiceAccount, ClusterRole, ClusterRoleBinding and the memories PVC
# are NOT redeclared here — they live in orchestrator-qt-deployment.yaml and are
# shared. Duplicating them would make kustomize build fail on colliding names.
# This file owns exactly two objects: the paper Deployment and its Service.
