apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quantum-trades
resources:
  - namespace.yaml
  - configmap.yaml
  - secret-store.yaml
  - external-secret.yaml
  - pvc-scan-results.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - signals-deployment.yaml
  - technicals-deployment.yaml
  - strategies-deployment.yaml
  - backtesting-deployment.yaml
  - trading-deployment.yaml
  - services.yaml
  # Tier 3 data aggregator — adopted into GitOps 2026-07-22 (was cluster-only, 13 manual revisions)
  - market-data-api.yaml
  # PAPER tier — same image, same pipeline, its own execution layer
  # (sandbox broker + `paper` Supabase schema + its own leader lock and risk
  # profile). Added 2026-09-01. Deleting this file is a clean rollback; the
  # live deployment does not depend on it.
  - orchestrator-qt-paper-deployment.yaml
  # Paper-tier exit validation — same checks, its own broker and book.
  - cronjob-exit-validation-preopen-paper.yaml
  - cronjob-exit-validation-postclose-paper.yaml
  - ingress.yaml
  # WebSocket IngressRoute with extended timeouts
  - middleware-websocket.yaml
  - ingressroute-websocket.yaml
  # Options Scanner CronJob
  - external-secret-obsidian.yaml
  - configmap-scanner.yaml
  - cronjob-scanner.yaml
  # Day/swing scanner variants — adopted into GitOps 2026-07-22 (were manual applies)
  - cronjob-scanner-day.yaml
  - cronjob-scanner-swing.yaml
  # Trade Journal Sync CronJob (hourly)
  - cronjob-journal-sync.yaml
  # Pre-Qualification CANDIDATES — premarket stages 1-4 (8:00am ET). No live
  # quotes needed, so it publishes session_date=today BEFORE the open and
  # entries are never blocked waiting for a funnel run at 09:30.
  - cronjob-prequalification-candidates.yaml
  # Pre-Qualification PRUNE — stage 5 option liquidity (9:40am ET). Needs live
  # quotes. An optimisation, not a gate: on failure the premarket universe is
  # left untouched and trading continues.
  - cronjob-prequalification-prune.yaml
  # Pre-Qualification Agent — full 5-stage funnel (10:00am ET), now a FALLBACK
  # for days when the premarket candidates run fails
  - cronjob-prequalification.yaml
  # Pre-Qualification FALLBACK — post-open re-run (9:45am ET) guarantees a universe
  # when the 8am premarket run crashes (recurring 2026-07-13/14/15)
  # Funnel fillability check — confirms the funnel produced a fillable watchlist (10:15am ET)
  - cronjob-funnel-check.yaml
  # Exit validation: post-close divergence audit + pre-open regression gate
  - cronjob-exit-validation-postclose.yaml
  - cronjob-loop-watchdog.yaml
  - cronjob-exit-validation-preopen.yaml
  # Orchestrator-QT - LangGraph Trading Coordinator
  - redis-orchestrator-qt.yaml
  - configmap-orchestrator-qt.yaml
  - external-secret-orchestrator-qt.yaml
  - orchestrator-qt-deployment.yaml
