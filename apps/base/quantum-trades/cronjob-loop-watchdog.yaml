# Trading-loop liveness watchdog.
#
# WHY THIS EXISTS (2026-08-11). Two outages in one week, both silent:
#   * Raising agent-redis's memory limit rolled the redis pod. The leader lock
#     lives in Redis, so the loop lost it and shut itself down. Correct
#     behaviour — it is what stops two pods trading one account — but NOTHING
#     SAID SO. loop_running=false sat there with the market open for ~20 min
#     until a human happened to look.
#   * A Recreate restart left the orchestrator Pending for 7 min ("Insufficient
#     memory"), equally silently.
# Both were found by chance. This makes the next one arrive as a message.
#
# WHY A CRONJOB AND NOT AN IN-PROCESS CHECK: a watchdog on the loop's own
# scheduler dies with the loop, and a dead watchdog looks exactly like a
# healthy one. Running out-of-process is the whole point — it survives the
# failure it reports, including the pod being gone entirely.
#
# IT ALERTS, IT DOES NOT RESTART. A stopped loop can mean another pod holds the
# leader lock; starting a second would put two writers on one account. Same
# reason halts never auto-resume: recovery is a human act.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trading-loop-watchdog
  namespace: quantum-trades
  labels:
    app.kubernetes.io/name: trading-loop-watchdog
    app.kubernetes.io/part-of: quantum-trades
    app.kubernetes.io/managed-by: flux
spec:
  # Every 5 minutes, 08:00-16:55 ET on weekdays. Covers premarket (the loop
  # should be up before the open) through the close. The loop technically runs
  # 24/7 for position sync, but paging at 3am for a state nobody will act on
  # until morning trains people to ignore the alert.
  schedule: "*/5 8-16 * * 1-5"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  # ~108 runs/day: keep almost no history or the namespace fills with pods.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 900
      # backoffLimit 0 + restartPolicy Never: a failing check exits non-zero ON
      # PURPOSE, so the CronJob's own status is a second place to notice the
      # outage besides Discord. Retrying would erase that signal.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-registry
          containers:
            - name: trading-loop-watchdog
              image: lzetam/quantum-trades-orchestrator-qt:latest
              imagePullPolicy: Always
              command: ["python", "-m", "validation.watchdog"]
              env:
                # Service DNS, not localhost — this runs in its own pod.
                - name: TRADING_STATUS_URL
                  value: "http://orchestrator-qt:8006/trading/status"
                # The write probe follows TRADING_MODE (validation/watchdog.py
                # resolves credentials the same way the loop does). Without this
                # it defaults to paper and would watch the SANDBOX while the
                # live account holds the money — silent through the one outage
                # that matters. Watches the same environment it reports on.
                - name: TRADING_MODE
                  value: "live"
                - name: PYTHONUNBUFFERED
                  value: "1"
              # AGENTS_API_KEY and the Discord webhook come from the secret the
              # live orchestrator-qt deployment already uses.
              envFrom:
                - secretRef:
                    name: orchestrator-qt-secrets
              # Deliberately tiny. This is one HTTP GET and a JSON parse, and it
              # runs ~108 times a day on a cluster sitting at 92-98% RESERVED
              # (that gap is what left the orchestrator unschedulable on 08-11).
              # A watchdog that cannot be scheduled is worse than none, because
              # its silence reads as health.
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 192Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
