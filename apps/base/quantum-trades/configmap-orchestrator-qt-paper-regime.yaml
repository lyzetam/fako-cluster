# Paper's strategy regime, in ONE place.
#
# Every process that reads paper's decision tape must run the SAME regime the
# loop ran — the exit-validation CronJobs replay the coordinator against the
# tape, and on 2026-09-23 they carried none of these flags, replayed the
# premium regime against a horizon-regime tape, and reported "divergent" for
# a day that was not. Inline env on the Deployment would drift from the
# CronJobs again; a shared ConfigMap cannot.
#
# Values and their reasons: quantum-trades
# docs/superpowers/specs/2026-09-22-entry-edge-study-and-horizon-redesign.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-qt-paper-regime
  namespace: quantum-trades
  labels:
    app.kubernetes.io/name: orchestrator-qt-paper
    app.kubernetes.io/part-of: quantum-trades
data:
  ENTRY_DIRECTION_MODE: "composite"
  BEARISH_ENTRIES_ENABLED: "true"
  CONTRARIAN_LONG_ENABLED: "true"
  CONTRARIAN_LONG_MAX_SCORE: "30"
  ENTRY_DTE_MIN: "45"
  ENTRY_DTE_MAX: "75"
  CHAIN_MAX_DTE_HORIZON: "80"
  ENTRY_OTM_MIN_PCT: "-6.0"
  ENTRY_OTM_MAX_PCT: "2.0"
  ENTRY_DELTA_MIN: "0.55"
  ENTRY_DELTA_MAX: "0.78"
  ENTRY_DELTA_IDEAL: "0.62"
  ENTRY_MAX_OPTION_PREMIUM: "12.00"
  ENTRY_MAX_POSITION_SIZE: "1500"
  # Per-UNDERLYING value cap (executor_tools validate: existing value + new cost).
  # Was the 1000 default while ENTRY_MAX_POSITION_SIZE sized fresh names to 1500:
  # 2026-09-24 WFC sized to 2 x 5.05 = $1,010 and the $1,000 cap refused it. The
  # two caps must agree — the tighter one silently wins.
  MAX_POSITION_VALUE_DOLLARS: "1500"
  EXIT_REGIME: "horizon"
  STOP_ATR_MULTIPLE: "1.5"
  MAX_HOLD_TRADING_DAYS: "12"

  # --- Exits under the horizon regime, set from the 2026-09-23 backtest
  # (7,320 regime trades over three years, spec §Backtest):
  #   breakeven ratchet ON (arm +12, trail 15 pts):  +0.7% of premium / trade
  #   no premium-based profit rule, floor -50%:       +3.9%
  #   no premium-based profit rule, floor -65%:       +5.7%
  #   floor -80%:                                     +5.9%   (not worth the crash exposure)
  # The floor is what fires (a third of trades intraday at -50); the stock
  # stop's width barely matters.
  HORIZON_LAYER1_LOSS_PCT: "65"
  PROFIT_LADDER_ENABLED: "false"
  # --- Bank profit, keep a runner (owner, 2026-10-05: "we should take
  # profit, and keep a small runner!!!", with NU +150%, EWZ +125%, GME +41%
  # open under no profit rule). The loop's own scale-out (_profit_lifecycle;
  # PROFIT_LADDER_ENABLED=false only removes the BROKER-resident slices)
  # sells SCALEOUT_SELL_FRACTION of what is still held at each rung, rounded
  # up, never below the one-contract runner: a 10-lot banks 5 at +75% and 3
  # of the remaining 5 at +150%, keeping 2. A one-lot that never banked is
  # sold whole at SCALEOUT_RUNNER_CAP_PCT (it cannot be split); a runner
  # that banked is never capped. Once the peak crosses STOP_RATCHET_ARM_PCT
  # the broker stop moves to BREAKEVEN (horizon: never the peak-15 trail);
  # the runner's exits are that stop, the stock stop and the 12-day clock.
  # JSON list: pydantic parses list[float] from the env.
  SCALEOUT_GAIN_TRIGGERS: "[75.0, 150.0]"
  SCALEOUT_SELL_FRACTION: "0.5"
  SCALEOUT_RUNNER_CAP_PCT: "150"
  STOP_RATCHET_ARM_PCT: "75"
  # Premium as a share of spot at entry: at ~8% the regime pays, at ~12% it
  # does not (theta over an 8-day hold). Refuses SOXS 20%, HIMS 15%, RKT 13%.
  MAX_PREMIUM_PCT_OF_UNDERLYING: "11"
