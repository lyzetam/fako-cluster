# Orchestrator-QT Deployment (LangGraph Trading Coordinator)
# Replaces: agents-coordinator-deployment.yaml + deployment-trading-loop.yaml
# Source: quantum-trades/orchestrator-qt with conservative capital limits

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-qt
  namespace: quantum-trades
  labels:
    app: orchestrator-qt
    component: autonomous-agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator-qt
      component: autonomous-agents
  template:
    metadata:
      labels:
        app: orchestrator-qt
        component: autonomous-agents
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-08-25T23:23:36Z"  # /trading/universe-status + /trading/profile endpoints for dashboard
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: orchestrator-qt-service-account
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: dockerhub-registry

      # Pod-level security context - fsGroup ensures NFS volume files are group-accessible
      securityContext:
        fsGroup: 1000

      # Init containers
      initContainers:
        # Fix NFS volume permissions before app starts
        - name: fix-permissions
          image: busybox:1.37
          command: ['sh', '-c', 'chown -R 1000:1000 /app/memories && chmod -R 775 /app/memories']
          volumeMounts:
            - name: memory-store
              mountPath: /app/memories

        # Verify service dependencies
        - name: check-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo "Checking service dependencies..."
              wget -q --spider http://technicals-service:8001/health || exit 1
              wget -q --spider http://signals-service:8002/health || exit 1
              wget -q --spider http://trading-service:8005/health || exit 1
              echo "All dependencies healthy!"

      # Containers
      containers:
        - name: orchestrator-qt-service
          # LIVE IS PINNED, ON PURPOSE. Paper tracks :latest and receives every
          # merge to main automatically; live moves only when a human edits the
          # SHA below. That is the promotion gate — code proven on paper is
          # promoted to live by changing this one line, committing, and letting
          # Flux reconcile. It is auditable in git and reversible by reverting
          # the commit.
          #
          # Promoted quantum-trades 4c95d755ff05 on 2026-09-02 (entry_premium = broker fill).
          image: lzetam/quantum-trades-orchestrator-qt:4c95d755ff05f3d9d457a7e3a4ad87f0eb7950e9
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8006
              protocol: TCP
            - name: metrics
              containerPort: 8086
              protocol: TCP

          # Environment Variables
          env:
            # Python must flush stdout immediately for kubectl logs
            - name: PYTHONUNBUFFERED
              value: "1"

            # Daily loss limit = max(MAX_DAILY_LOSS_DOLLARS, pct * equity).
            # Raised 2% -> 10% (2026-08-06, zz). On the ~$94k account that is
            # ~$9.4k/day rather than ~$1.9k.
            #
            # NOTE this does NOT fix the halt that prompted it. On 2026-08-05
            # trading halted on a -$808 day against a $1,879 limit, because
            # agents/risk/daily_risk.py fails safe to portfolio_value=0 when the
            # equity read errors -- and effective_daily_loss_limit(0) collapses
            # to the DOLLAR FLOOR ($50). Tradier was 504ing all that session
            # (the same outage that froze the stop ratchet), so the limit became
            # $50 and any losing day tripped it. Raising the pct leaves that
            # collapse-to-floor path untouched.
            # === $211 LIVE ACCOUNT ENVELOPE (2026-09-01) ===
            # Probed, not assumed: total_equity 211.40, CASH account (T+1
            # settlement), option_level 2 (long calls/puts approved — verified
            # by a live order preview returning status ok, cost $74.00).
            #
            # 25%, not the 10% used when this account was ~$94k. A scan of the
            # live 26-name universe found 9 affordable contracts at $1.02-$1.89,
            # so a worst-case position is ~$189 and a -25% zone stop loses ~$47.
            # At 10% ($21) EVERY stop-out would halt the day. At 25% ($53)
            # exactly one full stop-out passes and two always halt.
            - name: MAX_DAILY_LOSS_PCT
              value: "0.25"
            - name: MAX_DAILY_LOSS_DOLLARS
              value: "40"

            # Weekly cap = 2x the daily limit (zz, 2026-08-06): losing a full
            # daily limit twice ends the week. 2 x (10% of ~$94k) = ~$18.8k.
            # Was a flat $2,000 set when the account was far smaller -- 2.1% of
            # today's equity, i.e. a WEEKLY tolerance one-fifth of the DAILY
            # one, which inverted the usual backstop relationship.
            # NOTE this is still a flat dollar amount and will drift as the
            # account grows; the derivation (weekly = 2 x effective daily) is
            # shipping separately so it tracks automatically.
            # 2x the daily limit, same derivation as before — just against $211
            # instead of $94k. 18800 was 89x this account.
            - name: MAX_WEEKLY_LOSS_DOLLARS
              value: "106"

            # Service URLs
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8006"
            - name: TECHNICALS_SERVICE_URL
              value: "http://technicals-service:8001"
            - name: SIGNALS_SERVICE_URL
              value: "http://signals-service:8002"
            - name: TRADING_SERVICE_URL
              value: "http://trading-service:8005"
            - name: BACKEND_SERVICE_URL
              value: "http://backend-service:8000"

            # LLM Configuration - externalized model IDs for easy updates
            # See: https://platform.claude.com/docs/en/docs/about-claude/models/overview
            - name: AGENT_MODEL_ID
              value: "claude-sonnet-4-5-20250929"

            # Autonomous Trading Loop - deployment-level toggle only
            # All trading parameters (capital, limits, position sizing) are in
            # config.py defaults. Do NOT override them here — config.py is the
            # single source of truth for trading logic.
            # LIVE TRADING IS ON (2026-09-01, zz: "I want live trade to go live
            # now, as the account is small, and I am willing to put that $200
            # budget at risk"). Real money, $211.40, one position at a time.
            - name: AUTONOMOUS_LOOP_ENABLED
              value: "true"

            # === Paper / Live trading toggle ===
            # Single source of truth for which Tradier environment to use.
            #   "paper" → sandbox.tradier.com + TRADIER_SANDBOX_* credentials
            #   "live"  → api.tradier.com     + TRADIER_LIVE_*    credentials
            # Both credential sets are pulled into the K8s Secret by the
            # ExternalSecret manifest; the orchestrator-qt code (config.py
            # `resolved_tradier_credentials`) picks the active set based on
            # this env var. Switching is a one-line edit + flux reconcile.
            - name: TRADING_MODE
              value: "live"

            # This deployment IS the live book. The startup guard
            # (config.assert_environment_isolation) refuses to boot on any other
            # value here — a live loop writing a paper schema, or a paper loop
            # writing this one, are both silent corruptions of the ledger the
            # daily-loss circuit breaker reads.
            - name: SUPABASE_SCHEMA
              value: "public"

            # The executor's deployable ceiling. The default (12000) is 57x this
            # account, which would let position sizing reason about money that
            # is not there. Broker cash still binds first; this makes the
            # intent explicit rather than incidental.
            # === PROFIT TAKING: BANK AT +30% (2026-09-02, zz: "for live
            # trading, 30% profit is good profit and should be banked") ===
            #
            # BOTH vars are required and they do different jobs. The cap decides
            # WHEN a runner gets a target; the price comes from the TRIGGERS
            # list. Setting the cap to 30 while triggers stayed [25, 90] would
            # have priced the target off the +90 rung (entry x 1.90) — a target
            # that almost never fills. Verified in-pod before shipping.
            #
            # Measured on 145 trades since 2026-07-23 (earlier peaks are
            # corrupted by the ensure_pnl_percent 100x bug):
            #   +90% cap  reached by  4.8% of trades  <- the old target
            #   +30% cap  reached by 23.4% of trades
            # and trades that peak >= 30% currently CLOSE at a median of +26.5%
            # after giving back ~31 points to the trailing stop. Banking 30
            # beats that by ~3.5 points and does not depend on the ratchet,
            # which was dead for four days last week.
            #
            # Every position on a $211 account is a 1-lot, so the scale-out
            # ladder can never fire and this cap is the ONLY profit mechanism.
            # Paper keeps [25, 90] / cap 90 — its job is to test the tail.
            - name: SCALEOUT_GAIN_TRIGGERS
              value: "[30.0]"
            - name: SCALEOUT_RUNNER_CAP_PCT
              value: "30"

            - name: INITIAL_CAPITAL
              value: "211"
            - name: DRAWDOWN_BASELINE
              value: "211"

            # Paper-only: Tradier sandbox returns OI=0 for options, so the
            # fail-closed open-interest floor would reject every paper trade and
            # the autonomous loop could never trade (blocking the paper-prove
            # go-live gate). This override relaxes the floor in paper.
            # SAFE IN LIVE: the code ignores this override when TRADING_MODE=live
            # (executor_tools.select_option_contract), so a leftover value cannot
            # relax the real floor. Removing it on go-live is tidy but not required.
            - name: MIN_OPEN_INTEREST_OVERRIDE
              value: "0"

            # Logging
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"

            # Database Configuration (for simulation persistence)
            - name: TRADING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: TRADING_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://trading:$(TRADING_DB_PASSWORD)@postgres-cluster-rw.postgres.svc.cluster.local:5432/trading"

            # Market Replay Service
            - name: MARKET_REPLAY_URL
              value: "http://market-replay-gateway.market-replay.svc.cluster.local:8000"

            # Redis Configuration - for distributed leader lock only
            - name: REDIS_URL
              value: "redis://agent-redis:6379"

            # LLM Configuration (2026-07-21): Ollama Cloud ONLY — the audits'
            # dedicated Anthropic key is being disabled (it produced failed
            # calls for weeks + an inline-await stall risk). Native /api/chat
            # against ollama.com, bearer auth via OLLAMA_API_KEY (from the
            # ExternalSecret), model glm-5.2 (glm-4.x retired on cloud
            # 2026-07-15). Chat + tool-calling probed live before this change.
            - name: LLM_PROVIDER_ORDER
              value: "ollama"
            - name: OLLAMA_BASE_URL
              value: "https://ollama.com"
            - name: OLLAMA_MODEL
              value: "glm-5.2"
            - name: LLM_FALLBACK_ENABLED
              value: "true"
            - name: LLM_FALLBACK_CACHE_TTL_SECONDS
              value: "300"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: OPENAI_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: GOOGLE_API_KEY

          # Secrets from k8s Secret and AWS Secrets Manager
          envFrom:
            - secretRef:
                name: orchestrator-qt-secrets

          # Volume Mounts
          volumeMounts:
            - name: memory-store
              mountPath: /app/memories
            - name: config
              mountPath: /app/config
              readOnly: true

          # Resource Limits and Requests
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # Probes
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30  # 10 + 30*10 = 310s max startup time

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000

      # Volumes - Use shared PVC with CronJob for consistent state
      volumes:
        - name: memory-store
          persistentVolumeClaim:
            claimName: trading-memories-pvc
        - name: config
          configMap:
            name: orchestrator-qt-config
            items:
              - key: pre_research_config.json
                path: pre_research_config.json
              - key: research_config.json
                path: research_config.json
              - key: executor_config.json
                path: executor_config.json
              - key: risk_config.json
                path: risk_config.json
              - key: exit_config.json
                path: exit_config.json
              - key: learning_config.json
                path: learning_config.json
              - key: decision_review_config.json
                path: decision_review_config.json
              - key: meta_learner_config.json
                path: meta_learner_config.json
              - key: validation_config.json
                path: validation_config.json
              - key: governance_config.json
                path: governance_config.json
              - key: strategy_params.json
                path: strategy_params.json
              - key: risk_limits.json
                path: risk_limits.json
              - key: watchlist.json
                path: watchlist.json
              - key: llm_fallback_config.json
                path: llm_fallback_config.json

      # Pod Disruption Budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - orchestrator-qt
                topologyKey: kubernetes.io/hostname

      # Restart Policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 120

---
# Service for orchestrator-qt deployment
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-qt
  namespace: quantum-trades
  labels:
    app: orchestrator-qt
spec:
  type: ClusterIP
  selector:
    app: orchestrator-qt
  ports:
    - name: http
      port: 8006
      targetPort: 8006
      protocol: TCP
    - name: metrics
      port: 8086
      targetPort: 8086
      protocol: TCP
  sessionAffinity: None

---
# ServiceAccount for pod authentication
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-qt-service-account
  namespace: quantum-trades

---
# ClusterRole for pod permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestrator-qt-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestrator-qt-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestrator-qt-role
subjects:
  - kind: ServiceAccount
    name: orchestrator-qt-service-account
    namespace: quantum-trades

---
# PVC for persistent agent memory (moved from deployment-trading-loop.yaml)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-memories-pvc
  namespace: quantum-trades
  labels:
    app: orchestrator-qt
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi-v2
  resources:
    requests:
      storage: 10Gi
