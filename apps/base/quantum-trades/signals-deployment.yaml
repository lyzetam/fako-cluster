apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-trades-signals
  labels:
    app: quantum-trades
    component: signals
spec:
  # Raised 2->6 (2026-08-04). The research loop scans the whole watchlist with
  # SCAN_CONCURRENCY=30, and each /evaluate fans out 8 CPU-bound Massive calls,
  # so per-pod concurrency is what sets scan latency. MEASURED at 2 replicas:
  #
  #   23-symbol scan  60.1s  ->  5 of 23 hit get_entry_signal's 60s timeout
  #                              and return score=0 (invisible to the loop)
  #
  # 30 concurrent requests over 2 pods is ~15 each; over 6 it is ~5, which is
  # what the 2-core limit can actually serve. This is throughput, not
  # redundancy — a timed-out symbol is a trade the system never sees.
  replicas: 6
  selector:
    matchLabels:
      app: quantum-trades
      component: signals
  template:
    metadata:
      labels:
        app: quantum-trades
        component: signals
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-02T13:46:00Z"  # symmetry audit: ATR neutral + SI bearish dampener (PR #114)
    spec:
      # Spread replicas across nodes. Without this the scheduler may stack
      # several onto one node, where they contend for the SAME cores — and CPU
      # is exactly the bottleneck being scaled out of, so co-located replicas
      # buy far less throughput than their count suggests.
      # ScheduleAnyway (not DoNotSchedule) so a busy cluster degrades to
      # co-location rather than leaving replicas Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: quantum-trades
              component: signals
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
        - name: signals
          image: lzetam/quantum-trades-signals:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              protocol: TCP
          env:
            - name: MASSIVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: MASSIVE_API_KEY
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: OLLAMA_API_KEY
            - name: OLLAMA_BASE_URL
              value: "https://ollama.com"
            - name: OLLAMA_MODEL
              value: "glm-5.2"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: OPENAI_API_KEY
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantum-trades-secrets
                  key: GOOGLE_API_KEY
            - name: LLM_PROVIDER_ORDER
              value: "ollama"
            - name: LLM_FALLBACK_ENABLED
              value: "true"
            - name: LLM_FALLBACK_CACHE_TTL_SECONDS
              value: "300"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              # Lowered 1Gi->512Mi (2026-08-04). Measured steady-state usage is
              # ~250Mi, so 1Gi reserved 4x what the pod uses — at 6 replicas
              # that would book 6Gi of scheduling room to hold ~1.5Gi and crowd
              # out neighbours for no benefit. Limit stays 2Gi for headroom.
              memory: "512Mi"
              # Raised 50m->500m so the scheduler actually reserves capacity for
              # the burst below, instead of best-efforting it against neighbours.
              cpu: "500m"
            limits:
              memory: "2Gi"
              # Raised 500m->2 (2026-08-04). MEASURED during a real 10-symbol
              # concurrent scan inside the pod:
              #
              #   10 concurrent /api/signals/evaluate   9.50s wall
              #   THROTTLED                             5.35s of 9.50s = 56%
              #   cpu used                              3.29s of 4.75s available
              #
              # The service was CPU-starved for more than half of every scan.
              # Each evaluate fires 8 concurrent Massive calls via
              # asyncio.to_thread (TLS handshake + JSON parse = CPU-bound), and
              # the research loop scans the whole watchlist at once.
              #
              # Compounding it: os.cpu_count() reports the NODE's 28 cores, not
              # the cgroup's 0.5, so asyncio's default executor sizes itself to
              # 32 threads and oversubscribes half a core ~64x — the threads
              # then thrash on context switches instead of doing work.
              #
              # Consequence was not slowness but a TRADING OUTAGE: scans
              # exceeded get_entry_signal's 60s client timeout, which returns
              # score=0, so every watchlist name read NO_SIGNAL and no entry
              # could fire (observed live 2026-08-04).
              cpu: "2"
      volumes:
        - name: config
          configMap:
            name: orchestrator-qt-config
            items:
              - key: llm_fallback_config.json
                path: llm_fallback_config.json
      restartPolicy: Always
