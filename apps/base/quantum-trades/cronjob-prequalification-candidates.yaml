# Pre-Qualification — PREMARKET candidate stages (funnel stages 1-4).
#
# Publishes the day's watchlist + `universe_meta.session_date=today` BEFORE the
# open, so the trading loop's freshness gate (universe_is_stale) is already
# False at 09:30 and new entries are never blocked waiting for a funnel run.
#
# WHY THIS CAN RUN PREMARKET, WHERE THE OLD 08:00 JOB COULD NOT
# The original single-shot funnel was moved 08:00->10:00 on 2026-07-15 because
# stage 5 (option liquidity) needs LIVE bid/ask: premarket the spread gate
# rejects every contract, survivors fall under the floor, and the run aborts —
# it failed 3 days running. Stages 1-4 have no such dependency. They read daily
# and historical data that is final at yesterday's close (probed premarket
# 2026-08-03: 6/6 symbols returned valid scores with the market shut).
#
# So this job runs ONLY stages 1-4. Stage 5 runs separately at 09:40 once
# quotes are real (cronjob-prequalification-prune.yaml).
#
# MEASURED EXPOSURE THIS FIXES (2026-08-04, 05:45 ET): session_date was still
# 2026-08-03 while the only job refreshing it runs at 10:00 — every new entry
# blocked from 09:30 until it finished, ~53 min of the session.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prequalification-candidates
  namespace: quantum-trades
  labels:
    app.kubernetes.io/name: prequalification-candidates
    app.kubernetes.io/part-of: quantum-trades
    app.kubernetes.io/managed-by: flux
spec:
  # 08:00 ET weekdays — 90 minutes before the open. Stages 1-4 run in well under
  # that (the whole 5-stage funnel measured ~23 min after the 2026-08-03 latency
  # work, and this is the cheaper half), leaving room for backoffLimit retries
  # to still finish before 09:30.
  schedule: "0 8 * * 1-5"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      # Retries are cheap and valuable here: a failed premarket run still has
      # time to succeed before the open. This is the property that makes the
      # split safe — at 55 min the old job was a single unretryable shot.
      backoffLimit: 2
      # K8s backstop above the per-attempt app timeout so the app timeout trips
      # first. Sized so all attempts finish before 09:30.
      activeDeadlineSeconds: 4200
      template:
        spec:
          # Never (not OnFailure) so each retry is a SEPARATE pod RETAINED on
          # failure — OnFailure restarts in place and the failed pod is GC'd
          # before its logs can be read, which is exactly how the 2026-07-13/14/15
          # premarket crashes stayed undiagnosed for three days.
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-registry
          containers:
            - name: prequalification-candidates
              image: lzetam/quantum-trades-orchestrator-qt:latest
              imagePullPolicy: Always
              command: ["python", "-m", "prequalification", "--stage", "candidates"]
              envFrom:
                - secretRef:
                    name: orchestrator-qt-secrets
              env:
                - name: MASSIVE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: quantum-trades-secrets
                      key: MASSIVE_API_KEY
                - name: SIGNALS_SERVICE_URL
                  value: "http://signals-service:8002"
                - name: PYTHONUNBUFFERED
                  value: "1"
                # Lower than the full funnel's 7200: this half has no option-chain
                # work, and anything still running at 09:30 has missed its purpose.
                - name: PREQUAL_RUN_TIMEOUT_SECONDS
                  value: "3600"
                # Soft alert threshold, not a hard abort. Applies to the PRE-stage-5
                # narrow list, which is historically ~250 names — far above this.
                - name: PREQUAL_MIN_UNIVERSE
                  value: "10"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
