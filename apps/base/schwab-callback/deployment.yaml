apiVersion: apps/v1
kind: Deployment
metadata:
  name: schwab-callback
  namespace: schwab-callback
  labels:
    app.kubernetes.io/name: schwab-callback
    app.kubernetes.io/component: oauth-callback
    app.kubernetes.io/part-of: trading
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schwab-callback
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schwab-callback
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Static page only. It never sees a client secret and never calls Schwab —
          # the browser lands here with ?code=..., the page renders it, the CLI exchanges it.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /tmp
      volumes:
        - name: html
          configMap:
            name: schwab-callback-html
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
