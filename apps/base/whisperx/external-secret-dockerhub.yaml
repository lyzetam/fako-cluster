# Materializes a dockerhub-registry imagePullSecret from AWS Secrets Manager.
# Pattern matches apps/base/langfuse/external-secret-dockerhub.yaml.
#
# Why: deployment-api.yaml pulls lzetam/whisperx:latest, which is a PRIVATE
# repository (confirmed 2026-08-12 against the Docker Hub API; last pushed
# 2026-01-07). It already declared `imagePullSecrets: dockerhub-registry`, but
# the whisperx kustomization never created that secret — so re-enabling the
# workload landed straight in ImagePullBackOff with
# "pull access denied, repository does not exist or may require authorization".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-registry
  namespace: whisperx
spec:
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: dockerhub-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: dockerhub/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: dockerhub/credentials
        property: token
  refreshInterval: 1h
