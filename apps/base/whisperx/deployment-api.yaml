apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisperx-api
  namespace: whisperx
  labels:
    app: whisperx-api
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU workloads need exclusive access
  selector:
    matchLabels:
      app: whisperx-api
  template:
    metadata:
      labels:
        app: whisperx-api
    spec:
      runtimeClassName: nvidia
      hostIPC: true
      # Follow the GPU, not a hostname. aitower left the cluster 2026-08-11; pinning
      # to a dead host is what stranded this workload. thinkpad02 carries the GPU now.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      imagePullSecrets:
      - name: dockerhub-registry
      containers:
      - name: whisperx-api
        image: lzetam/whisperx:latest
        args: ["api"]
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: WHISPER_MODEL
          value: "distil-large-v3"
        # int8, NOT float16. Measured on thinkpad02's GTX 1650 (TU117, CC 7.5) on
        # 2026-08-12: float16 returned "!!!!!!!!..." with language "pa" — the NaN-logit
        # signature. TU117 is the one Turing die without tensor cores, and CTranslate2
        # fp16 misbehaves there. int8 also cuts the model to well under the 4GB VRAM.
        # aitower's dual GPUs did have tensor cores, which is why this was fine before.
        - name: COMPUTE_TYPE
          value: "int8"
        - name: BATCH_SIZE
          value: "4"
        - name: DEVICE
          value: "cuda"
        - name: PRELOAD_MODEL
          value: "false"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-token
              key: token
        - name: HF_HOME
          value: "/app/models"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "12Gi"
          requests:
            memory: "2Gi"
            cpu: "500m"
        volumeMounts:
        - name: models-cache
          mountPath: /app/models
        - name: data
          mountPath: /app/data
        - name: output
          mountPath: /app/output
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: models-cache
        persistentVolumeClaim:
          claimName: whisperx-models
      - name: data
        persistentVolumeClaim:
          claimName: whisperx-data
      - name: output
        persistentVolumeClaim:
          claimName: whisperx-output
