apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisperx-api
  namespace: whisperx
  labels:
    app: whisperx-api
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU workloads need exclusive access
  selector:
    matchLabels:
      app: whisperx-api
  template:
    metadata:
      labels:
        app: whisperx-api
    spec:
      runtimeClassName: nvidia
      hostIPC: true
      # Follow the GPU, not a hostname. aitower left the cluster 2026-08-11; pinning
      # to a dead host is what stranded this workload. thinkpad02 carries the GPU now.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      imagePullSecrets:
      - name: dockerhub-registry
      containers:
      - name: whisperx-api
        image: lzetam/whisperx:latest
        args: ["api"]
        ports:
        - containerPort: 8000
          name: http
        env:
        # Sized for thinkpad02's GTX 1650 (TU117, CC 7.5, 4GB). aitower had dual
        # tensor-core GPUs, so the old distil-large-v3 + float16 config was fine there
        # and is NOT fine here. Measured 2026-08-12 with a real 5s transcription:
        #
        #   distil-large-v3 + float16  -> "!!!!!!!!..." , language "pa"  (NaN logits;
        #                                 TU117 is the one Turing die with no tensor cores)
        #   distil-large-v3 + int8     -> loads (1152 MiB) but hallucinates; distil-whisper
        #                                 is notoriously quantization-sensitive
        #   distil-large-v3 + float32  -> CUDA out of memory at 3612/4096 MiB (~3GB of
        #                                 fp32 weights alone)
        #
        # So: a smaller model at full precision, rather than a cheaper precision on a
        # big model. distil-medium.en is ~1.6GB in fp32 and English-only, which matches
        # what voice-ingest feeds it (Landry's wearable voice notes).
        - name: WHISPER_MODEL
          value: "distil-medium.en"
        - name: COMPUTE_TYPE
          value: "float32"
        - name: BATCH_SIZE
          value: "4"
        - name: DEVICE
          value: "cuda"
        - name: PRELOAD_MODEL
          value: "false"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-token
              key: token
        - name: HF_HOME
          value: "/app/models"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "12Gi"
          requests:
            memory: "2Gi"
            cpu: "500m"
        volumeMounts:
        - name: models-cache
          mountPath: /app/models
        - name: data
          mountPath: /app/data
        - name: output
          mountPath: /app/output
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: models-cache
        persistentVolumeClaim:
          claimName: whisperx-models
      - name: data
        persistentVolumeClaim:
          claimName: whisperx-data
      - name: output
        persistentVolumeClaim:
          claimName: whisperx-output
