# Every credential the agent needs, as env vars. Names match lzt-lead-agent's Settings.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lzt-lead-agent-secrets
  namespace: lzt-lead-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: lzt-lead-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: AGENTMAIL_API_KEY
      remoteRef:
        key: agentmail/api-key
    # discord/webhook.leads — recreated 2026-09-14 (the previous one had been deleted
    # in Discord and returned 404 "Unknown Webhook").
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: discord/webhook
        property: leads
    # APISIX key-auth for the in-cluster gateway in front of the Mac fleet.
    - secretKey: APISIX_KEY
      remoteRef:
        key: social-media-content/apisix-gateway-key
        property: api_key
    # Ollama Cloud — the fallback when the fleet is wedged.
    - secretKey: OLLAMA_CLOUD_API_KEY
      remoteRef:
        key: /fako/openwebui/ollama-cloud-api-key
        property: api_key
