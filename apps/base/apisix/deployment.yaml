apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: apisix
  labels:
    app.kubernetes.io/name: apisix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apisix
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: apisix
        app.kubernetes.io/name: apisix
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/apisix/prometheus/metrics"
        # Rollout trigger: subPath ConfigMap mounts do not hot-reload. This
        # checksum must be updated whenever apps/base/apisix/configmap.yaml
        # changes so Flux recreates the pods with the new APISIX config.
        # Compute: sha256sum apps/base/apisix/configmap.yaml
        checksum/config: "64e72e69c7fcf2bff813421f12b8977367db093912bf8f887b25c544e4969241"
    spec:
      containers:
        - name: apisix
          image: apache/apisix:3.18.0-debian
          imagePullPolicy: IfNotPresent
          env:
            # Ollama Cloud bearer for the fallback tier — the config references it
            # via ${{OLLAMA_CLOUD_AUTH}} (APISIX interpolates env at load).
            - name: OLLAMA_CLOUD_AUTH
              valueFrom:
                secretKeyRef:
                  name: apisix-provider-keys
                  key: OLLAMA_CLOUD_AUTH
            # Consumer keys for key-auth. Referenced as ${{VAR}} in apisix.yaml;
            # the ConfigMap is plaintext in git so the values can only come from
            # the SOPS secret via the environment.
            - name: APISIX_KEY_SOCIAL
              valueFrom:
                secretKeyRef:
                  name: apisix-provider-keys
                  key: APISIX_KEY_SOCIAL
            - name: APISIX_KEY_CLUSTER
              valueFrom:
                secretKeyRef:
                  name: apisix-provider-keys
                  key: APISIX_KEY_CLUSTER
          ports:
            - name: proxy
              containerPort: 9080
            - name: metrics
              containerPort: 9091
          readinessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: conf
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: conf
              mountPath: /usr/local/apisix/conf/apisix.yaml
              subPath: apisix.yaml
      volumes:
        - name: conf
          configMap:
            name: apisix-conf
