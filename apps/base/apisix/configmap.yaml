# APISIX AI gateway — standalone (no etcd), declarative config. LLM front door
# for the Mac Studio Ollama fleet.
#
# Routing is now model-aware: gpt-oss:20b is pinned to ms3 because ms1/ms2
# cannot fit it alongside glm-4.7-flash. least_conn spreads load by active
# connections and an api-breaker adds a coarse circuit breaker on top of the
# upstream health checks.
#
# NOTE: config changes need a `kubectl rollout restart deployment/apisix -n apisix`
# (subPath ConfigMap mounts don't hot-reload). That's a rollout trigger, allowed.
#
# NOTE: Converting an empty-body 200 from /api/chat into a 503 for passive health
# checks cannot be done reliably with built-in plugins: nginx has already sent
# response headers by the time the body is available in body_filter. A custom
# subrequest-based plugin (or an Ollama-side fix) is required for that follow-up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-conf
  namespace: apisix
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      enable_admin: false
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
    plugin_attr:
      prometheus:
        export_addr:
          ip: 0.0.0.0
          port: 9091
    nginx_config:
      http:
        # Add model/routing visibility to the access log so we can confirm
        # gpt-oss:20b traffic lands on ms3 and see upstream failures quickly.
        access_log_format: "$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent $request_time \"$http_referer\" \"$http_user_agent\" $upstream_addr $upstream_status $upstream_response_time \"$upstream_scheme://$upstream_host$upstream_uri\" \"$http_x_ollama_model\""
        access_log_format_escape: default
  apisix.yaml: |
    upstreams:
      # Load-balance native Ollama traffic (/api/chat, /api/generate, /api/embed)
      # by least active connections. With OLLAMA_NUM_PARALLEL=1 a busy node holds
      # its slot for minutes; least_conn steers new requests toward idle nodes
      # instead of round-robin piling onto the same busy one.
      - id: ollama-fleet
        type: least_conn
        retries: 2
        timeout:
          connect: 5
          send: 600
          read: 600
        nodes:
          "ms1.landryzetam.net:11434": 1
          "ms2.landryzetam.net:11434": 1
          "ms3.landryzetam.net:11434": 1
        # Deliberately patient. A node that is merely BUSY must not be ejected:
        # with NUM_PARALLEL=1 a large prompt occupies the slot for minutes and
        # even /api/version can be slow to answer. The first cut (5s timeout,
        # 2 failures) ejected ms2 for 10s during a normal load spike and handed
        # 20 requests a 502. Now it takes ~45s of sustained failure to eject.
        # The on-node watchdog clears a genuine wedge in ~2min, so there is no
        # value in the gateway being twitchier than that.
        checks:
          active:
            type: http
            http_path: /api/version
            timeout: 15
            healthy:
              interval: 10
              successes: 1
            unhealthy:
              interval: 15
              http_failures: 3
              timeouts: 3
          passive:
            healthy:
              http_statuses: [200, 201]
              successes: 1
            unhealthy:
              http_statuses: [500, 502, 503, 504]
              http_failures: 2
              timeouts: 2

      # Dedicated upstream for gpt-oss:20b. As of 2026-08 ms1/ms2 each have
      # ~30-40 GB loaded with glm-4.7-flash and cannot also load the ~14 GB
      # gpt-oss:20b in the remaining ~37 GB VRAM. ms3 can. This upstream is
      # selected by the traffic-split plugin on the ollama-native route.
      - id: ollama-gptoss
        type: least_conn
        retries: 2
        timeout:
          connect: 5
          send: 600
          read: 600
        nodes:
          "ms3.landryzetam.net:11434": 1
        checks:
          active:
            type: http
            http_path: /api/version
            timeout: 15
            healthy:
              interval: 10
              successes: 1
            unhealthy:
              interval: 15
              http_failures: 3
              timeouts: 3
          passive:
            healthy:
              http_statuses: [200, 201]
              successes: 1
            unhealthy:
              http_statuses: [500, 502, 503, 504]
              http_failures: 2
              timeouts: 2

    consumers:
      # key-auth is the standard API-key mechanism in APISIX: the consumer
      # presents `apikey: <key>` and the gateway resolves it to a named
      # identity BEFORE proxying. Named consumers are what make per-client
      # rate limits and per-client metrics possible — an anonymous shared
      # bearer gives you neither, and revoking one client means rotating for
      # everyone.
      #
      # Keys come from the SOPS secret via $ENV, never inline: this ConfigMap
      # is plaintext in git.
      - username: social_media_content
        plugins:
          key-auth:
            key: "${{APISIX_KEY_SOCIAL}}"
          limit-count:
            # A runaway agent loop must not saturate a three-node fleet that
            # serves every other project. 600/hour is ~10x a normal pipeline
            # day (3 orchestrator runs at tens of calls each) and still bounded.
            count: 600
            time_window: 3600
            rejected_code: 429
            policy: local
      - username: katikaa_predict_agent
        plugins:
          key-auth:
            key: "${{APISIX_KEY_KATIKAA}}"
          limit-count:
            # The agent's whole job is one call per unpredicted fixture, once a
            # day. A full weekend card across five leagues is ~45, and a retry
            # storm is the only way that becomes hundreds — so 300/hour leaves
            # generous headroom while still bounding a loop. It had been running
            # on Ollama Cloud instead and exhausted a weekly quota; a named
            # consumer means that failure is visible and revocable here.
            count: 300
            time_window: 3600
            rejected_code: 429
            policy: local
      - username: cluster_internal
        plugins:
          key-auth:
            key: "${{APISIX_KEY_CLUSTER}}"

    routes:
      # Ollama-native front door. Everything that currently dials a Mac directly
      # points here instead, so no workload is pinned to one node.
      - id: ollama-native
        uri: /api/*
        upstream_id: ollama-fleet
        plugins:
          prometheus: {}
          # Was unauthenticated because it was only reachable in-cluster. Once
          # this is exposed through the tunnel that is no longer true, and an
          # open /api/* is free inference on the Mac fleet for anyone who finds
          # the hostname.
          key-auth: {}
          # Extract the model from the JSON body (e.g. /api/chat) so the
          # traffic-split plugin below can route gpt-oss:20b to the only node
          # that can load it. The header is also logged in the access log.
          serverless-pre-function:
            phase: rewrite
            functions:
              - |-
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local method = core.request.get_method(ctx)
                  if method ~= "POST" and method ~= "PUT" then
                    return
                  end
                  local body = core.request.get_body(nil, ctx)
                  if not body or body == "" then
                    return
                  end
                  local ok, data = pcall(core.json.decode, body)
                  if not ok or type(data) ~= "table" then
                    return
                  end
                  local model = data.model
                  if model and type(model) == "string" then
                    core.request.set_header(ctx, "X-Ollama-Model", model)
                    core.log.info("ollama model detected: ", model)
                  end
                end
          # Pin gpt-oss:20b to ms3. Non-matching requests fall through to the
          # route's default upstream (ollama-fleet).
          traffic-split:
            rules:
              - match:
                  - vars:
                      - ["http_x_ollama_model", "==", "gpt-oss:20b"]
                weighted_upstreams:
                  - upstream_id: ollama-gptoss
                    weight: 1
          # Coarse circuit breaker. Only trips after sustained 5xx/502-504
          # failures; healthy again after two consecutive good responses.
          api-breaker:
            break_response_code: 503
            max_breaker_sec: 60
            unhealthy:
              http_statuses: [500, 502, 503, 504]
              failures: 5
            healthy:
              http_statuses: [200, 201]
              successes: 2

      # OpenAI-shape passthrough that PRESERVES the caller's model. The
      # llm-chat route below runs ai-proxy-multi, which overrides the model
      # per instance (glm-4.7-flash local, glm-5.2 cloud) — correct for a
      # caller that just wants "a model", wrong for one that has measured a
      # specific model and needs that one. Ollama already serves the OpenAI
      # shape at /v1 on every node, so this is a plain proxy to the fleet:
      # same least_conn, same health checks, no model rewriting.
      - id: ollama-openai-passthrough
        uri: /local/v1/*
        upstream_id: ollama-fleet
        plugins:
          prometheus: {}
          key-auth: {}
          proxy-rewrite:
            regex_uri: ["^/local(/v1/.*)$", "$1"]
          api-breaker:
            break_response_code: 503
            max_breaker_sec: 60
            unhealthy:
              http_statuses: [500, 502, 503, 504]
              failures: 5
            healthy:
              http_statuses: [200, 201]
              successes: 2

      - id: llm-chat
        uri: /v1/chat/completions
        plugins:
          prometheus: {}
          key-auth: {}
          ai-proxy-multi:
            balancer:
              algorithm: roundrobin
            fallback_strategy:
              - http_5xx
              - http_429
            # Under Cloudflare's ~100s origin limit, deliberately. At 180000 a
            # slow local node produced a 524 at ~125s — Cloudflare killed the
            # request before APISIX gave up, so the Ollama Cloud tier below was
            # never reached and the caller got an HTML error page instead of a
            # completion. A tier that only engages after the proxy has already
            # been cut off is not a fallback.
            timeout: 60000
            instances:
              - name: ms1
                provider: openai-compatible
                weight: 1
                priority: 100
                auth:
                  header:
                    Authorization: "Bearer ollama"
                options:
                  model: glm-4.7-flash
                override:
                  endpoint: "http://ms1.landryzetam.net:11434/v1/chat/completions"
              - name: ms2
                provider: openai-compatible
                weight: 1
                priority: 100
                auth:
                  header:
                    Authorization: "Bearer ollama"
                options:
                  model: glm-4.7-flash
                override:
                  endpoint: "http://ms2.landryzetam.net:11434/v1/chat/completions"
              - name: ms3
                provider: openai-compatible
                weight: 1
                priority: 100
                auth:
                  header:
                    Authorization: "Bearer ollama"
                options:
                  model: glm-4.7-flash
                override:
                  endpoint: "http://ms3.landryzetam.net:11434/v1/chat/completions"
              # Tier 2: Ollama Cloud — only used when all 3 local nodes fail
              # (lower priority). Bearer key injected from the SOPS secret.
              - name: ollama-cloud
                provider: openai-compatible
                weight: 1
                priority: 50
                auth:
                  header:
                    Authorization: "${{OLLAMA_CLOUD_AUTH}}"
                options:
                  # Cloud model (APISIX overrides the client's model per-instance).
                  # glm-4.x retired on Ollama Cloud 2026-07-15; glm-5.2 is current.
                  model: glm-5.2
                override:
                  endpoint: "https://ollama.com/v1/chat/completions"
    #END
