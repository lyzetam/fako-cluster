apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-content-studio-library-secrets
  namespace: ai-content-studio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: ai-content-studio-library-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: ai-content-studio/api
        property: api_key
    # These are the same read/write credentials used by the processor. The
    # application only lists/reads source videos and adjacent sidecars.
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: unas-backup/credentials
        property: aws_access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: unas-backup/credentials
        property: aws_secret_access_key
    - secretKey: S3_BUCKET
      remoteRef:
        key: unas-backup/credentials
        property: s3_bucket
    - secretKey: AWS_REGION
      remoteRef:
        key: unas-backup/credentials
        property: aws_region
    # Read-only use of the recovered analysis sidecars on the UNAS. The public
    # endpoint is used on purpose: the namespace egress policy allows 443 to
    # public IPs only, and presigned URLs must be minted against it anyway.
    - secretKey: ANALYSIS_S3_ACCESS_KEY_ID
      remoteRef:
        key: social-media/s3-credentials
        property: S3_ACCESS_KEY
    - secretKey: ANALYSIS_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: social-media/s3-credentials
        property: S3_SECRET_KEY
    - secretKey: ANALYSIS_S3_BUCKET
      remoteRef:
        key: social-media/s3-credentials
        property: S3_BUCKET
    - secretKey: ANALYSIS_S3_ENDPOINT_URL
      remoteRef:
        key: social-media/s3-credentials
        property: S3_PUBLIC_ENDPOINT
    - secretKey: TWELVELABS_API_KEY
      remoteRef:
        key: twelvelabs/api-key
        property: api_key
    # Reuse the existing Supabase login configuration from the uploader.
    - secretKey: SUPABASE_URL
      remoteRef:
        key: ig-inbox-uploader/config
        property: SUPABASE_URL
    - secretKey: SUPABASE_ANON_KEY
      remoteRef:
        key: ig-inbox-uploader/config
        property: SUPABASE_ANON_KEY
    - secretKey: ALLOWED_EMAILS
      remoteRef:
        key: ig-inbox-uploader/config
        property: ALLOWED_EMAILS
