apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-content-studio
  namespace: ai-content-studio
  labels:
    app.kubernetes.io/name: ai-content-studio
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ai-content-studio
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-content-studio
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: ai-content-studio
      app.kubernetes.io/managed-by: kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-content-studio
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ai-content-studio
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: ai-content-studio
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: dockerhub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with the exact sha-$GITHUB_SHA tag produced by the
          # ai-content-studio GitHub Actions workflow before enabling staging.
          image: lzetam/ai-content-studio:sha-ce933cfa9328b60a1092ff91d0ab52104cd7c3fd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-content-studio-config
            - secretRef:
                name: ai-content-studio-library-secrets
          # The SigLIP text tower for /api/v1/library/moments is loaded lazily
          # on first search; the process sits at ~1.2 GB RSS afterwards.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
