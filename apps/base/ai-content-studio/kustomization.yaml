apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-content-studio
resources:
  - namespace.yaml
  - secret-store.yaml
  - external-secret-dockerhub.yaml
  - external-secret.yaml
  - configmap.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  # The dashboard is reachable only through the shared Cloudflare tunnel.
  # Do not re-add a direct Traefik Ingress without also changing the access model.
