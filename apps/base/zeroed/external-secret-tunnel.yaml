# cloudflared credentials for the "zeroed" tunnel (id a242db2e-cb7c-4212-a0a4-2bae79b8a1c8).
# Held in AWS SM (social-media pattern) so rotation is one AWS write, no commit.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnel-credentials
  namespace: zeroed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: tunnel-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: "{{ .credentials_json }}"
  data:
    - secretKey: credentials_json
      remoteRef:
        key: zeroed/cloudflare-tunnel
        property: credentials.json
