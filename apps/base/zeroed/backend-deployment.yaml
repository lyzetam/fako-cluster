apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeroed-backend
  labels:
    app: zeroed
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeroed
      component: backend
  template:
    metadata:
      labels:
        app: zeroed
        component: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: lzetam/zeroed-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: zeroed-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: zeroed-secrets
                  key: SUPABASE_SERVICE_KEY
            - name: METHOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zeroed-secrets
                  key: METHOD_API_KEY
            - name: METHOD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: zeroed-method-webhook-secret
                  key: METHOD_WEBHOOK_SECRET
                  optional: true
            - name: METHOD_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: zeroed-config
                  key: METHOD_ENVIRONMENT
            - name: CORS_ORIGINS_STR
              valueFrom:
                configMapKeyRef:
                  name: zeroed-config
                  key: CORS_ORIGINS_STR
            - name: PLAID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: zeroed-plaid-secrets
                  key: PLAID_CLIENT_ID
                  optional: true
            - name: PLAID_SECRET_SANDBOX
              valueFrom:
                secretKeyRef:
                  name: zeroed-plaid-secrets
                  key: PLAID_SECRET_SANDBOX
                  optional: true
            - name: PLAID_SECRET_PRODUCTION
              valueFrom:
                secretKeyRef:
                  name: zeroed-plaid-secrets
                  key: PLAID_SECRET_PRODUCTION
                  optional: true
            - name: PLAID_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: zeroed-plaid-secrets
                  key: PLAID_TOKEN_ENCRYPTION_KEY
                  optional: true
            - name: PLAID_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: zeroed-config
                  key: PLAID_ENVIRONMENT
            - name: PLAID_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: zeroed-config
                  key: PLAID_WEBHOOK_URL
            - name: PLAID_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: zeroed-config
                  key: PLAID_REDIRECT_URI
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      restartPolicy: Always
