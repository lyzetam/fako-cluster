apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape-operator
  namespace: kubescape
spec:
  interval: 30m
  # node-agent DaemonSet rolls one pod at a time and pulls a new image across 5
  # heterogeneous nodes (incl. slow 8GB pgmac01); Helm's default 5m wait times
  # out on image-tag bumps and stalls the release. Give the rollout headroom.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kubescape-operator
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: kubescape
  values:
    # Enable continuous scanning for real-time monitoring
    capabilities:
      continuousScan: enable
      networkPolicyService: enable
      # Expose vulnerability/compliance counts as Prometheus metrics (server-side
      # aggregation — avoids the storage API's spec-stripping on LIST queries that
      # makes ad-hoc `kubectl get -A` reads look like "0 CVEs"). Feeds Grafana +
      # alerting so the real posture is always visible. See kubescape-vuln-query-gotcha.
      prometheusExporter: enable
      
    # Enable the aggregated APIServer that backs the storage CRDs.
    storage:
      enabled: true

    # Persistent volumes for scan results and the vulnerability DB.
    #
    # These MUST live under `persistence:` — the chart has no `storage.storageClass`,
    # `storage.size` or top-level `vulnerabilityDB` key, so the previous config here
    # was silently ignored and both PVCs fell through to the cluster default
    # (local-path). local-path landed the storage PVC on aitower; when that node
    # died the PVC went unschedulable, the storage Service lost its endpoints, and
    # the aggregated APIService v1beta1.spdx.softwarecomposition.kubescape.io went
    # Available=False — which made resource discovery fail and blocked namespace
    # deletion cluster-wide. Node-local storage under an aggregated APIServer is a
    # cluster-wide single point of failure; keep these on NFS.
    # NOTE: nfs-csi-v2, not nfs-security-logs. The security-logs class points at
    # 10.85.30.127:/volume1/k8s-storage/security-logs, which does not exist on the
    # NAS -- provisioning fails with "No such file or directory" and no PVC in the
    # cluster has ever bound to it. Create that directory under the k8s-storage
    # share and this can move back.
    persistence:
      storageClass: nfs-csi-v2
      accessMode: ReadWriteOnce
      size:
        backingStorage: 20Gi
        kubevuln: 10Gi


    # Configure the Kubescape cloud component (optional - for cloud dashboard)
    kubescapeCloud:
      enabled: false  # Set to true if you have a Kubescape cloud account
      
    # Configure scanning intervals
    scanSchedule:
      frameworks:
        - name: "nsa"
          cronTabSchedule: "0 */6 * * *"  # Every 6 hours
        - name: "mitre"
          cronTabSchedule: "0 */6 * * *"
        - name: "cis-v1.23-t1.0.1"
          cronTabSchedule: "0 2 * * *"    # Daily at 2 AM
          
    # Network policy configuration
    networkPolicy:
      enabled: true
      scanInterval: 15m
      
    # Resource requests and limits
    operator:
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
          ephemeral-storage: "1Gi"
        limits:
          memory: "512Mi"
          cpu: "500m"
          ephemeral-storage: "2Gi"
          
    kubevuln:
      resources:
        requests:
          memory: "512Mi"
          cpu: "100m"
          ephemeral-storage: "5Gi"
        limits:
          memory: "2Gi"
          cpu: "1"
          ephemeral-storage: "15Gi"  # Significantly increased to prevent eviction
          
    gateway:
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
          ephemeral-storage: "1Gi"
        limits:
          memory: "512Mi"
          cpu: "300m"
          ephemeral-storage: "2Gi"
          
    # Enable prometheus metrics
    prometheus:
      enabled: true
      
    # Node agent configuration
    nodeAgent:
      # Pin past chart baseline v0.3.119 (buggy): fixes inspektor-gadget pubsub
      # "concurrent map writes" data-race panic on high-churn nodes (e.g. aitower).
      # Upstream: kubescape/node-agent#825, fixed in #826 (>= v0.3.128).
      # Remove this override once the chart's default tag advances past the fix.
      image:
        tag: v0.3.147
      # Only deploy on x86_64 nodes (BTF support required, not available on ARM/Jetson)
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64  # Only run on x86_64 nodes, exclude ARM64/Jetson
      # Additional node affinity rules
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64  # Ensure only x86_64 architecture
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - zz-macbookpro  # Exclude macOS node
