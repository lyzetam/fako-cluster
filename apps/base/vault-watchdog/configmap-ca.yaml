apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ca
  namespace: vault-watchdog
data:
  # Pinned TLS certificate for obsidian-api.landryzetam.net:27124.
  #
  # This exists so the watchdog can verify TLS PROPERLY rather than disabling
  # verification the way every other vault consumer currently does.
  #
  # The repo-wide OBSIDIAN_VERIFY_TLS=false workaround, and CLAUDE.md's note
  # that the cert "won't validate against any network hostname/IP (SAN:
  # IP:127.0.0.1 only)", both describe the OLD Obsidian Local REST API plugin
  # certificate. That is no longer what serves this endpoint.
  #
  # The service was replaced by the self-hosted obsidian-vault-api (it reports
  # service=obsidian-vault-api) and reissued its certificate on 2026-08-05 —
  # the same day the host address moved to .229. The current cert is
  # CN=obsidian-api.landryzetam.net with SANs DNS:obsidian-api.landryzetam.net,
  # DNS:mm1, DNS:localhost, IP:10.85.10.229, IP:127.0.0.1, CA:TRUE, valid until
  # 2031-08-04.
  #
  # Verified 2026-08-18: a full chain + hostname verification against the live
  # endpoint using this file SUCCEEDS. Disabling verification is no longer
  # necessary for any consumer.
  #
  # Expires 2031-08-04. apps/base/oura-collector/configmap-obsidian-ca.yaml
  # still holds the retired plugin cert and should be retired with it.
