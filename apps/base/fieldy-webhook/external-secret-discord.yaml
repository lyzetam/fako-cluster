apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fieldy-discord-secret
  namespace: fieldy-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: fieldy-discord
    creationPolicy: Owner
  data:
    # discord/webhook holds one webhook URL per channel; sre_alerts is #sre-alerts.
    - secretKey: sre_alerts_webhook
      remoteRef:
        key: discord/webhook
        property: sre_alerts
