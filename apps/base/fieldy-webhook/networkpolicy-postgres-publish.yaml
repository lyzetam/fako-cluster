# fieldy-postgres-publish Job: needs DNS, the Obsidian REST API on the LAN
# (to read conversations/transcripts back out of the vault), and the shared
# CloudNativePG Postgres cluster (to write recordings/transcript_segments).
# No api.fieldy.ai egress — this job never calls the Fieldy API, it only
# reads what daily.py/backfill.py already pulled into the vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fieldy-postgres-publish
  namespace: fieldy-webhook
spec:
  podSelector:
    matchLabels:
      app: fieldy-postgres-publish
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Obsidian vault, via the gateway. No CIDR here: the gateway is the only
    # workload that knows the vault's address, so a DHCP move edits one file
    # instead of eleven — this rule was pinned to a single-host /32, the host
    # moved to a new address on 2026-08-05, and writes failed for a week because DNS
    # still resolved and only the TCP connect was dropped, which reads like a
    # remote outage rather than a policy denial.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault-gateway
          podSelector:
            matchLabels:
              app: vault-gateway
      ports:
        - protocol: TCP
          port: 8080
    # PostgreSQL (in-cluster, the shared CloudNativePG cluster — same rule
    # plaud-collector's networkpolicy.yaml uses for the same service).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - protocol: TCP
          port: 5432
