apiVersion: batch/v1
kind: CronJob
metadata:
  name: fieldy-healthcheck
  namespace: fieldy-webhook
  labels:
    app: fieldy-healthcheck
spec:
  # 18:00 UTC — two hours after the puller (16:00) and ninety minutes after
  # enrich starts (16:30), so a slow-but-working run is never mistaken for a
  # dead one.
  #
  # This exists because CronJob status has misreported this system three
  # times: writes dropped for 7 days with no failed job at all, a puller
  # happily running two-month-old code, and an enrich job exiting 0 in 3m24s
  # having written nothing. Data landing in the vault is the one signal none
  # of those could fake.
  schedule: "0 18 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # 0, not 1: a retry would post a duplicate alert to #sre-alerts.
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: fieldy-healthcheck
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-secret
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: healthcheck
              image: lzetam/fieldy-webhook:v0.20.0
              command:
                - python
                - /app/scripts/healthcheck.py
              env:
                - name: FIELDY_VAULT_MODE
                  value: "obsidian-api"
                # MIGRATED 2026-08-18: via vault-gateway, not the LAN host.
                - name: OBSIDIAN_API_URL
                  value: "http://vault-gateway.vault-gateway.svc.cluster.local:8080"
                - name: OBSIDIAN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-api
                      key: api_key
                - name: FIELDY_VAULT_REL_ROOT
                  value: "fieldy"
                - name: FIELDY_HEALTH_AREAS
                  value: "conversations,transcriptions"
                # 2 days, not 1: Fieldy genuinely returned zero conversations
                # for 2026-08-07, so a single quiet day must not page anyone.
                # The 2026-08-05 outage reached 7 days before it was noticed.
                - name: FIELDY_STALE_AFTER_DAYS
                  value: "2"
                - name: FIELDY_ALERT_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: fieldy-discord
                      key: sre_alerts_webhook
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
