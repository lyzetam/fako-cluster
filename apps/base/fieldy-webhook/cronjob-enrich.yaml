apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fieldy-enrich-state
  namespace: fieldy-webhook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fieldy-enrich
  namespace: fieldy-webhook
  labels:
    app: fieldy-enrich
spec:
  # Daily at 16:30 UTC — 30 min after the puller (16:00 UTC) so the day's
  # conversations + transcripts are already on disk via the Obsidian REST API.
  # Reads those sidecars and writes LLM enrichment back via the same REST API.
  # LangGraph SQLite checkpointer lives on an emptyDir under FIELDY_STATE_DIR
  # (see the volumes block for why it is not a PVC).
  # See lyzetam/fieldy scripts/enrich.py.
  schedule: "30 16 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 21600  # 6h cap so a long run can't hang forever
      template:
        metadata:
          labels:
            app: fieldy-enrich
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-secret
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enrich
              image: lzetam/fieldy-webhook:v0.15.0
              # --limit 200 is a per-run cost/time safety rail so the first runs
              # chip through the ~3,500-conversation backlog gradually instead of
              # all at once. Raise or remove it once the backlog is cleared.
              command:
                - python
                - /app/scripts/enrich.py
                - --limit
                - "200"  # a bounded 200-run is proven reliable (completed cron 2026-06-04, 66m). Only the *unbounded* full sweep hit httpx PoolTimeout.
              env:
                - name: FIELDY_VAULT_MODE
                  value: "obsidian-api"
                - name: OBSIDIAN_API_URL
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-api
                      key: api_url
                - name: OBSIDIAN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-api
                      key: api_key
                - name: OBSIDIAN_VERIFY_TLS
                  value: "false"  # see CLAUDE.md
                - name: FIELDY_VAULT_REL_ROOT
                  value: "fieldy"
                - name: FIELDY_STATE_DIR
                  value: "/state"
                - name: FIELDY_ENRICH_BACKEND
                  value: "ollama"
                - name: OLLAMA_BASE_URL
                  value: "http://apisix.apisix.svc.cluster.local:9080"
                # The gateway requires key-auth; a keyless call 401s before the first token.
                - name: OLLAMA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: apisix-gateway-key
                      key: OLLAMA_API_KEY
                - name: OLLAMA_MODEL
                  value: "gpt-oss:20b"
                - name: FIELDY_ENRICH_CONCURRENCY
                  value: "2"  # lowered from 4: 4 concurrent deepagents + large transcripts OOMKilled at 1Gi
                # ANTHROPIC_* intentionally removed: enrichment runs on the local
                # ms3 Ollama model. With no cloud key in-env, the deepagents
                # claude-sonnet-4-6 default fails loud instead of silently billing.
                # Langfuse token-usage tracing (reuses the zi project keys).
                - name: LANGFUSE_HOST
                  value: "http://langfuse-web.langfuse.svc:3000"
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fieldy-langfuse
                      key: public_key
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fieldy-langfuse
                      key: secret_key
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 3Gi  # raised from 1Gi: deepagents + LangGraph + multi-thousand-segment transcripts
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: state
                  mountPath: /state
          volumes:
            # emptyDir, NOT the fieldy-enrich-state PVC. The PVC uses local-path,
            # so its PV carried a nodeAffinity pin to `aitower` — a node that no
            # longer exists in the cluster. That made this job permanently
            # unschedulable ("didn't match PersistentVolume's node affinity"),
            # and it sat Pending from 2026-07-24 to 2026-08-12.
            #
            # Nothing is lost. FIELDY_STATE_DIR holds only the LangGraph SQLite
            # checkpointer, and scripts/enrich.py generates a fresh timestamped
            # thread_id per run — so the checkpoint never resumes across runs.
            # Its useful lifetime is exactly one pod, which is what emptyDir is.
            # Idempotency comes from the vault (enriched.exists), not from here.
            - name: state
              emptyDir:
                sizeLimit: 256Mi
