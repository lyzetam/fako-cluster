apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fieldy-enrich-state
  namespace: fieldy-webhook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fieldy-enrich
  namespace: fieldy-webhook
  labels:
    app: fieldy-enrich
spec:
  # Daily at 16:30 UTC — 30 min after the puller (16:00 UTC) so the day's
  # conversations + transcripts are already on disk via the Obsidian REST API.
  # Reads those sidecars and writes LLM enrichment back via the same REST API.
  # LangGraph SQLite checkpointer lives on its own PVC under FIELDY_STATE_DIR
  # (see the volumes block — the PV was re-provisioned 2026-08-12).
  # See lyzetam/fieldy scripts/enrich.py.
  schedule: "30 16 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 21600  # 6h cap so a long run can't hang forever
      template:
        metadata:
          labels:
            app: fieldy-enrich
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-secret
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enrich
              image: lzetam/fieldy-webhook:v0.15.0
              # --limit is a per-run cost/time safety rail so runs chip through
              # the backlog gradually instead of all at once. See the value below.
              command:
                - python
                - /app/scripts/enrich.py
                - --limit
                # 50, not 200. Measured 2026-08-12: ~13 min per conversation at
                # concurrency 2 on gpt-oss:20b (planner + 4 subagents each), vs
                # the 66m/200 this job saw on 2026-06-04. At that rate a 200-run
                # cannot finish inside activeDeadlineSeconds (6h) and every run
                # would die DeadlineExceeded -> Failed while still making real
                # progress, making job status useless as a health signal.
                # 50 fits the window, so Failed means failed again. Raise it if
                # the backend gets faster.
                - "50"
              env:
                - name: FIELDY_VAULT_MODE
                  value: "obsidian-api"
                - name: OBSIDIAN_API_URL
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-api
                      key: api_url
                - name: OBSIDIAN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: obsidian-api
                      key: api_key
                - name: OBSIDIAN_VERIFY_TLS
                  value: "false"  # see CLAUDE.md
                - name: FIELDY_VAULT_REL_ROOT
                  value: "fieldy"
                - name: FIELDY_STATE_DIR
                  value: "/state"
                - name: FIELDY_ENRICH_BACKEND
                  value: "ollama"
                - name: OLLAMA_BASE_URL
                  value: "http://apisix.apisix.svc.cluster.local:9080"
                # The gateway requires key-auth; a keyless call 401s before the first token.
                - name: OLLAMA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: apisix-gateway-key
                      key: OLLAMA_API_KEY
                - name: OLLAMA_MODEL
                  value: "gpt-oss:20b"
                - name: FIELDY_ENRICH_CONCURRENCY
                  value: "2"  # lowered from 4: 4 concurrent deepagents + large transcripts OOMKilled at 1Gi
                # ANTHROPIC_* intentionally removed: enrichment runs on the local
                # ms3 Ollama model. With no cloud key in-env, the deepagents
                # claude-sonnet-4-6 default fails loud instead of silently billing.
                # Langfuse token-usage tracing (reuses the zi project keys).
                - name: LANGFUSE_HOST
                  value: "http://langfuse-web.langfuse.svc:3000"
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fieldy-langfuse
                      key: public_key
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fieldy-langfuse
                      key: secret_key
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 3Gi  # raised from 1Gi: deepagents + LangGraph + multi-thousand-segment transcripts
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: state
                  mountPath: /state
          volumes:
            # Back on the PVC, re-provisioned onto a live node. The original PV
            # was pinned by local-path to `aitower`, which was decommissioned —
            # that pin left this job unschedulable from 2026-07-24 to 08-12.
            # The stranded PVC was deleted on 2026-08-12 so local-path could
            # bind a fresh volume wherever the pod actually runs.
            #
            # Worth knowing: local-path re-pins to whichever node binds it, so
            # retiring THAT node reproduces the same failure. Nothing here is
            # precious — FIELDY_STATE_DIR holds only the LangGraph SQLite
            # checkpointer, and enrich.py uses a fresh thread_id per run, so it
            # never resumes across runs; idempotency comes from the vault via
            # enriched.exists(). If this pins you again, `emptyDir: {}` is a
            # drop-in replacement and loses nothing.
            - name: state
              persistentVolumeClaim:
                claimName: fieldy-enrich-state
