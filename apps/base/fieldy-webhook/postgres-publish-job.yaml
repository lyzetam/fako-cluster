# One-off Job: publish every conversation + its transcript segments from the
# vault into fieldy's own dedicated database (fieldy database, in the shared
# CloudNativePG cluster — not shared with plaud or any other project's data).
# Note: as of v0.21+ this ALSO happens automatically every day as steps 5-6 of
# cronjob-puller.yaml — this Job is for catching up history, not steady state.
#
# How to run it again (e.g. after a future backfill fills in more history):
#   1. Bump metadata.name (e.g. fieldy-postgres-publish-001 -> -002).
#   2. git add + commit + push. Flux reconciles within ~10m (or run
#      `flux reconcile kustomization apps --with-source`).
#   3. Watch: `kubectl logs -f -n fieldy-webhook -l job-name=<name>`
#   4. After it succeeds (ttl: 24h auto-cleans), leave or remove from
#      kustomization.yaml — it does no harm sitting completed.
#
# upsert_conversation is idempotent, so re-running this with no date window
# (the default — publishes everything in the vault) is always safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: fieldy-postgres-publish-002
  namespace: fieldy-webhook
  labels:
    app: fieldy-postgres-publish
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: fieldy-postgres-publish
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerhub-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-publish
          image: lzetam/fieldy-webhook:v0.21.0
          command:
            - python
            - /app/scripts/publish_postgres.py
          env:
            - name: FIELDY_VAULT_MODE
              value: "obsidian-api"
            # MIGRATED 2026-08-18: via vault-gateway, not the LAN host.
            - name: OBSIDIAN_API_URL
              value: "http://vault-gateway.vault-gateway.svc.cluster.local:8080"
            - name: OBSIDIAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: obsidian-api
                  key: api_key
            - name: FIELDY_VAULT_REL_ROOT
              value: "fieldy"
            - name: DATABASE_HOST
              value: "postgres-cluster-rw.postgres.svc.cluster.local"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "fieldy"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-env
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials-env
                  key: DATABASE_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
