# apps/base/arc-runners/externalsecret.yaml
#
# GitHub App credentials for the aeonhq runner scale set.
#
# REQUIRES an AWS Secrets Manager secret named `arc/github-app` holding three
# properties: app_id, installation_id, private_key. It does not exist yet —
# create it before this reconciles, or the ExternalSecret reports
# SecretSyncedError and no runners register.
#
# A GitHub App rather than a PAT: higher API rate limits under the
# controller's polling, org-scoped rather than tied to one person, and it
# survives that person rotating their token or leaving.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    # Key names are fixed by the gha-runner-scale-set chart. Do not rename.
    - secretKey: github_app_id
      remoteRef:
        key: arc/github-app
        property: app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc/github-app
        property: installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: arc/github-app
        property: private_key
