# Runner pods rank below every ordinary workload (default priority is 0) and
# never preempt anything. When the cluster is full, a CI job waits for room
# instead of evicting an app, and under memory pressure the kubelet evicts
# runners before the apps around them.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-runner
value: -100
preemptionPolicy: Never
globalDefault: false
description: GitHub Actions runner pods in arc-runners. Lowest priority, never preempts.
