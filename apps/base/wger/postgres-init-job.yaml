apiVersion: batch/v1
kind: Job
metadata:
  name: wger-db-init
  namespace: wger
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: postgres-init
        image: postgres:17-alpine
        command:
        - /bin/sh
        - -c
        - |
          set -euo pipefail
          # Wait for Postgres (NetworkPolicy may lag a brand-new pod by ~1s): backoff 1,2,4,8,15s (~30s).
          WAIT_HOST="postgres-cluster-rw.postgres.svc.cluster.local"
          pg_ok=0
          for d in 1 2 4 8 15; do
            if pg_isready -h "$WAIT_HOST" -p 5432 -t 3; then pg_ok=1; break; fi
            echo "postgres not reachable yet, retrying in ${d}s"; sleep "$d"
          done
          if [ "$pg_ok" != 1 ]; then pg_isready -h "$WAIT_HOST" -p 5432 -t 3 || { echo "ERROR: postgres unreachable after ~30s" >&2; exit 1; }; fi
          # Every psql call stops on the first SQL error and exits nonzero.
          psql() { command psql -v ON_ERROR_STOP=1 "$@"; }

          echo "Initializing wger database..."
          
          # Create database if it doesn't exist
          db_exists="$(PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-cluster-rw.postgres.svc.cluster.local -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'wger'")"
          if [ "$db_exists" != "1" ]; then PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-cluster-rw.postgres.svc.cluster.local -U postgres -c "CREATE DATABASE wger"; fi
          
          # Create user if it doesn't exist
          usr_exists="$(PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-cluster-rw.postgres.svc.cluster.local -U postgres -tAc "SELECT 1 FROM pg_user WHERE usename = 'wger'")"
          if [ "$usr_exists" != "1" ]; then PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-cluster-rw.postgres.svc.cluster.local -U postgres -c "CREATE USER wger WITH PASSWORD '$WGER_PASSWORD'"; fi
          
          # Grant privileges
          PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-cluster-rw.postgres.svc.cluster.local -U postgres -c "ALTER USER wger WITH SUPERUSER"
          PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-cluster-rw.postgres.svc.cluster.local -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE wger TO wger"
          
          # Grant schema permissions
          PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres-cluster-rw.postgres.svc.cluster.local -U postgres -d wger -c "GRANT ALL ON SCHEMA public TO wger"
          
          echo "Database initialization complete!"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-cluster-superuser
              key: password
        - name: WGER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wger-db-credentials
              key: dbpw