# Harvest: read the TLDR newsletters, open every linked article, store the full text in
# the Obsidian vault and mail a copy to AgentMail. No summarizing happens here — the
# enricher adds that from the stored text, so a better prompt can be re-run without
# refetching a hundred articles.
#
# Replaces the `TLDR Digest` managed agent, paused 2026-08-08. See
# github.com/lyzetam/tldr-pipeline/docs/adr/0001 for why.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tldr-harvest
  namespace: tldr-pipeline
  labels:
    app.kubernetes.io/name: tldr-pipeline
    app.kubernetes.io/component: harvest
    app.kubernetes.io/part-of: tldr-pipeline
    app.kubernetes.io/managed-by: flux
spec:
  # 15:00 UTC (11:00 ET), chosen from six days of measured arrival times rather than
  # guessed. The editions land in a fixed order and TLDR AI is always last:
  #
  #   TLDR Product 10:16-10:17   TLDR Dev      11:29-11:43
  #   TLDR         10:31-11:17   TLDR Crypto   12:18-12:34
  #   TLDR DevOps  11:30-11:34   TLDR Founders 12:33-12:43
  #   TLDR InfoSec 13:18-13:30   TLDR AI       13:50-14:12
  #
  # The first schedule here was 13:15, which missed InfoSec and AI *every day* — they
  # would have been picked up 24h late and filed under the previous date. 15:00 leaves
  # ~48 minutes past the latest arrival ever seen. If TLDR slips later than that the
  # ledger still catches it next run; this only decides whether that is routine or rare.
  schedule: "0 15 * * 1-5"   # UTC. TLDR does not publish at weekends.
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      # A full day is ~100 articles fetched at concurrency 6, plus one AgentMail send
      # every 3.6s and two 60s verification waits. Observed runs are well under 30min;
      # this leaves room for a slow day without letting a hung run linger.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tldr-pipeline
            app.kubernetes.io/component: harvest
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          imagePullSecrets:
            - name: dockerhub-registry
          containers:
            - name: harvest
              image: lzetam/tldr-pipeline:latest
              imagePullPolicy: Always
              args: ["--apply"]          # the entrypoint is dry without this
              envFrom:
                - secretRef:
                    name: tldr-pipeline-secrets
              env:
                - name: HOME
                  value: /tmp
                # Ollama Cloud by decision — the in-cluster GPU is down until further
                # notice. Point this at http://ollama-gpu.ollama.svc.cluster.local:11434
                # to bring inference home; no other change is needed.
                - name: TLDR_OLLAMA_BASE
                  value: "https://ollama.com"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
