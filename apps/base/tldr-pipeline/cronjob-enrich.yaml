# Enrich: read notes harvest already stored, summarize them and write carousel angles,
# then update the same files in place. Never touches Gmail and never opens a URL — the
# article text is already on disk.
#
# Runs after harvest rather than as part of it because the two fail differently. A
# fetch is worth doing once; a summary is worth re-running whenever the prompt improves.
# Anything left unenriched stays `enriched: false` and is picked up by the next run, so
# a bad night self-heals with no bookkeeping.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tldr-enrich
  namespace: tldr-pipeline
  labels:
    app.kubernetes.io/name: tldr-pipeline
    app.kubernetes.io/component: enrich
    app.kubernetes.io/part-of: tldr-pipeline
    app.kubernetes.io/managed-by: flux
spec:
  # 02:00 UTC (22:00 ET the evening before) — overnight, deliberately.
  #
  # Enrichment has no time pressure: it reads article text already on disk, so nothing
  # decays while it waits. Harvest is the only phase with a clock, and even that is
  # slack (Gmail's window is 14 days). Meanwhile the Mac fleet is in use during the day
  # — all three nodes had models loaded at 15:00 — and local inference is far slower
  # than the cloud it replaced, so it wants hours and an idle fleet rather than a
  # half-hour slot behind harvest.
  #
  # Runs Tue-Sat because it processes the PREVIOUS weekday's harvest.
  schedule: "0 2 * * 2-6"   # UTC
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      # ~100 notes at two model calls each, concurrency 6, plus re-mailing only what
      # changed. On Ollama Cloud a 96-note backfill took about eight minutes; the local
      # fleet is far slower (141s for a first summarize against ~4s), so this needs
      # real headroom. Anything unfinished stays `enriched: false` and retries tomorrow.
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tldr-pipeline
            app.kubernetes.io/component: enrich
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          imagePullSecrets:
            - name: dockerhub-registry
          containers:
            - name: enrich
              image: lzetam/tldr-pipeline:latest
              imagePullPolicy: Always
              command: ["tldr-enrich"]  # the image entrypoint is the harvest run
              args: ["--apply"]         # both commands are dry without this
              envFrom:
                - secretRef:
                    name: tldr-pipeline-secrets
              env:
                - name: HOME
                  value: /tmp
                # Ollama Cloud by decision — the in-cluster GPU is down until further
                # notice. Point this at http://ollama-gpu.ollama.svc.cluster.local:11434
                # to bring inference home; no other change is needed.
                # The APISIX gateway fronts the local Mac fleet (ms1-3) with
                # round-robin and health checks. Set to https://ollama.com to fall
                # back to the cloud, or to a node directly to bypass the gateway.
                - name: TLDR_OLLAMA_BASE
                  value: "http://apisix.apisix.svc.cluster.local:9080"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
