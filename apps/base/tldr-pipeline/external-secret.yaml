# Everything the pipeline needs, pulled from AWS Secrets Manager. The pod holds no AWS
# credentials of its own — config.py reads these straight from the environment and only
# falls back to shelling out to `aws` when running on a laptop.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tldr-pipeline-secrets
  namespace: tldr-pipeline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: tldr-pipeline-secrets
    creationPolicy: Owner
  data:
    # Gmail, read-only. The OAuth app is published to Production, so this refresh token
    # does not expire after 7 days the way a Testing-mode one does.
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google/tldr-digest-oauth
        property: client_id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: google/tldr-digest-oauth
        property: client_secret
    - secretKey: GOOGLE_REFRESH_TOKEN
      remoteRef:
        key: google/tldr-digest-oauth
        property: refresh_token
    # Obsidian vault — this key is scoped to Reading/TLDR/** and nothing else.
    - secretKey: OBSIDIAN_TOKEN
      remoteRef:
        key: obsidian/api-clients
        property: morning-brief
    # Stored as a bare string, not JSON — no `property` to select. Asking for one
    # fails the whole ExternalSecret with "key api_key does not exist".
    - secretKey: AGENTMAIL_API_KEY
      remoteRef:
        key: agentmail/api-key
    # Ollama Cloud. Drop this once inference moves back in-cluster: a local endpoint
    # needs no credential, and llm.py only sends the header for the cloud host.
    - secretKey: OLLAMA_API_KEY
      remoteRef:
        key: /fako/openwebui/ollama-cloud-api-key
        property: api_key
    # The enricher bills separately: harvest calls a model only when the parser fails,
    # the enricher calls one twice per article, every article.
    - secretKey: OLLAMA_ENRICH_API_KEY
      remoteRef:
        key: ollama/tldr-enricher
        property: api_key
    # Where failures shout. Without this the pipeline is silent on failure, and a
    # failed harvest is indistinguishable from a quiet day — which is how 2026-08-11
    # sat broken for eight hours.
    # APISIX gateway consumer key. Inference now goes through the gateway to the local
    # Mac fleet rather than Ollama Cloud, which started returning 402 on 2026-08-12.
    - secretKey: APISIX_KEY
      remoteRef:
        key: social-media-content/apisix-gateway-key
        property: api_key
    - secretKey: DISCORD_WEBHOOK_SRE
      remoteRef:
        key: discord/webhook
        property: sre_alerts
