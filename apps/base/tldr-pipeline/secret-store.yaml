# Per-namespace SecretStore. There is no ClusterSecretStore in this cluster — every
# namespace carries its own, backed by an `aws-credentials` Secret supplied by the
# overlay (SOPS-encrypted in git).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: tldr-pipeline
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
