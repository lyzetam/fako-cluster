apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: social-media
resources:
  # SOPS-encrypted bootstrap AWS creds — the SecretStore in the base needs these
  # in-namespace before any ExternalSecret can sync. Decrypted by Flux with the
  # cluster age key.
  - aws-credentials-secret.yaml
  - ../../base/social-media/
